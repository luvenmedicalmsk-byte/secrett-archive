version: "3.9"

# ════════════════════════════════════════════════════════════════════════
# Sovereign Intelligence Platform v5 — PRODUCTION
# ════════════════════════════════════════════════════════════════════════
# Start:  docker compose -f docker-compose.prod.yml up -d
# Logs:   docker compose -f docker-compose.prod.yml logs -f --tail=100
# Stop:   docker compose -f docker-compose.prod.yml down
# Status: docker compose -f docker-compose.prod.yml ps
# ════════════════════════════════════════════════════════════════════════

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:

  # ── Redis 7.2 — hardened persistence ──────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: intel_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 32mb
      --save 900 1
      --save 300 10
      --save 60 1000
      --tcp-keepalive 60
      --timeout 300
      --loglevel notice
      --latency-tracking yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - intel_net
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Gateway — hardened FastAPI + WebSocket ─────────────────────────────
  gateway:
    build:
      context: ..
      dockerfile: v5/deploy/Dockerfile.gateway
    image: intel_gateway:prod
    container_name: intel_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      REDIS_URL:         redis://redis:6379
      SNAPSHOT_URL:      ${SNAPSHOT_URL:-https://secrett-archive.com/docs/events.json}
      LOG_LEVEL:         ${LOG_LEVEL:-info}
      MAX_WS_CLIENTS:    ${MAX_WS_CLIENTS:-200}
      RATE_LIMIT_RPS:    ${RATE_LIMIT_RPS:-30}
      PAYLOAD_MAX_BYTES: ${PAYLOAD_MAX_BYTES:-65536}
      WS_MSG_MAX_BYTES:  ${WS_MSG_MAX_BYTES:-4096}
      RECONNECT_MIN_MS:  ${RECONNECT_MIN_MS:-1000}
    command: >
      python -m uvicorn gateway.gateway_hardened:app
      --host 0.0.0.0 --port 8080
      --log-level ${LOG_LEVEL:-info}
      --workers 1
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - intel_net
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"

  # ── Ingestion — hardened workers ───────────────────────────────────────
  ingestion:
    build:
      context: ..
      dockerfile: v5/deploy/Dockerfile.ingestion
    image: intel_ingestion:prod
    container_name: intel_ingestion
    restart: unless-stopped
    environment:
      REDIS_URL:            redis://redis:6379
      FIRMS_API_KEY:        ${FIRMS_API_KEY:-}
      NEWS_API_KEY:         ${NEWS_API_KEY:-}
      OPENAI_API_KEY:       ${OPENAI_API_KEY:-}
      LOG_LEVEL:            ${LOG_LEVEL:-info}
      MAX_EVENTS_PER_CYCLE: ${MAX_EVENTS_PER_CYCLE:-200}
      REDIS_WAIT_TIMEOUT_S: 120
    command: python workers/ingestion_hardened.py
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: >
        python3 -c
        "import redis, os; r=redis.from_url(os.environ['REDIS_URL'],
        socket_connect_timeout=3); r.ping()"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - intel_net
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"

  # ── Watchdog — container supervisor ───────────────────────────────────
  watchdog:
    build:
      context: ..
      dockerfile: v5/deploy/Dockerfile.watchdog
    image: intel_watchdog:prod
    container_name: intel_watchdog
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      REDIS_URL:        redis://redis:6379
      WATCH_CONTAINERS: intel_gateway,intel_ingestion
      CHECK_INTERVAL_S: 60
      MAX_DLQ_SIZE:     500
      MAX_RETRY_SIZE:   200
      LOG_LEVEL:        ${LOG_LEVEL:-info}
    command: python workers/watchdog.py
    depends_on:
      - gateway
      - ingestion
    networks:
      - intel_net
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: "0.10"

volumes:
  redis_data:
    driver: local

networks:
  intel_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
