<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Архив · Карта рисков</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#B8973A;--gold-l:#D4AF5A;--gold-d:#7A6228;
  --cyan:#1FAACC;--bg:#060504;--bg2:#0D0B08;--bg3:#141210;
  --cream:#E8E0D0;--muted:#6A6458;--soft:#A8A090;
  --border:rgba(184,151,58,0.15);
  --domain-climate:#1FAACC;--domain-economy:#B8973A;
  --domain-geopolitics:#C84B4B;--domain-technology:#7B5EA7;--domain-social:#4B8C5E;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Montserrat',sans-serif;font-weight:300}

/* ── AUTH SCREEN ──────────────────────────────────────────────────────────── */
#auth-screen{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;
}
#auth-glyph{
  font-family:'Cormorant Garamond',serif;font-size:72px;font-weight:300;
  color:var(--gold);opacity:0.15;line-height:1;margin-bottom:32px;
  letter-spacing:-0.02em;
}
#auth-title{
  font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;
  color:var(--gold-l);letter-spacing:0.12em;margin-bottom:8px;text-align:center;
}
#auth-sub{
  font-size:10px;color:var(--muted);letter-spacing:0.25em;text-transform:uppercase;
  margin-bottom:48px;text-align:center;
}
#auth-desc{
  font-size:12px;color:var(--soft);line-height:1.7;text-align:center;
  max-width:280px;margin-bottom:36px;
}
#tg-widget-wrap{
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
#auth-error{
  font-size:11px;color:#C84B4B;text-align:center;max-width:260px;
  line-height:1.6;display:none;margin-top:8px;
}
#auth-hint{
  font-size:10px;color:var(--muted);text-align:center;margin-top:32px;
  letter-spacing:0.05em;line-height:1.6;
}
#auth-hint a{color:var(--gold);text-decoration:none}
#auth-hint a:hover{text-decoration:underline}

/* Декор линия */
.auth-divider{
  width:40px;height:1px;background:var(--border);margin:0 auto 32px;
}

/* ── ЗАГРУЗКА ─────────────────────────────────────────────────────────────── */
#loading{
  position:fixed;inset:0;z-index:90;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loading.active{display:flex}
#loading-title{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;color:var(--gold-l);letter-spacing:0.15em}
#loading-sub{font-size:10px;color:var(--muted);letter-spacing:0.3em;text-transform:uppercase}
#loading-bar{width:160px;height:1px;background:var(--border);overflow:hidden}
#loading-progress{height:100%;background:var(--gold);width:0;transition:width 0.4s ease}

/* ── КАРТА (скрыта до авторизации) ──────────────────────────────────────── */
#map-screen{display:none;position:fixed;inset:0}
#map-screen.active{display:block}
#canvas{position:absolute;inset:0;z-index:1}

/* ── UI поверх карты ─────────────────────────────────────────────────────── */
#ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
#header{padding:16px 20px 0;pointer-events:all;display:flex;align-items:center;justify-content:space-between}
#logo{display:flex;align-items:baseline;gap:10px}
#logo-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:400;color:var(--gold-l);letter-spacing:0.08em}
#logo-sub{font-size:9px;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase}
#user-badge{
  font-size:10px;color:var(--muted);letter-spacing:0.08em;
  display:flex;align-items:center;gap:8px;pointer-events:all;
}
#logout-btn{
  font-size:9px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;
  background:none;border:1px solid var(--border);padding:3px 8px;cursor:pointer;
  border-radius:1px;transition:all 0.2s;font-family:'Montserrat',sans-serif;
}
#logout-btn:hover{border-color:var(--gold);color:var(--gold)}

#filters{padding:12px 20px;pointer-events:all;display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  padding:5px 12px;border:1px solid var(--border);background:rgba(13,11,8,0.7);
  color:var(--soft);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:400;
  letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;
  transition:all 0.2s;backdrop-filter:blur(4px);
}
.filter-btn:hover{border-color:var(--gold);color:var(--gold-l)}
.filter-btn.active{color:var(--bg);font-weight:500}
.filter-btn[data-domain="all"].active{background:var(--gold);border-color:var(--gold)}
.filter-btn[data-domain="climate"].active{background:var(--domain-climate);border-color:var(--domain-climate)}
.filter-btn[data-domain="economy"].active{background:var(--domain-economy);border-color:var(--domain-economy)}
.filter-btn[data-domain="geopolitics"].active{background:var(--domain-geopolitics);border-color:var(--domain-geopolitics)}
.filter-btn[data-domain="technology"].active{background:var(--domain-technology);border-color:var(--domain-technology)}
.filter-btn[data-domain="social"].active{background:var(--domain-social);border-color:var(--domain-social)}

#spacer{flex:1}
#stats-bar{padding:0 20px 12px;pointer-events:all;display:flex;gap:20px}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--gold-l);line-height:1;display:block}
.stat-label{font-size:9px;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase;display:block}

/* ── БОКОВАЯ ПАНЕЛЬ ──────────────────────────────────────────────────────── */
#sidebar{
  position:fixed;right:0;top:0;bottom:0;width:300px;z-index:3;
  background:rgba(6,5,4,0.93);border-left:1px solid var(--border);
  backdrop-filter:blur(16px);transform:translateX(100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;
}
#sidebar.open{transform:translateX(0)}
#sidebar-close{
  position:absolute;top:14px;left:14px;width:26px;height:26px;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;
  border-radius:2px;transition:all 0.2s;
}
#sidebar-close:hover{border-color:var(--gold);color:var(--gold)}
#event-list{flex:1;overflow-y:auto;padding:50px 0 16px}
#event-list::-webkit-scrollbar{width:2px}
#event-list::-webkit-scrollbar-thumb{background:var(--border)}
.event-item{padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer;transition:background 0.15s}
.event-item:hover{background:rgba(184,151,58,0.05)}
.event-item.selected{background:rgba(184,151,58,0.08);border-left:2px solid var(--gold)}
.event-domain-tag{font-size:8px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.event-domain-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.event-title{font-size:11px;color:var(--cream);line-height:1.4;margin-bottom:5px}
.event-meta{font-size:9px;color:var(--muted);display:flex;justify-content:space-between}
.severity-bar{height:1px;background:rgba(184,151,58,0.1);margin-top:6px}
.severity-fill{height:100%;transition:width 0.3s}

/* ── ДЕТАЛИ СОБЫТИЯ ──────────────────────────────────────────────────────── */
#event-detail{
  position:fixed;right:0;top:0;bottom:0;width:300px;z-index:4;
  background:rgba(6,5,4,0.96);border-left:1px solid var(--border);
  backdrop-filter:blur(16px);transform:translateX(100%);transition:transform 0.3s ease;
  padding:18px;overflow-y:auto;
}
#event-detail.open{transform:translateX(0)}
#detail-close{width:26px;height:26px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;border-radius:2px;transition:all 0.2s;margin-bottom:18px}
#detail-close:hover{border-color:var(--gold);color:var(--gold)}
#detail-domain{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:5px}
#detail-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:var(--cream);line-height:1.3;margin-bottom:12px}
#detail-region{font-size:10px;color:var(--muted);margin-bottom:16px;letter-spacing:0.05em}
#detail-severity-label{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
#detail-severity-bar{height:2px;background:rgba(184,151,58,0.1);margin-bottom:16px}
#detail-severity-fill{height:100%}
#detail-summary{font-size:12px;color:var(--soft);line-height:1.7;margin-bottom:16px}
#detail-source{font-size:9px;color:var(--muted);border-top:1px solid var(--border);padding-top:10px;display:flex;justify-content:space-between}

#list-toggle{position:fixed;bottom:18px;right:18px;z-index:10;padding:9px 16px;background:rgba(13,11,8,0.9);border:1px solid var(--border);color:var(--soft);font-family:'Montserrat',sans-serif;font-size:10px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;backdrop-filter:blur(8px);transition:all 0.2s}
#list-toggle:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<!-- ── ЭКРАН АВТОРИЗАЦИИ ─────────────────────────────────────────────────── -->
<div id="auth-screen">
  <div id="auth-glyph">⌬</div>
  <div id="auth-title">КАРТА РИСКОВ</div>
  <div id="auth-sub">Архив · Великое пробуждение</div>
  <div class="auth-divider"></div>
  <div id="auth-desc">
    Закрытый инструмент для читателей Архива.<br>
    Войдите через Telegram для подтверждения доступа.
  </div>
  <div id="tg-widget-wrap">
    <!-- Telegram Login Widget вставляется здесь -->
    <!-- ЗАМЕНИТЕ YOUR_BOT_USERNAME на username вашего бота (без @) -->
    <script
      async
      src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="archivemiabot"
      data-size="large"
      data-radius="2"
      data-onauth="onTelegramAuth(user)"
      data-request-access="write">
    </script>
    <div id="auth-error"></div>
  </div>
  <div id="auth-hint">
    Нет доступа к Архиву?<br>
    <a href="https://secrett-archive.com" target="_blank">secrett-archive.com</a>
  </div>
</div>

<!-- ── ЗАГРУЗКА КАРТЫ ────────────────────────────────────────────────────── -->
<div id="loading">
  <div id="loading-title">АРХИВ</div>
  <div id="loading-sub">Загрузка карты рисков</div>
  <div id="loading-bar"><div id="loading-progress"></div></div>
</div>

<!-- ── КАРТА ─────────────────────────────────────────────────────────────── -->
<div id="map-screen">
  <svg id="canvas"></svg>
</div>

<div id="ui" style="display:none">
  <div id="header">
    <div id="logo">
      <span id="logo-title">АРХИВ · КАРТА РИСКОВ</span>
      <span id="logo-sub">Закрытый доступ</span>
    </div>
    <div id="user-badge">
      <span id="user-name"></span>
      <button id="logout-btn">Выход</button>
    </div>
  </div>
  <div id="filters">
    <button class="filter-btn active" data-domain="all">Все</button>
    <button class="filter-btn" data-domain="climate">Климат</button>
    <button class="filter-btn" data-domain="economy">Экономика</button>
    <button class="filter-btn" data-domain="geopolitics">Геополитика</button>
    <button class="filter-btn" data-domain="technology">Технологии</button>
    <button class="filter-btn" data-domain="social">Социум</button>
  </div>
  <div id="spacer"></div>
  <div id="stats-bar">
    <div><span class="stat-val" id="stat-events">0</span><span class="stat-label">Событий</span></div>
    <div><span class="stat-val" id="stat-critical">0</span><span class="stat-label">Критичных</span></div>
    <div><span class="stat-val" id="stat-avg">0</span><span class="stat-label">Ср. индекс</span></div>
  </div>
</div>

<div id="sidebar">
  <button id="sidebar-close">✕</button>
  <div id="event-list"></div>
</div>
<div id="event-detail">
  <button id="detail-close">✕</button>
  <div id="detail-domain"></div>
  <div id="detail-title"></div>
  <div id="detail-region"></div>
  <div id="detail-severity-label"><span>Индекс угрозы</span><span id="detail-severity-val"></span></div>
  <div id="detail-severity-bar"><div id="detail-severity-fill"></div></div>
  <div id="detail-summary"></div>
  <div id="detail-source"><span id="detail-source-name"></span><span id="detail-date"></span></div>
</div>
<button id="list-toggle" style="display:none">Список событий ↗</button>

<script>
// ── КОНФИГУРАЦИЯ ─────────────────────────────────────────────────────────────
// ЗАМЕНИТЕ на URL вашего Cloudflare Worker после деплоя
const WORKER_URL = 'https://archive-auth.luven-medical-msk.workers.dev';
const SESSION_KEY = 'archive_risk_session';

const DOMAIN_COLORS = {
  climate:'#1FAACC', economy:'#B8973A',
  geopolitics:'#C84B4B', technology:'#7B5EA7', social:'#4B8C5E'
};
const DOMAIN_LABELS = {
  climate:'Климат', economy:'Экономика',
  geopolitics:'Геополитика', technology:'Технологии', social:'Социум'
};

let allEvents = [], filteredEvents = [], activeFilter = 'all', selectedEvent = null;
let projection, path, svg, g;

// ── АВТОРИЗАЦИЯ ───────────────────────────────────────────────────────────────

// Вызывается Telegram-виджетом после входа
async function onTelegramAuth(user) {
  showError('');
  try {
    const res = await fetch(`${WORKER_URL}/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(user),
    });
    const data = await res.json();

    if (res.status === 403) {
      showError('Доступ только для читателей Архива.<br>Оформите подписку на <a href="https://secrett-archive.com" target="_blank">secrett-archive.com</a>');
      return;
    }
    if (!data.ok) {
      showError('Ошибка авторизации. Попробуйте ещё раз.');
      return;
    }

    // Сохраняем токен
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      token: data.token,
      name: data.user.first_name,
      username: data.user.username,
    }));

    enterMap(data.user.first_name);
  } catch (e) {
    showError('Не удалось подключиться к серверу. Попробуйте позже.');
  }
}

async function checkExistingSession() {
  const raw = localStorage.getItem(SESSION_KEY);
  if (!raw) return false;

  try {
    const session = JSON.parse(raw);
    const res = await fetch(`${WORKER_URL}/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: session.token }),
    });
    const data = await res.json();
    if (data.ok) {
      enterMap(session.name);
      return true;
    }
  } catch {}

  localStorage.removeItem(SESSION_KEY);
  return false;
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.innerHTML = msg;
  el.style.display = msg ? 'block' : 'none';
}

function logout() {
  localStorage.removeItem(SESSION_KEY);
  location.reload();
}

// ── ВХОД В КАРТУ ──────────────────────────────────────────────────────────────

async function enterMap(userName) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('loading').classList.add('active');
  document.getElementById('user-name').textContent = userName || '';

  setProgress(10);
  const [world, data] = await Promise.all([loadWorld(), loadEvents()]);
  setProgress(85);

  allEvents = data.events || [];
  filteredEvents = allEvents;

  initGlobe(world);
  renderMarkers();
  renderList();
  updateStats();
  setProgress(100);

  setTimeout(() => {
    document.getElementById('loading').classList.remove('active');
    document.getElementById('map-screen').classList.add('active');
    document.getElementById('ui').style.display = 'flex';
    document.getElementById('list-toggle').style.display = 'block';
  }, 400);
}

// ── ДАННЫЕ ────────────────────────────────────────────────────────────────────

function setProgress(v) { document.getElementById('loading-progress').style.width = v + '%' }

async function loadWorld() {
  const r = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  return r.json();
}

async function loadEvents() {
  try {
    const r = await fetch('events.json?t=' + Date.now());
    return r.json();
  } catch { return { events: [] } }
}

// ── ГЛОБУС ────────────────────────────────────────────────────────────────────

function domainColor(d) { return DOMAIN_COLORS[d] || '#B8973A' }
function severityColor(s) { return s >= 85 ? '#C84B4B' : s >= 70 ? '#B8973A' : '#1FAACC' }
function formatDate(iso) {
  return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}

function initGlobe(world) {
  const W = window.innerWidth, H = window.innerHeight;
  const scale = Math.min(W, H) * 0.42;
  svg = d3.select('#canvas').attr('width', W).attr('height', H);
  projection = d3.geoOrthographic().scale(scale).rotate([-20,-25]).translate([W/2,H/2]);
  path = d3.geoPath().projection(projection);
  g = svg.append('g');

  g.append('circle').attr('cx',W/2).attr('cy',H/2).attr('r',projection.scale())
    .attr('fill','#0A0C10').attr('stroke','#1a1814').attr('stroke-width',1);

  const land = topojson.feature(world, world.objects.countries);
  const borders = topojson.mesh(world, world.objects.countries, (a,b)=>a!==b);
  g.append('path').datum(land).attr('d',path).attr('fill','#141210');
  g.append('path').datum(borders).attr('d',path).attr('fill','none')
    .attr('stroke','rgba(184,151,58,0.12)').attr('stroke-width',0.4);

  let rotating = true, timer;
  function startRotation() {
    timer = d3.timer(() => {
      if (!rotating) return;
      const r = projection.rotate();
      projection.rotate([r[0]+0.08, r[1]]);
      g.selectAll('path').attr('d', path);
      updateMarkers();
    });
  }

  let ds = null;
  svg.call(d3.drag()
    .on('start', e => { rotating=false; if(timer)timer.stop(); ds={x:e.x,y:e.y,rot:[...projection.rotate()]} })
    .on('drag', e => { if(!ds)return; projection.rotate([ds.rot[0]+(e.x-ds.x)*0.3, ds.rot[1]-(e.y-ds.y)*0.3]); g.selectAll('path').attr('d',path); updateMarkers() })
    .on('end', () => { ds=null; setTimeout(()=>{rotating=true;startRotation()},3000) })
  );
  startRotation();

  window.addEventListener('resize', () => {
    const nW=innerWidth,nH=innerHeight;
    svg.attr('width',nW).attr('height',nH);
    projection.translate([nW/2,nH/2]);
    g.selectAll('path').attr('d',path);
    updateMarkers();
  });
}

function renderMarkers() {
  g.selectAll('.event-marker').remove();
  filteredEvents.forEach(ev => {
    const [x,y] = projection([ev.lng,ev.lat])||[null,null];
    if(x===null)return;
    const r = 4+(ev.severity-50)*0.08;
    const col = domainColor(ev.domain);
    const mg = g.append('g').attr('class','event-marker').attr('transform',`translate(${x},${y})`).attr('data-id',ev.id).style('cursor','pointer');
    if(ev.severity>=80) mg.append('circle').attr('r',r+4).attr('fill',col).attr('opacity',0.15);
    mg.append('circle').attr('r',r).attr('fill',col).attr('opacity',ev.severity>=80?0.9:0.7).attr('stroke','#060504').attr('stroke-width',0.5);
    mg.on('click',()=>showEventDetail(ev));
  });
}

function updateMarkers() {
  g.selectAll('.event-marker').each(function() {
    const el=d3.select(this);
    const ev=allEvents.find(e=>e.id===el.attr('data-id'));
    if(!ev)return;
    const [x,y]=projection([ev.lng,ev.lat])||[null,null];
    if(x!==null) el.attr('transform',`translate(${x},${y})`);
  });
}

function applyFilter(domain) {
  activeFilter=domain;
  filteredEvents=domain==='all'?allEvents:allEvents.filter(e=>e.domain===domain);
  renderMarkers(); renderList(); updateStats();
}

function updateStats() {
  document.getElementById('stat-events').textContent=filteredEvents.length;
  document.getElementById('stat-critical').textContent=filteredEvents.filter(e=>e.severity>=80).length;
  const avg=filteredEvents.length?Math.round(filteredEvents.reduce((s,e)=>s+e.severity,0)/filteredEvents.length):0;
  document.getElementById('stat-avg').textContent=avg;
}

function renderList() {
  const list=document.getElementById('event-list');
  list.innerHTML='';
  [...filteredEvents].sort((a,b)=>b.severity-a.severity).forEach(ev=>{
    const col=domainColor(ev.domain);
    const item=document.createElement('div');
    item.className='event-item'+(selectedEvent?.id===ev.id?' selected':'');
    item.innerHTML=`<div class="event-domain-tag" style="color:${col}"><div class="event-domain-dot" style="background:${col}"></div>${DOMAIN_LABELS[ev.domain]}</div><div class="event-title">${ev.title}</div><div class="event-meta"><span>${ev.region}</span><span>${formatDate(ev.date)}</span></div><div class="severity-bar"><div class="severity-fill" style="width:${ev.severity}%;background:${severityColor(ev.severity)}"></div></div>`;
    item.onclick=()=>showEventDetail(ev);
    list.appendChild(item);
  });
}

function showEventDetail(ev) {
  selectedEvent=ev;
  const col=domainColor(ev.domain);
  document.getElementById('detail-domain').innerHTML=`<div style="width:4px;height:4px;border-radius:50%;background:${col}"></div><span style="color:${col}">${DOMAIN_LABELS[ev.domain]}</span>`;
  document.getElementById('detail-title').textContent=ev.title;
  document.getElementById('detail-region').textContent=ev.region;
  document.getElementById('detail-severity-val').textContent=ev.severity+' / 100';
  document.getElementById('detail-severity-fill').style.cssText=`width:${ev.severity}%;background:${severityColor(ev.severity)}`;
  document.getElementById('detail-summary').textContent=ev.summary;
  document.getElementById('detail-source-name').textContent='Источник: '+ev.source;
  document.getElementById('detail-date').textContent=formatDate(ev.date);
  document.getElementById('event-detail').classList.add('open');
  document.getElementById('sidebar').classList.remove('open');
  renderList();
  const [x,y]=projection([ev.lng,ev.lat])||[null,null];
  if(x!==null){
    const rot=projection.rotate();
    let i=0;const tl=-ev.lng,tt=-ev.lat*0.5,cl=rot[0],ct=rot[1];
    const t=d3.timer(()=>{i++;const e=1-Math.pow(1-i/40,3);projection.rotate([cl+(tl-cl)*e,ct+(tt-ct)*e]);g.selectAll('path').attr('d',path);updateMarkers();if(i>=40)t.stop()});
  }
}

// ── СОБЫТИЯ UI ────────────────────────────────────────────────────────────────

document.getElementById('detail-close').onclick=()=>{document.getElementById('event-detail').classList.remove('open');selectedEvent=null;renderList()};
document.getElementById('sidebar-close').onclick=()=>document.getElementById('sidebar').classList.remove('open');
document.getElementById('list-toggle').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('event-detail').classList.remove('open')};
document.getElementById('logout-btn').onclick=logout;
document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.onclick=()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');applyFilter(btn.dataset.domain)};
});

// ── СТАРТ ─────────────────────────────────────────────────────────────────────

checkExistingSession();
</script>
</body>
</html>
