name: WRI Aqueduct (разовая выгрузка)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aqueduct
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl
      - run: python3 scripts/infra/build_aqueduct.py
      - uses: actions/upload-artifact@v4
        with:
          name: aqueduct
          path: docs/infra/aqueduct_v4.json
          retention-days: 7
