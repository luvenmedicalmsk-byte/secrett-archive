name: WRI Aqueduct (разовая выгрузка)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aqueduct
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl
      - run: python3 scripts/infra/build_aqueduct.py
      - run: |
          ls -la docs/infra/aqueduct_v4.json
          echo "AQB64_BEGIN"
          gzip -9c docs/infra/aqueduct_v4.json | base64 -w 0 | fold -w 3000 | sed 's/^/AQB64:/'
          echo "AQB64_END"
