name: WRI Aqueduct (разовая выгрузка)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aqueduct
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q openpyxl
      - run: python3 scripts/infra/build_aqueduct.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/infra/aqueduct_v4.json
          git commit -m "AQUEDUCT_2511: WRI Aqueduct 4.0 по странам и регионам" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
