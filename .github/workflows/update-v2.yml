# ПЕРЕРЕГИСТРАЦИЯ РАСПИСАНИЯ (09.09.2026). Файл переименован из update.yml
# в update-v2.yml, содержимое не изменено.
#
# Причина: 26 августа 2026 на GitHub было два инцидента с Actions
# (15:11-18:01 и 22:56-00:26 UTC). После них запланированные прогоны у части
# репозиториев перестали регистрироваться. У нас перелом ровно 27 августа:
# 25.08 — 33 запуска, 26.08 — 21, 27.08 — 2, дальше от 2 до 9 в сутки при
# ожидаемых 48.
#
# Рекомендованный GitHub способ — коммит в основную ветку — уже применялся:
# файл менялся 1 сентября, расписание не восстановилось. Поэтому меняется
# путь файла: новый путь заставляет планировщик зарегистрировать процесс
# заново.
#
# Если способ не сработает, остаётся внешний запуск из Cloudflare Worker
# (см. archive-api/worker.js, обработчик scheduled).
name: Обновление карты сигналов

on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут
  workflow_dispatch:
    inputs:
      lineage:
        description: 'LINEAGE observability (0/1)'
        default: '1'

concurrency:
  group: update-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Зависимости (Telethon для MTProto-забора Telegram)
        run: pip install --quiet telethon reportlab


      - name: Метка старта прогона (I.2)
        run: echo "DIAG_RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Запуск парсера
        id: parser
        continue-on-error: true
        timeout-minutes: 20
        env:
          FSS_MODE: active
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          COPERNICUS_KEY: ${{ secrets.COPERNICUS_KEY }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: https://copernicus-proxy.luven-medical-msk.workers.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          LINEAGE: ${{ github.event.inputs.lineage || '1' }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          # NOTAM через autorouter (EUROCONTROL EAD). Секретов в прогоне
          # не было вовсе: даже заведённые в репозитории, до скрипта они
          # не доходили. Без них источник молча пропускается.
          AR_CLIENT_ID: ${{ secrets.AR_CLIENT_ID }}
          AR_CLIENT_SECRET: ${{ secrets.AR_CLIENT_SECRET }}
        run: |
          python scripts/fetch_events.py

      - name: Проверка событий
        id: healthcheck
        run: |
          if [ ! -f docs/events.json ]; then
            echo "::error::events.json не найден"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('docs/events.json')); print(d.get('count', len(d.get('events',[]))))")
          PREV=$(git show HEAD:docs/events.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count', len(d.get('events',[]))))" 2>/dev/null || echo 0)
          echo "events_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Событий: $COUNT (прошлый коммит: $PREV)"
          # Абсолютный пол: ниже 30 — почти наверняка массовый сбой источников
          if [ "$COUNT" -lt "30" ]; then
            echo "::error::Слишком мало событий: $COUNT (мин. 30). Прогон отклонён — здоровый архив НЕ перезаписан."
            exit 1
          fi
          # Относительный пол: обвал >60% относительно прошлого здорового файла = плохой прогон
          if [ "$PREV" -gt "0" ]; then
            THRESH=$((PREV * 4 / 10))
            if [ "$COUNT" -lt "$THRESH" ]; then
              echo "::error::Обвал событий: $COUNT < 40% от прошлых $PREV — вероятен плохой прогон. Архив НЕ перезаписан."
              exit 1
            fi
          fi

      - name: Фильтр шума (AUDIT 4.2 — авто-очистка ленты)
        id: filter
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python scripts/filter_noise.py

      - name: Запуск Country Snapshot Engine
        id: snapshot
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/snapshot_engine.py

      - name: Coverage totals (накопительный счётчик сигналов)
        continue-on-error: true
        run: |
          python scripts/coverage_accumulate.py

      - name: Аудит качества событий (шум/домены/страны/дубликаты/перевод → Telegram)
        id: audit
        continue-on-error: true
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUDIT_CHAT_ID: '350205607'
        run: |
          python scripts/audit_events.py

      - name: Diagnostics Engine (I.2, read-only)
        continue-on-error: true
        env:
          DIAG_RUN_START: ${{ env.DIAG_RUN_START }}
        run: |
          python scripts/diagnostics_engine.py || true

      - name: Change Impact (I.3, read-only)
        continue-on-error: true
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python scripts/change_impact.py || true

      - name: Preview Processes (Этап 3, read-only)
        continue-on-error: true
        run: |
          python scripts/preview_processes.py || true

      - name: Infra Process Detection (ADR-012 Phase 1, Shadow)
        continue-on-error: true
        run: |
          python scripts/infra_detection_shadow.py || true

      # Мини-разборы зон риска. Отдельный шаг: скрипту нужен ADMIN_KEY
      # для чтения зон с visibility signal_pro из KV. Внутри чужого шага
      # переменная недоступна — она объявлена в его собственном env.
      - name: Мини-разборы зон риска (PDF)
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          mkdir -p docs/reports
          # Зоны сохраняются консолью в KV. Забираем их оттуда и кладём
          # в файл: генератор читает JSON, а не хранилище.
          python scripts/sync_zones.py || true
          python scripts/build_zone.py docs/country_zones.json docs/reports || true
          ls -la docs/reports/ || true

      # Точечные экспертизы Tier 1. Отдельный шаг от зон, а не строка в том
      # же: у зон ключ KV содержит код страны и список собирается перебором
      # стран, у экспертизы ключ плоский и список приходит одним запросом.
      # Свой шаг также означает, что падение одного генератора не уносит
      # второй: у зон и у экспертиз разные клиенты и разные сроки.
      #
      # ФАЙЛ ДАННЫХ НЕ КОММИТИТСЯ. В экспертизе есть имя клиента, город и
      # разбор его личной ситуации, а этот репозиторий публичный. И
      # docs/tier1_reports.json, и docs/reports/tier1-*.pdf внесены в
      # .gitignore; в списке _add шага публикации их тоже нет.
      - name: Точечные экспертизы Tier 1 (PDF)
        continue-on-error: true
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          mkdir -p docs/reports
          python scripts/sync_tier1.py || true
          python scripts/build_tier1.py docs/tier1_reports.json docs/reports || true

      # Документы уходят в приватный репозиторий: в публичном прямая ссылка
      # открыта любому, кто её узнает. Worker забирает файл оттуда и отдаёт
      # только администратору.
      - name: Публикация разборов в приватный репозиторий
        continue-on-error: true
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "PRIVATE_REPO_TOKEN не задан, публикация пропущена"; exit 0
          fi
          python scripts/push_reports.py || true

      - name: Коммит и публикация
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"

          # ═══ PUBLISH-ADD 23.09.2026 ═══════════════════════════════════════
          # Раньше пути добавлялись длинными строками вида
          #     git add <до 50 путей> 2>/dev/null || true
          # git add атомарен по списку: если ХОТЬ ОДИН путь не существует, он
          # падает с ошибкой и не добавляет НИЧЕГО из строки, а «2>/dev/null
          # || true» прячет это полностью. Проверено на дереве 23.09: строка
          #     git add docs/_geo_audit.json docs/_geo_review.json docs/_geo_authority.json
          # не добавляла _geo_authority.json, потому что первых двух файлов нет.
          #
          # Последствие было не только в потерянном файле. Неcтейдженные файлы
          # уходили в autostash на шаге публикации и конфликтовали при его
          # возврате — отсюда падения с CONFLICT (content) в docs/validation/*.json
          # и десятках других перегенерируемых файлов.
          #
          # Теперь каждый путь добавляется отдельно, отсутствующие называются
          # в логе предупреждением, а не исчезают молча.
          # ОТКАТ: вернуть строки «git add <список> 2>/dev/null || true».
          _add() {
            local miss=""
            for p in "$@"; do
              if [ -e "$p" ]; then
                git add -- "$p" || echo "::warning::[PUBLISH] git add не смог добавить $p"
              else
                miss="$miss $p"
              fi
            done
            if [ -n "$miss" ]; then
              echo "::warning::[PUBLISH] нет на диске, пропущено:$miss"
            fi
            return 0
          }
          _add docs/_pulse.json docs/_filter_noise.json docs/_dedup_debug.json docs/_pipeline_loss.json docs/_netblocks_debug.json docs/_ioda_debug.json docs/_tg_debug.json docs/coverage_totals.json docs/sources_health.json docs/_audit_events.json scripts/firms_persist.json docs/climate/ docs/events.json docs/_lifecycle.json docs/snapshots/ docs/intelligence/ docs/alerts/ docs/alerts/rankings/ grivl.html docs/grdf/ docs/timelines/ docs/scenarios/ docs/correlations/ docs/propagation/ docs/systemic/ docs/early-warning/ docs/decision-support/ docs/resilience/ docs/calibration/ docs/strategy/ docs/strategy-history/ docs/strategy-feedback/ docs/validation/ docs/explanations/ docs/dashboard/ docs/decision-quality/ docs/decision-ranking/ docs/strategy-optimization/ docs/strategy-evolution/ docs/recommendations/ docs/executive-summary/ docs/scenario-evolution/ docs/scenario-pathways/ docs/scenario-tree/ docs/global-risks/ docs/risk-ranking/ docs/risk-hierarchy/ docs/risk-acceleration/ docs/validation-external/ docs/track-record/ docs/model-history.json docs/validation/

          _add docs/_geo_audit.json docs/_geo_review.json docs/_geo_authority.json

          _add docs/signals.json docs/signal_memory.json docs/_geo_shadow.json

          _add docs/quake_history.json   # история уточнений USGS
          _add docs/migration/role-shadow-report.json  # TASK-092
          _add docs/system_state.json   # ADR-021 System State
          _add docs/migration/

          _add docs/_signal_gate.json docs/_geo_authority.json

          _add docs/_pipeline_loss.json docs/_admission_sample.json docs/_admission_history.json docs/_no_domain.json

          _add docs/_admission_shadow.json   # SPEC-013 Phase 1 Shadow
          # История снимков между прогонами. Без неё history_map пуст, trend_direction
          # у всех событий "new", и 55 из 100 очков escalation_score недостижимы.
          # Окно 7 дней задано HISTORY_RETENTION_DAYS в scripts/history_store.py (~6 МБ).
          # ОТКАТ: удалить следующую строку.
          git add -f docs/.history/ 2>/dev/null || true
          # ADR-039C: docs/adr039a-shadow.json и -history.jsonl НЕ коммитятся в
          # публичный репозиторий (нет в git add). Уходят в приват через sync.
          # Lineage Provenance: показываем, КАКОЙ файл коммитится, до git add.
          if [ -f docs/_lineage.jsonl ]; then
            echo "[LINEAGE] commit=$GITHUB_SHA run=$GITHUB_RUN_ID #$GITHUB_RUN_NUMBER"
            echo "[LINEAGE] размер: $(wc -c < docs/_lineage.jsonl) байт, строк: $(wc -l < docs/_lineage.jsonl)"
            echo "[LINEAGE] header: $(head -n 1 docs/_lineage.jsonl)"
          else
            echo "::warning::[LINEAGE] docs/_lineage.jsonl отсутствует — в репозитории останется файл предыдущего прогона"
          fi
          _add docs/_lineage.jsonl docs/_lineage_report.json   # I.1 Lineage (Run B)
          _add docs/_diagnostics_report.json   # I.2 Diagnostics
          _add docs/_change_impact.json   # I.3 Change Impact
          _add docs/_entity_shadow.json   # Entity Layer Shadow (Этап 1)
          _add docs/_preview_processes.json docs/_hypothesis_snapshots.json docs/_infra_process_shadow.json docs/_financial_shadow.json   # Этап 3 Preview
          _add docs/_infra_detection_shadow.json docs/_infra_detection_state.json   # ADR-012 Phase 1 Shadow
          _add docs/_birth_semantics.json   # SPEC-013 §3 Birth Semantics
          _add docs/_impact_debug.json

          # IDR-006: отчёт по обратным ссылкам событие→процесс. Файл создавался
          # на раннере, но не попадал в коммит — его не было ни в одной строке
          # git add. То же касалось _signal_engine_report.json.
          _add docs/_process_links_report.json docs/_signal_engine_report.json

          # docs/reports НЕ коммитится в публичный репозиторий: документы
          # уходят в приватный отдельным шагом. Данные зон остаются здесь,
          # они нужны генератору и не содержат готового разбора.
          _add docs/country_zones.json   # данные зон
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            COUNT=${{ steps.healthcheck.outputs.events_count }}
            git commit -m "Карта сигналов · $TIMESTAMP · ${COUNT} событий"
            # ═══ PUBLISH-PUSH 23.09.2026 ═════════════════════════════════
            # Было: git pull --rebase --autostash с тройным повтором.
            # Два механизма роняли шаг на файлах, которые прогон
            # перегенерирует целиком:
            #   1. rebase без стратегии. Встречный коммит с теми же файлами
            #      даёт CONFLICT (content), хотя выбирать тут нечего: прав
            #      всегда свежий прогон, он пересобрал файл заново.
            #   2. autostash. Всё, что не попало в индекс, пряталось в стеш,
            #      а при возврате конфликтовало с перебазированным деревом.
            #      Содержимое стеша при этом НИКОГДА не публиковалось:
            #      коммит делается до него. То есть конфликты возникали
            #      из-за данных, которые всё равно выбрасывались.
            # Стало: стеш делается явно и не возвращается, а rebase идёт с
            # -X theirs — на перегенерированных файлах побеждает наш коммит.
            # Проверено на песочнице 23.09: при rebase «theirs» — это
            # накатываемый коммит, «ours» — то, на что накатывают. Порядок
            # обратный интуиции, поэтому и проверялся отдельно.
            # ОТКАТ: вернуть git pull --rebase --autostash origin main + git push.
            git stash push -u -q 2>/dev/null || true
            _pushed=0
            for _i in 1 2 3; do
              if git push; then _pushed=1; break; fi
              git fetch -q origin main || true
              if ! git rebase -X theirs FETCH_HEAD; then
                git rebase --abort 2>/dev/null || true
                echo "::warning::[PUBLISH] rebase не удался, попытка $_i"
              fi
              sleep $((_i * 3))
            done
            if [ "$_pushed" != 1 ]; then
              echo "::error::[PUBLISH] публикация не удалась после трёх попыток"
              exit 1
            fi
          fi

      - name: Контроль публикации (AUDIT 4.6)
        if: always()
        run: |
          echo "=== PUBLISH CHECK (AUDIT 4.6) ==="
          SHA=$(git rev-parse HEAD)
          echo "Commit: $SHA"
          AGE=$(python3 -c "import json,datetime as dt; d=json.load(open('docs/events.json')); t=dt.datetime.fromisoformat(d.get('updated','').replace('Z','+00:00')); print(int((dt.datetime.now(dt.timezone.utc)-t).total_seconds()//60))" 2>/dev/null || echo "?")
          echo "events.json возраст: ${AGE} мин"
          COUNT="${{ steps.healthcheck.outputs.events_count }}"
          if git diff --quiet HEAD~1 HEAD -- docs/events.json 2>/dev/null; then
            echo "events.json updated: NO"
            if [ "${COUNT:-0}" -gt 100 ]; then
              echo "::error::PIPELINE STALLED — парсер обработал ${COUNT} событий, но новый events.json НЕ опубликован"
            else
              echo "(новых данных не было — это норма)"
            fi
          else
            echo "events.json updated: YES — опубликован ✓"
          fi
          if [ "$AGE" != "?" ] && [ "$AGE" -gt 60 ]; then
            echo "::error::STALE DATA — возраст production events.json ${AGE} мин (>60)"
          fi

      - name: Telegram alert
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets не настроены"
            exit 0
          fi
          MSG="⚠ Архив Pipeline Failed%0ARun: ${{ github.run_number }}%0ATime: $(date -u '+%Y-%m-%d %H:%M UTC')%0AParser: ${{ steps.parser.outcome }} / Snapshot: ${{ steps.snapshot.outcome }}%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}&text=${MSG}" > /dev/null
