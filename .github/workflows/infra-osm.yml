name: Инфраструктура OSM (разовая выгрузка)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: infra-osm
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/infra/build_refineries_osm.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/infra/refineries_osm.json
          git commit -m "INFRA_LAYER_2511: НПЗ из OpenStreetMap" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
