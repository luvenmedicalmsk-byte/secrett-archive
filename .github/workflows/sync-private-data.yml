name: Sync premium data to private repo

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
      - name: Push premium data to private repo
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then echo "DATA_REPO_TOKEN не задан — пропуск"; exit 0; fi
          git config --global user.email "bot@secrett-archive"
          git config --global user.name "atlas-sync"
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/luvenmedicalmsk-byte/secrett-archive-data.git" /tmp/priv
          DIRS="docs/grdf docs/resilience docs/scenarios docs/strategy docs/decision-support docs/early-warning docs/executive-summary docs/risk-ranking docs/calibration docs/correlations docs/systemic docs/timelines docs/scenario-tree docs/scenario-pathways docs/scenario-evolution docs/propagation docs/decision-quality docs/recommendations docs/dashboard docs/risk-hierarchy docs/risk-acceleration docs/strategy-feedback docs/strategy-history docs/strategy-optimization docs/validation docs/validation-external docs/decision-ranking docs/explanations docs/global-risks docs/snapshots docs/track-record docs/intelligence"
          for d in $DIRS; do
            if [ -d "$d" ]; then
              mkdir -p "/tmp/priv/$d"
              rsync -a --delete "$d/" "/tmp/priv/$d/"
            fi
          done
          # платный preview-файл процессов -> private (гейт через Worker /api/processes)
          mkdir -p /tmp/priv/docs
          if [ -f docs/_preview_processes.json ]; then cp docs/_preview_processes.json /tmp/priv/docs/_preview_processes.json; fi
          cd /tmp/priv
          git add -A
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -m "sync premium data $(date -u +%FT%TZ)"
            git push
          fi
