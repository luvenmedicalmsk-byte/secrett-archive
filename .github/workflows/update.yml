name: Обновление карты сигналов

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск парсера
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          COPERNICUS_KEY: ${{ secrets.COPERNICUS_KEY }}
        run: |
          python scripts/fetch_events.py
        timeout-minutes: 12

      - name: Коммит и публикация
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"
          git add events.json risk-map.html
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Карта сигналов · $TIMESTAMP"
            git push
          fi
