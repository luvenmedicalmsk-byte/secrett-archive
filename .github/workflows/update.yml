name: Обновление карты сигналов

on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут
  workflow_dispatch:
    inputs:
      lineage:
        description: 'LINEAGE observability (0/1)'
        default: '1'

concurrency:
  group: update-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Зависимости (Telethon для MTProto-забора Telegram)
        run: pip install --quiet telethon


      - name: Метка старта прогона (I.2)
        run: echo "DIAG_RUN_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Запуск парсера
        id: parser
        continue-on-error: true
        timeout-minutes: 20
        env:
          FSS_MODE: active
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          COPERNICUS_KEY: ${{ secrets.COPERNICUS_KEY }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: https://copernicus-proxy.luven-medical-msk.workers.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          LINEAGE: ${{ github.event.inputs.lineage || '1' }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python scripts/fetch_events.py

      - name: Проверка событий
        id: healthcheck
        run: |
          if [ ! -f docs/events.json ]; then
            echo "::error::events.json не найден"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('docs/events.json')); print(d.get('count', len(d.get('events',[]))))")
          PREV=$(git show HEAD:docs/events.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count', len(d.get('events',[]))))" 2>/dev/null || echo 0)
          echo "events_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Событий: $COUNT (прошлый коммит: $PREV)"
          # Абсолютный пол: ниже 30 — почти наверняка массовый сбой источников
          if [ "$COUNT" -lt "30" ]; then
            echo "::error::Слишком мало событий: $COUNT (мин. 30). Прогон отклонён — здоровый архив НЕ перезаписан."
            exit 1
          fi
          # Относительный пол: обвал >60% относительно прошлого здорового файла = плохой прогон
          if [ "$PREV" -gt "0" ]; then
            THRESH=$((PREV * 4 / 10))
            if [ "$COUNT" -lt "$THRESH" ]; then
              echo "::error::Обвал событий: $COUNT < 40% от прошлых $PREV — вероятен плохой прогон. Архив НЕ перезаписан."
              exit 1
            fi
          fi

      - name: Фильтр шума (AUDIT 4.2 — авто-очистка ленты)
        id: filter
        continue-on-error: true
        timeout-minutes: 3
        run: |
          python scripts/filter_noise.py

      - name: Запуск Country Snapshot Engine
        id: snapshot
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/snapshot_engine.py

      - name: Coverage totals (накопительный счётчик сигналов)
        continue-on-error: true
        run: |
          python scripts/coverage_accumulate.py

      - name: Аудит качества событий (шум/домены/страны/дубликаты/перевод → Telegram)
        id: audit
        continue-on-error: true
        timeout-minutes: 5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AUDIT_CHAT_ID: '350205607'
        run: |
          python scripts/audit_events.py

      - name: Diagnostics Engine (I.2, read-only)
        continue-on-error: true
        env:
          DIAG_RUN_START: ${{ env.DIAG_RUN_START }}
        run: |
          python scripts/diagnostics_engine.py || true

      - name: Change Impact (I.3, read-only)
        continue-on-error: true
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python scripts/change_impact.py || true

      - name: Preview Processes (Этап 3, read-only)
        continue-on-error: true
        run: |
          python scripts/preview_processes.py || true

      - name: Infra Process Detection (ADR-012 Phase 1, Shadow)
        continue-on-error: true
        run: |
          python scripts/infra_detection_shadow.py || true

      - name: Push премиум -> private (платный контент, не в public)
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "нет токена, skip"; exit 0; fi
          git config --global user.email "bot@secrett-archive"
          git config --global user.name "atlas-sync"
          rm -rf /tmp/pp
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/luvenmedicalmsk-byte/secrett-archive-data.git" /tmp/pp
          mkdir -p /tmp/pp/docs
          [ -f docs/_preview_processes.json ] && cp docs/_preview_processes.json /tmp/pp/docs/_preview_processes.json
          PDIRS="docs/snapshots docs/strategy-evolution docs/grdf docs/resilience docs/scenarios docs/strategy docs/decision-support docs/early-warning docs/executive-summary docs/risk-ranking docs/calibration docs/correlations docs/systemic docs/timelines docs/scenario-tree docs/scenario-pathways docs/scenario-evolution docs/propagation docs/decision-quality docs/recommendations docs/dashboard docs/risk-hierarchy docs/risk-acceleration docs/strategy-feedback docs/strategy-history docs/strategy-optimization docs/validation docs/validation-external docs/decision-ranking docs/explanations docs/global-risks docs/track-record docs/intelligence"
          for d in $PDIRS; do
            if [ -d "$d" ]; then mkdir -p "/tmp/pp/$d"; rsync -a --delete "$d/" "/tmp/pp/$d/"; fi
          done
          cd /tmp/pp
          git add -A
          if git diff --cached --quiet; then echo "нет изменений"; else git commit -m "premium data $(date -u +%FT%TZ)" && git push; fi

      - name: Коммит и публикация
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"
          git add docs/_filter_noise.json docs/_dedup_debug.json docs/_pipeline_loss.json docs/_netblocks_debug.json docs/_ioda_debug.json docs/_tg_debug.json docs/coverage_totals.json docs/sources_health.json docs/_audit_events.json scripts/firms_persist.json docs/climate/ docs/events.json docs/_lifecycle.json docs/alerts/ docs/alerts/rankings/ grivl.html docs/model-history.json 2>/dev/null || true
          git add docs/_geo_audit.json docs/_geo_review.json docs/_geo_authority.json 2>/dev/null || true
          git add docs/signals.json docs/signal_memory.json docs/_geo_shadow.json 2>/dev/null || true
          git add docs/system_state.json 2>/dev/null || true   # ADR-021 System State
          git add docs/migration/ 2>/dev/null || true
          git add docs/_signal_gate.json docs/_geo_authority.json 2>/dev/null || true
          git add docs/_pipeline_loss.json docs/_admission_sample.json docs/_admission_history.json docs/_no_domain.json 2>/dev/null || true
          git add docs/_admission_shadow.json 2>/dev/null || true   # SPEC-013 Phase 1 Shadow
          git add docs/_lineage.jsonl docs/_lineage_report.json 2>/dev/null || true   # I.1 Lineage (Run B)
          git add docs/_diagnostics_report.json 2>/dev/null || true   # I.2 Diagnostics
          git add docs/_change_impact.json 2>/dev/null || true   # I.3 Change Impact
          git add docs/_entity_shadow.json 2>/dev/null || true   # Entity Layer Shadow (Этап 1)
          git add docs/_infra_process_shadow.json docs/_financial_shadow.json 2>/dev/null || true   # Этап 3 Preview (_preview_processes.json уведён в private-only)
          git add docs/_infra_detection_shadow.json docs/_infra_detection_state.json 2>/dev/null || true   # ADR-012 Phase 1 Shadow
          git add docs/_birth_semantics.json 2>/dev/null || true   # SPEC-013 §3 Birth Semantics
          git add docs/_impact_debug.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            COUNT=${{ steps.healthcheck.outputs.events_count }}
            git commit -m "Карта сигналов · $TIMESTAMP · ${COUNT} событий"
            git pull --rebase --autostash origin main
            git push || (sleep 3 && git pull --rebase --autostash origin main && git push) || (sleep 6 && git pull --rebase --autostash origin main && git push)
          fi

      - name: Контроль публикации (AUDIT 4.6)
        if: always()
        run: |
          echo "=== PUBLISH CHECK (AUDIT 4.6) ==="
          SHA=$(git rev-parse HEAD)
          echo "Commit: $SHA"
          AGE=$(python3 -c "import json,datetime as dt; d=json.load(open('docs/events.json')); t=dt.datetime.fromisoformat(d.get('updated','').replace('Z','+00:00')); print(int((dt.datetime.now(dt.timezone.utc)-t).total_seconds()//60))" 2>/dev/null || echo "?")
          echo "events.json возраст: ${AGE} мин"
          COUNT="${{ steps.healthcheck.outputs.events_count }}"
          if git diff --quiet HEAD~1 HEAD -- docs/events.json 2>/dev/null; then
            echo "events.json updated: NO"
            if [ "${COUNT:-0}" -gt 100 ]; then
              echo "::error::PIPELINE STALLED — парсер обработал ${COUNT} событий, но новый events.json НЕ опубликован"
            else
              echo "(новых данных не было — это норма)"
            fi
          else
            echo "events.json updated: YES — опубликован ✓"
          fi
          if [ "$AGE" != "?" ] && [ "$AGE" -gt 60 ]; then
            echo "::error::STALE DATA — возраст production events.json ${AGE} мин (>60)"
          fi

      - name: Telegram alert
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets не настроены"
            exit 0
          fi
          MSG="⚠ Архив Pipeline Failed%0ARun: ${{ github.run_number }}%0ATime: $(date -u '+%Y-%m-%d %H:%M UTC')%0AParser: ${{ steps.parser.outcome }} / Snapshot: ${{ steps.snapshot.outcome }}%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}&text=${MSG}" > /dev/null
