name: Обновление карты сигналов

on:
  schedule:
    - cron: '*/30 * * * *'   # каждые 30 минут
  workflow_dispatch:

concurrency:
  group: update-events-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Зависимости (Telethon для MTProto-забора Telegram)
        run: pip install --quiet telethon


      - name: Запуск парсера
        id: parser
        continue-on-error: true
        timeout-minutes: 20
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          FIRMS_API_KEY: ${{ secrets.FIRMS_API_KEY }}
          COPERNICUS_KEY: ${{ secrets.COPERNICUS_KEY }}
          PROXY_TOKEN: ${{ secrets.PROXY_TOKEN }}
          PROXY_URL: https://copernicus-proxy.luven-medical-msk.workers.dev
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
        run: |
          python scripts/fetch_events.py

      - name: Проверка событий
        id: healthcheck
        run: |
          if [ ! -f docs/events.json ]; then
            echo "::error::events.json не найден"
            exit 1
          fi
          COUNT=$(python3 -c "import json; d=json.load(open('docs/events.json')); print(d.get('count', len(d.get('events',[]))))")
          PREV=$(git show HEAD:docs/events.json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('count', len(d.get('events',[]))))" 2>/dev/null || echo 0)
          echo "events_count=$COUNT" >> $GITHUB_OUTPUT
          echo "Событий: $COUNT (прошлый коммит: $PREV)"
          # Абсолютный пол: ниже 30 — почти наверняка массовый сбой источников
          if [ "$COUNT" -lt "30" ]; then
            echo "::error::Слишком мало событий: $COUNT (мин. 30). Прогон отклонён — здоровый архив НЕ перезаписан."
            exit 1
          fi
          # Относительный пол: обвал >60% относительно прошлого здорового файла = плохой прогон
          if [ "$PREV" -gt "0" ]; then
            THRESH=$((PREV * 4 / 10))
            if [ "$COUNT" -lt "$THRESH" ]; then
              echo "::error::Обвал событий: $COUNT < 40% от прошлых $PREV — вероятен плохой прогон. Архив НЕ перезаписан."
              exit 1
            fi
          fi

      - name: Запуск Country Snapshot Engine
        id: snapshot
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/snapshot_engine.py

      - name: Coverage totals (накопительный счётчик сигналов)
        continue-on-error: true
        run: |
          python scripts/coverage_accumulate.py

      - name: Коммит и публикация
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"
          git add docs/_dedup_debug.json docs/_pipeline_loss.json docs/_netblocks_debug.json docs/_ioda_debug.json docs/_tg_debug.json docs/coverage_totals.json docs/sources_health.json scripts/firms_persist.json docs/climate/ docs/events.json docs/snapshots/ docs/intelligence/ docs/alerts/ docs/alerts/rankings/ grivl.html docs/grdf/ docs/timelines/ docs/scenarios/ docs/correlations/ docs/propagation/ docs/systemic/ docs/early-warning/ docs/decision-support/ docs/resilience/ docs/calibration/ docs/strategy/ docs/strategy-history/ docs/strategy-feedback/ docs/validation/ docs/explanations/ docs/dashboard/ docs/decision-quality/ docs/decision-ranking/ docs/strategy-optimization/ docs/strategy-evolution/ docs/recommendations/ docs/executive-summary/ docs/scenario-evolution/ docs/scenario-pathways/ docs/scenario-tree/ docs/global-risks/ docs/risk-ranking/ docs/risk-hierarchy/ docs/risk-acceleration/ docs/validation-external/ docs/track-record/ docs/model-history.json docs/validation/
          git add docs/_impact_debug.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            COUNT=${{ steps.healthcheck.outputs.events_count }}
            git commit -m "Карта сигналов · $TIMESTAMP · ${COUNT} событий"
            git pull --rebase origin main
            git push || (sleep 3 && git pull --rebase origin main && git push) || (sleep 6 && git pull --rebase origin main && git push)
          fi

      - name: Telegram alert
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "Telegram secrets не настроены"
            exit 0
          fi
          MSG="⚠ Архив Pipeline Failed%0ARun: ${{ github.run_number }}%0ATime: $(date -u '+%Y-%m-%d %H:%M UTC')%0AParser: ${{ steps.parser.outcome }} / Snapshot: ${{ steps.snapshot.outcome }}%0Ahttps://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}&text=${MSG}" > /dev/null
