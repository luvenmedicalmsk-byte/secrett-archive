# P0.6b FAIL-CLOSED TEST (23.11.2026, решение Мии: проверка в изолированном контуре).
# Живёт ТОЛЬКО в тестовой ветке p06b-failclosed-test, запускается push в неё.
# Production-конвейер (update-v2, ветка main) не затрагивается: права только на чтение,
# настоящий приватный репозиторий не клонируется и не меняется, публикации нет физически.
# Шаги restore повторяют production-шаг P0.6b (те же команды и тот же scripts/restore_private.py),
# но источником служит синтетический приватный каталог.
name: P0.6b fail-closed test (isolated)
on:
  push:
    branches: [p06b-failclosed-test]
permissions:
  contents: read
jobs:
  failclosed:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [stale_manifest, no_manifest, missing_path, no_token]
    steps:
      - uses: actions/checkout@v4
      - name: Синтетический приватный каталог
        run: |
          set -e
          P=/tmp/priv; mkdir -p $P
          # все пути из scripts/private_write.sh, по одному файлу (содержимое не важно)
          DIRS=$(sed -n 's/^DIRS="\(.*\)"/\1/p' scripts/private_write.sh); FILES=$(sed -n 's/^FILES="\(.*\)"/\1/p' scripts/private_write.sh)
          for d in $DIRS; do mkdir -p "$P/$d"; echo '{"synthetic":true}' > "$P/$d/_t.json"; done
          for f in $FILES; do mkdir -p "$(dirname "$P/$f")"; echo '{"synthetic":true}' > "$P/$f"; done
          case "${{ matrix.case }}" in
            stale_manifest) echo '{"public_sha":"0000000000000000000000000000000000000000","written_at":"2000-01-01T00:00:00Z"}' > $P/docs/_private_write.json ;;
            no_manifest)    rm -f $P/docs/_private_write.json ;;
            missing_path)   LAST=$(gh api "repos/${GITHUB_REPOSITORY}/commits?per_page=40" -q '.[] | select(.commit.message | startswith("Карта сигналов")) | .sha' | head -1)
                            echo "{\"public_sha\":\"$LAST\"}" > $P/docs/_private_write.json; rm -rf "$P/docs/grdf" ;;
            no_token)       : ;;
          esac
          (cd $P && find . -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum) > /tmp/priv_before.txt
          git status --porcelain > /tmp/work_before.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: P0.6b Restore from private (fail-closed) - тест
        id: restore
        timeout-minutes: 6
        env:
          TOKEN: ${{ matrix.case == 'no_token' && '' || 'synthetic' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo '[RESTORE] {"status":"error","error":"no_private_token"}'; echo 1 > /tmp/rc.txt; exit 1; fi
          command -v rsync >/dev/null || { echo '[RESTORE] {"status":"error","error":"no_rsync"}'; echo 1 > /tmp/rc.txt; exit 1; }
          set +e
          python3 scripts/restore_private.py /tmp/priv
          RC=$?
          set -e
          echo $RC > /tmp/rc.txt
          if [ "$RC" != "0" ]; then echo "::error::P0.6b: восстановление из приватного не подтверждено (код $RC) - публикация запрещена"; exit 1; fi
      - name: Запуск парсера (маркер)
        run: echo ran > /tmp/parser_ran
      - name: Коммит и публикация (маркер)
        if: env.PRIVATE_RESTORE == 'ok'
        run: echo ran > /tmp/publish_ran
      - name: Telegram alert (тест)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT:  ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo ran > /tmp/alert_ran
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then echo "[ALERT] secrets_unavailable_in_test_branch"; exit 0; fi
          MSG="[ТЕСТ P0.6b fail-closed] case=${{ matrix.case }} - публикация остановлена (это проверка, не авария)"
          curl -s -o /dev/null -w "[ALERT] http=%{http_code}\n" -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -d "chat_id=${TG_CHAT}" --data-urlencode "text=${MSG}"
      - name: Проверка результата
        if: always()
        run: |
          RC=$(cat /tmp/rc.txt 2>/dev/null || echo none)
          case "${{ matrix.case }}" in stale_manifest|no_manifest) EXP=2;; missing_path) EXP=3;; no_token) EXP=1;; esac
          (cd /tmp/priv && find . -type f -print0 | sort -z | xargs -0 sha1sum | sha1sum) > /tmp/priv_after.txt
          git status --porcelain > /tmp/work_after.txt
          P1=$([ -f /tmp/parser_ran ] && echo yes || echo no); P2=$([ -f /tmp/publish_ran ] && echo yes || echo no); AL=$([ -f /tmp/alert_ran ] && echo yes || echo no)
          PRIV_SAME=$(cmp -s /tmp/priv_before.txt /tmp/priv_after.txt && echo yes || echo no)
          WORK_SAME=$(cmp -s /tmp/work_before.txt /tmp/work_after.txt && echo yes || echo no)
          OK=yes; [ "$RC" = "$EXP" ] || OK=no; [ "$P1" = no ] || OK=no; [ "$P2" = no ] || OK=no; [ "$AL" = yes ] || OK=no; [ "$PRIV_SAME" = yes ] || OK=no
          echo "[FAILCLOSED-TEST] {\"case\":\"${{ matrix.case }}\",\"restore_outcome\":\"${{ steps.restore.outcome }}\",\"exit_code\":\"$RC\",\"expected\":\"$EXP\",\"parser_ran\":\"$P1\",\"publish_ran\":\"$P2\",\"alert_step_ran\":\"$AL\",\"private_unchanged\":\"$PRIV_SAME\",\"workcopy_unchanged\":\"$WORK_SAME\",\"pass\":\"$OK\"}"
          rm -rf /tmp/priv
