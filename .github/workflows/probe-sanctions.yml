# Временная разведка форматов источников (санкции 11.10.2026, затем здоровье/гуманитарка).
# Срабатывает ТОЛЬКО на push в ветку probe/sanctions. В main не попадает.
name: Probe sanctions sources
on:
  push:
    branches: [probe/sanctions]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe/sanctions }
      - name: Download
        run: |
          rm -rf probe; mkdir -p probe
          get(){ n=$1; u=$2; code=$(curl -sSL -m 90 --retry 1 -A "ArchiveBot/2.0" -o "probe/$n" -w "%{http_code}" "$u" || echo ERR); echo "$n $code $(stat -c %s probe/$n 2>/dev/null || echo 0) $u" >> probe/_index.txt; }
          get(){ n=$1; u=$2; code=$(curl -gsSL -m 90 --retry 1 -A "ArchiveBot/2.0" -o "probe/$n" -w "%{http_code}" "$u" || echo ERR); echo "$n $code $(stat -c %s probe/$n 2>/dev/null || echo 0) $u" >> probe/_index.txt; }
          B="https://api.reliefweb.int/v2"; A="appname=atlas-riskmonitor-x7k2"
          get rw_sitrep.json "$B/reports?$A&limit=15&sort[]=date:desc&filter[field]=format.name&filter[value]=Situation+Report&fields[include][]=title&fields[include][]=date.created&fields[include][]=source.name&fields[include][]=country.name&fields[include][]=format.name&fields[include][]=disaster_type.name&fields[include][]=body"
          get rw_analysis.json "$B/reports?$A&limit=15&sort[]=date:desc&filter[field]=format.name&filter[value]=Analysis&fields[include][]=title&fields[include][]=date.created&fields[include][]=source.name&fields[include][]=country.name&fields[include][]=format.name&fields[include][]=disaster_type.name&fields[include][]=body"
          get rw_assess.json "$B/reports?$A&limit=15&sort[]=date:desc&filter[field]=format.name&filter[value]=Assessment&fields[include][]=title&fields[include][]=date.created&fields[include][]=source.name&fields[include][]=country.name&fields[include][]=format.name&fields[include][]=disaster_type.name&fields[include][]=body"
          get rw_news.json "$B/reports?$A&limit=15&sort[]=date:desc&filter[field]=format.name&filter[value]=News+and+Press+Release&fields[include][]=title&fields[include][]=date.created&fields[include][]=source.name&fields[include][]=country.name&fields[include][]=format.name&fields[include][]=disaster_type.name&fields[include][]=body"
          cat probe/_index.txt
          for f in probe/*; do echo "== $f"; head -c 400 "$f"; echo; done
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add -A probe && git commit -m "probe: reliefweb reports samples" && git push origin HEAD:probe/sanctions
