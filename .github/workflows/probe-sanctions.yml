# Временная разведка форматов источников (санкции 11.10.2026, затем здоровье/гуманитарка).
# Срабатывает ТОЛЬКО на push в ветку probe/sanctions. В main не попадает.
name: Probe sanctions sources
on:
  push:
    branches: [probe/sanctions]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe/sanctions }
      - name: Download
        run: |
          rm -rf probe; mkdir -p probe
          get(){ n=$1; u=$2; code=$(curl -sSL -m 60 --retry 1 -A "ArchiveBot/2.0" -o "probe/$n" -w "%{http_code}" "$u" || echo ERR); echo "$n $code $(stat -c %s probe/$n 2>/dev/null || echo 0) $u" >> probe/_index.txt; }
          get(){ n=$1; u=$2; code=$(curl -gsSL -m 60 --retry 1 -A "ArchiveBot/2.0" -o "probe/$n" -w "%{http_code}" "$u" || echo ERR); echo "$n $code $(stat -c %s probe/$n 2>/dev/null || echo 0) $u" >> probe/_index.txt; }
          get fao_page.html "https://www.fao.org/worldfoodsituation/foodpricesindex/en/"
          get fao_csv_old.csv "https://www.fao.org/fileadmin/templates/worldfood/Reports_and_docs/Food_price_indices_data.csv"
          get fao_rss.xml "https://www.fao.org/worldfoodsituation/foodpricesindex/rss/en/"
          grep -oiE 'href="[^"]*(csv|xls[x]?)[^"]*"' probe/fao_page.html | head -20 > probe/fao_links.txt || true
          cat probe/_index.txt
          for f in probe/*; do echo "== $f"; head -c 300 "$f"; echo; done; find probe -size +5M -delete; rm -f probe/*.csv
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add -A probe && git commit -m "probe: infra/hazard samples" && git push origin HEAD:probe/sanctions
