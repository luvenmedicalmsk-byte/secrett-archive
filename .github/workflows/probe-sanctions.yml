# Временная разведка форматов источников (санкции 11.10.2026, затем здоровье/гуманитарка).
# Срабатывает ТОЛЬКО на push в ветку probe/sanctions. В main не попадает.
name: Probe sanctions sources
on:
  push:
    branches: [probe/sanctions]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: probe/sanctions }
      - name: Download
        run: |
          rm -rf probe; mkdir -p probe
          get(){ n=$1; u=$2; code=$(curl -sSL -m 90 --retry 1 -A "ArchiveBot/2.0" -o "probe/$n" -w "%{http_code}" "$u" || echo ERR); echo "$n $code $(stat -c %s probe/$n 2>/dev/null || echo 0) $u" >> probe/_index.txt; }
          get who_don_api.json "https://www.who.int/api/news/diseaseoutbreaknews?sf_culture=en&\$orderby=PublicationDateAndTime%20desc&\$top=15"
          get who_news_api.json "https://www.who.int/api/news/newsitems?sf_culture=en&\$orderby=PublicationDateAndTime%20desc&\$top=15"
          get who_news.rss "https://www.who.int/rss-feeds/news-english.xml"
          get who_don_old.rss "https://www.who.int/feeds/entity/csr/don/en/rss.xml"
          get rw_sitrep.json "https://api.reliefweb.int/v2/reports?appname=atlas-riskmonitor-x7k2&limit=5&sort[]=date:desc&filter[field]=type.name&filter[value]=Situation+Report&fields[include][]=title&fields[include][]=date.created&fields[include][]=source.name&fields[include][]=country.name"
          get rw_disasters.json "https://api.reliefweb.int/v2/disasters?appname=atlas-riskmonitor-x7k2&limit=20&sort[]=date:desc&fields[include][]=name&fields[include][]=date&fields[include][]=type.name&fields[include][]=country.name&fields[include][]=status&filter[field]=status&filter[value]=current"
          get rw_alert.json "https://api.reliefweb.int/v2/disasters?appname=atlas-riskmonitor-x7k2&limit=20&sort[]=date.created:desc&fields[include][]=name&fields[include][]=date&fields[include][]=type.name&fields[include][]=country.name&fields[include][]=status&fields[include][]=glide"
          get rw_updates.rss "https://reliefweb.int/updates/rss.xml"
          get rw_disasters.rss "https://reliefweb.int/disasters/rss.xml"
          cat probe/_index.txt
          for f in probe/*; do echo "== $f"; head -c 400 "$f"; echo; done
      - name: Commit
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add -A probe && git commit -m "probe: health/humanitarian samples" && git push origin HEAD:probe/sanctions
