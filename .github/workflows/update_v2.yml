name: Обновление карты сигналов

on:
  schedule:
    # Каждые 10 минут (GitHub минимум — 5 мин, реально 5-15 мин)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Ручной запуск из GitHub UI

jobs:
  update-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Запуск парсера
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          python scripts/fetch_events.py
        timeout-minutes: 8

      - name: Коммит и публикация
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"
          git add docs/events.json
          if git diff --staged --quiet; then
            echo "Нет новых событий"
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Карта сигналов · $TIMESTAMP"
            git push
          fi
