name: Сбор сигналов (OpenAI — ОТКЛЮЧЁН)

# ⚠️ ПЛАТНЫЙ воркфлоу (OpenAI web_search, ~$6 за прогон ALL).
# Расписание убрано. Запуск только вручную и только с явным подтверждением.
# Автопополнение карты в OpenAI выключено; баланс ограничен.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Платно! Впишите ровно CONFIRM, иначе запуск не пойдёт'
        required: true
        default: 'NO'
      country:
        description: 'Код страны (ISO2). ALL = все 17 (дорого!)'
        required: true
        default: 'RU'
      model:
        description: 'Модель OpenAI'
        required: false
        default: 'gpt-5.4-mini'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Предохранитель — требуется подтверждение CONFIRM
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]; then
            echo "::error::Сбор не запущен. Это ПЛАТНЫЙ запуск (OpenAI). Впишите CONFIRM в поле подтверждения."
            exit 1
          fi
          echo "Подтверждение получено."

      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install openai

      - name: Сбор сигналов
        id: collect
        timeout-minutes: 45
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CC="${{ github.event.inputs.country }}"; CC="${CC:-RU}"
          MDL="${{ github.event.inputs.model }}"; MDL="${MDL:-gpt-5.4-mini}"
          export SIGNALS_MODEL="$MDL"
          echo "Сбор сигналов: $CC (model=$MDL)"
          python scripts/collect_signals.py "$CC"

      - name: Коммит результата
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"
          git add docs/signals/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            CC="${{ github.event.inputs.country }}"; CC="${CC:-RU}"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Сигналы · $CC · $TIMESTAMP"
            git pull --rebase origin main
            git push
          fi
