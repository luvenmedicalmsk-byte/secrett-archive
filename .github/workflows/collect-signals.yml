name: Сбор сигналов

on:
  schedule:
    - cron: '0 18 * * *'   # ежедневно ~21:00 (Анкара/МСК), сбор по всем странам
  workflow_dispatch:
    inputs:
      country:
        description: 'Код страны (ISO2) или ALL'
        required: true
        default: 'RU'
      model:
        description: 'Модель OpenAI'
        required: false
        default: 'gpt-5.4-mini'

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install openai

      - name: Сбор сигналов
        id: collect
        timeout-minutes: 45
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          CC="${{ github.event.inputs.country }}"; CC="${CC:-ALL}"
          MDL="${{ github.event.inputs.model }}"; MDL="${MDL:-gpt-5.4-mini}"
          export SIGNALS_MODEL="$MDL"
          echo "Сбор сигналов: $CC (model=$MDL)"
          python scripts/collect_signals.py "$CC"

      - name: Коммит результата
        run: |
          git config user.name "archive-bot"
          git config user.email "bot@secrett-archive.com"
          git add docs/signals/
          if git diff --staged --quiet; then
            echo "Нет изменений"
          else
            CC="${{ github.event.inputs.country }}"; CC="${CC:-ALL}"
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Сигналы · $CC · $TIMESTAMP"
            git pull --rebase origin main
            git push
          fi
