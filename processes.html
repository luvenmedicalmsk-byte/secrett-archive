<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Атлас · Процессы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06050A; --bg2:#0c0a12; --panel:#100d18; --panel2:#15111f;
  --gold:#B8973A; --gold2:#D4AF5A; --blue:#1faacc; --ink:#e8e4dc; --muted:#8a8598; --faint:#5a5568;
  --line:rgba(184,151,58,.18); --line2:rgba(255,255,255,.06);
  --serif:'Cormorant Garamond',serif; --sans:'Montserrat',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}
/* header */
header{border-bottom:1px solid var(--line);padding:22px 0 18px;position:sticky;top:0;background:linear-gradient(180deg,var(--bg) 70%,rgba(6,5,10,.85));backdrop-filter:blur(8px);z-index:40}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.32em;text-transform:uppercase;color:var(--blue)}
.brand .sub{font-family:var(--sans);font-weight:500;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold2)}
.brand .tag{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.04em}
.brand .tag b{color:var(--gold2);font-weight:500}
/* dashboard */
.dash{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:18px 0}
.dash .cell{background:var(--panel);padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-height:74px}
.dash .cell .k{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dash .cell .v{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1;color:var(--ink)}
.dash .cell .d{font-size:10px;color:var(--faint)}
.dash .cell .d.up{color:var(--gold2)} .dash .cell .d.down{color:var(--blue)}
/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 6px}
.controls input,.controls select{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:12px;font-weight:400;padding:8px 11px;border-radius:7px;outline:none}
.controls input:focus,.controls select:focus{border-color:var(--gold)}
.controls input.search{flex:1;min-width:180px}
.controls .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.count{font-size:11px;color:var(--muted);margin:8px 2px 14px}
.count b{color:var(--gold2);font-weight:500}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:60px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:11px;padding:16px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.card:hover{border-color:var(--line);transform:translateY(-2px)}
.card .edge{position:absolute;left:0;top:0;bottom:0;width:3px}
.card .type{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.card h3{font-family:var(--serif);font-size:20px;font-weight:600;margin:6px 0 3px;line-height:1.15;color:var(--ink)}
.card .place{font-size:11.5px;color:var(--blue);margin-bottom:12px;letter-spacing:.02em}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.metric .ml{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:3px}
.metric .mv{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{font-size:10px;letter-spacing:.05em;padding:3px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--muted);text-transform:uppercase;font-weight:500}
.chip.hl{border-color:var(--line);color:var(--gold2)}
.foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);border-top:1px solid var(--line2);padding-top:9px}
.foot .ev{color:var(--muted)}
.watch{position:absolute;top:12px;right:12px;font-size:9px;color:var(--gold2);letter-spacing:.1em}
/* detail overlay */
.overlay{position:fixed;inset:0;background:rgba(4,3,7,.72);backdrop-filter:blur(4px);z-index:80;display:none;opacity:0;transition:.2s}
.overlay.on{display:block;opacity:1}
.dossier{position:fixed;top:0;right:0;bottom:0;width:min(680px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:81;transform:translateX(100%);transition:.26s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.dossier.on{transform:translateX(0)}
.dossier .dhead{padding:22px 26px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:5}
.dossier .dclose{position:absolute;top:20px;right:22px;font-size:20px;color:var(--muted);cursor:pointer;line-height:1}
.dossier .dclose:hover{color:var(--gold2)}
.dossier .dtype{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dossier h2{font-family:var(--serif);font-size:30px;font-weight:600;margin:6px 0 3px;line-height:1.1}
.dossier .dplace{color:var(--blue);font-size:13px}
.sec{padding:20px 26px;border-bottom:1px solid var(--line2)}
.sec .sh{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold2);font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:9px}
.sec .sh::after{content:'';flex:1;height:1px;background:var(--line2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.kv .k{color:var(--muted)} .kv .v{color:var(--ink);text-align:right}
.dmetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.dm{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:11px 12px}
.dm .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dm .v{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:3px}
.dm .s{font-size:10px;color:var(--muted)}
/* timeline */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:4px;top:4px;bottom:4px;width:1px;background:var(--line)}
.tl .ti{position:relative;padding:0 0 14px 4px}
.tl .ti::before{content:'';position:absolute;left:-18px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--bg2)}
.tl .ti .te{font-size:12.5px;color:var(--ink);font-weight:400}
.tl .ti .td{font-size:11px;color:var(--muted)}
.tl .ti .tt{font-size:10px;color:var(--faint);letter-spacing:.05em}
/* evidence */
.ev-item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line2)}
.ev-item:last-child{border:0}
.ev-item .et{font-size:12.5px;color:var(--ink);line-height:1.35}
.ev-item .em{font-size:10.5px;color:var(--muted);margin-top:3px}
.ev-item .es{font-family:var(--serif);font-size:16px;font-weight:600;flex-shrink:0}
/* connections */
.conn-grp{margin-bottom:12px}
.conn-grp .cl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.conn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:6px 10px;margin:0 6px 6px 0;font-size:12px;cursor:pointer;transition:.14s}
.conn:hover{border-color:var(--gold);color:var(--gold2)}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);margin:0 5px 5px 0}
.mem-note{font-size:13px;color:var(--ink);line-height:1.55;font-family:var(--serif);font-size:15px}
.mem-empty{font-size:12.5px;color:var(--faint);font-style:italic}
.exp-item{margin-bottom:11px}
.exp-item .eq{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2);margin-bottom:3px}
.exp-item .ea{font-size:13px;color:var(--ink);line-height:1.45}
.forecast-bars{display:flex;flex-direction:column;gap:8px}
.fb{display:flex;align-items:center;gap:10px;font-size:12px}
.fb .fl{width:110px;color:var(--muted)}
.fb .ft{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.fb .ft i{display:block;height:100%}
.fb .fv{width:38px;text-align:right;color:var(--ink);font-weight:500}
.loading,.error{text-align:center;padding:80px 20px;color:var(--muted);font-family:var(--serif);font-size:20px}
.patterns{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 15px;margin:0 0 16px;font-size:12.5px}
.patterns .pt{color:var(--gold2);text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:600;margin-bottom:6px}
@media(max-width:900px){.dash{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.dash{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>Атлас</h1><span class="sub">Процессы</span>
      <span class="tag">закрытая инфраструктура мониторинга · <b id="upd">…</b></span>
    </div>
  </div>
</header>
<div class="wrap">
  <div id="dash" class="dash"></div>
  <div id="patterns"></div>
  <div class="controls">
    <input class="search" id="q" placeholder="Поиск процесса, места, актора…">
    <span class="lbl">Домен</span><select id="f-domain"></select>
    <span class="lbl">Фаза</span><select id="f-phase"></select>
    <span class="lbl">Health</span><select id="f-health"></select>
    <span class="lbl">Доверие</span><select id="f-conf"></select>
    <span class="lbl">Сорт.</span><select id="sort">
      <option value="priority">Priority</option><option value="pressure">Pressure</option>
      <option value="severity">Severity</option><option value="age">Возраст</option>
      <option value="update">Обновление</option><option value="evidence">Подтверждения</option>
    </select>
  </div>
  <div class="count" id="count"></div>
  <div id="grid" class="grid"></div>
</div>
<div class="overlay" id="ov"></div>
<div class="dossier" id="dossier"></div>

<script>
const DOM_RU={climate:'Климат',economy:'Экономика',geopolitics:'Геополитика',technology:'Технологии',social:'Социум'};
const PHASE_RU={emerging:'Зарождение',growing:'Рост',active:'Активный',escalating:'Эскалация',stabilizing:'Стабилизация','de-escalating':'Деэскалация',dormant:'Спящий',archived:'Архив'};
const HEALTH_RU={Healthy:'Здоровый',Stable:'Стабильный',Escalating:'Эскалация',Critical:'Критический',Dormant:'Спящий',Archived:'Архив'};
const ROLE_RU={measurement:'Измерительный',state:'Государственный',intl:'Междунар. орг.',science:'Научный',financial:'Финансовый',agency:'Агентство',osint:'OSINT',telegram:'Telegram'};
let SIGNALS=[], BYID={};

// цветовая шкала Atlas (без новых цветов): низкое→приглушённо, среднее→синий, высокое→золото
function scale(v){ v=Math.max(0,Math.min(100,v||0));
  if(v>=75) return '#D4AF5A'; if(v>=55) return '#B8973A'; if(v>=38) return '#1faacc'; return '#5a5568'; }
function healthColor(h){ return {Critical:'#D4AF5A',Escalating:'#B8973A',Healthy:'#1faacc',Stable:'#8a8598',Dormant:'#5a5568',Archived:'#5a5568'}[h]||'#8a8598'; }
function ago(iso){ if(!iso)return '—'; const d=(Date.now()-new Date(iso).getTime())/1000; if(d<0)return 'только что';
  if(d<3600)return Math.max(1,Math.round(d/60))+' мин назад'; if(d<86400)return Math.round(d/3600)+' ч назад';
  return Math.round(d/86400)+' дн назад'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

fetch('./docs/signals.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
  SIGNALS=(data.signals||[]).filter(s=>s.status!=='archived');
  SIGNALS.forEach(s=>BYID[s.signal_id]=s);
  document.getElementById('upd').textContent='обновлено '+ago(data.updated);
  renderDash(data.global_health||{});
  renderPatterns(data.patterns_detected||[]);
  buildFilters(); render();
  ['q','f-domain','f-phase','f-health','f-conf','sort'].forEach(id=>document.getElementById(id).addEventListener('input',render));
}).catch(e=>{document.getElementById('grid').innerHTML='<div class="error">Не удалось загрузить процессы.<br><small style="font-size:12px">'+esc(e.message)+'</small></div>';});

function renderDash(g){
  const pc=g.pressure_change_pct;
  const cells=[
    ['Global Pressure',Math.round(g.global_pressure||0), pc!=null?(pc>=0?'▲ +'+pc+'%':'▼ '+pc+'%'):'', pc>=0?'up':'down'],
    ['System Temp',Math.round(g.system_temperature||0),'',''],
    ['Активные',g.active_processes||0,'',''],
    ['Критические',g.critical_processes||0,'',''],
    ['Эскалация',g.escalating_processes||0,'',''],
    ['Спящие',g.dormant_processes||0,'',''],
    ['Связность',g.global_connectivity||0,'',''],
    ['Watchlist',g.watchlist_count||0,'',''],
  ];
  document.getElementById('dash').innerHTML=cells.map(c=>
    `<div class="cell"><div class="k">${c[0]}</div><div class="v" style="color:${c[0].match(/Pressure|Temp/)?scale(c[1]):'var(--ink)'}">${c[1]}</div><div class="d ${c[3]}">${c[2]}</div></div>`).join('');
}
function renderPatterns(p){
  if(!p||!p.length){document.getElementById('patterns').innerHTML='';return;}
  document.getElementById('patterns').innerHTML=`<div class="patterns"><div class="pt">Обнаружены известные паттерны</div>`+
    p.map(x=>`<div>▸ <b style="color:var(--gold2)">${esc(x.pattern)}</b>: ${esc((x.chain||[]).join(' → '))}</div>`).join('')+`</div>`;
}
function uniq(arr){return [...new Set(arr)].filter(Boolean);}
function buildFilters(){
  const add=(id,vals,ru)=>{const s=document.getElementById(id);s.innerHTML='<option value="">— все —</option>'+vals.map(v=>`<option value="${esc(v)}">${esc(ru?ru[v]||v:v)}</option>`).join('');};
  add('f-domain',uniq(SIGNALS.flatMap(s=>s.domains||[])),DOM_RU);
  add('f-phase',uniq(SIGNALS.map(s=>s.phase)),PHASE_RU);
  add('f-health',uniq(SIGNALS.map(s=>s.health)),HEALTH_RU);
  add('f-conf',uniq(SIGNALS.map(s=>s.confidence)));
}
function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const fd=document.getElementById('f-domain').value, fp=document.getElementById('f-phase').value;
  const fh=document.getElementById('f-health').value, fc=document.getElementById('f-conf').value;
  const sort=document.getElementById('sort').value;
  let list=SIGNALS.filter(s=>{
    if(fd&&!(s.domains||[]).includes(fd))return false;
    if(fp&&s.phase!==fp)return false; if(fh&&s.health!==fh)return false; if(fc&&s.confidence!==fc)return false;
    if(q){const blob=(s.title+' '+s.process_place+' '+(s.actor||'')+' '+(s.target||'')+' '+(s.process_type||'')).toLowerCase(); if(!blob.includes(q))return false;}
    return true;
  });
  const key={priority:s=>-s.priority,pressure:s=>-(s.pressure||0),severity:s=>-s.severity,
    age:s=>new Date(s.first_seen||0).getTime(),update:s=>-new Date(s.last_seen||s.last_update||0).getTime(),
    evidence:s=>-(s.evidence_count||0)}[sort];
  list.sort((a,b)=>key(a)-key(b));
  document.getElementById('count').innerHTML=`<b>${list.length}</b> процессов`;
  document.getElementById('grid').innerHTML=list.map(cardHTML).join('')||'<div class="error">Ничего не найдено.</div>';
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDossier(c.dataset.id));
}
function metric(l,v){return `<div class="metric"><div class="ml">${l}</div><div class="mv" style="color:${scale(v)}">${v}</div><div class="bar"><i style="width:${Math.max(4,v)}%;background:${scale(v)}"></i></div></div>`;}
function cardHTML(s){
  const pr=s.priority||0, sv=s.severity||0, pe=s.pressure||0;
  return `<div class="card" data-id="${esc(s.signal_id)}">
    <div class="edge" style="background:${healthColor(s.health)}"></div>
    ${s.watchlist?'<div class="watch">◆ WATCHLIST</div>':''}
    <div class="type"><span>${esc(s.process_type||(s.domains||[]).map(d=>DOM_RU[d]||d).join('/'))}</span></div>
    <h3>${esc(s.title)}</h3>
    <div class="place">${esc(s.process_place||'—')}${s.actor?' · '+esc(s.actor)+(s.target?' → '+esc(s.target):''):''}</div>
    <div class="metrics">${metric('Priority',pr)}${metric('Severity',sv)}${metric('Pressure',pe)}</div>
    <div class="chips">
      <span class="chip hl">${PHASE_RU[s.phase]||s.phase}</span>
      <span class="chip" style="color:${healthColor(s.health)};border-color:${healthColor(s.health)}44">${HEALTH_RU[s.health]||s.health}</span>
      <span class="chip">${esc(s.confidence)}</span>
      ${s.velocity&&s.velocity.category?`<span class="chip">${esc(s.velocity.category)}</span>`:''}
    </div>
    <div class="foot"><span class="ev">${s.evidence_count||0} подтв. · ${esc(s.age||'—')}</span><span>${ago(s.last_seen||s.last_update)}</span></div>
  </div>`;
}
// ── DOSSIER ──
function openDossier(id){
  const s=BYID[id]; if(!s)return;
  document.getElementById('dossier').innerHTML=dossierHTML(s);
  document.getElementById('dossier').classList.add('on'); document.getElementById('ov').classList.add('on');
  document.getElementById('dossier').scrollTop=0;
  document.querySelectorAll('.conn').forEach(c=>c.onclick=()=>openDossier(c.dataset.id));
}
function closeD(){document.getElementById('dossier').classList.remove('on');document.getElementById('ov').classList.remove('on');}
document.getElementById('ov').onclick=closeD;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD();});
function connGroup(label,ids){
  ids=(ids||[]).filter(i=>BYID[i]); if(!ids.length)return '';
  return `<div class="conn-grp"><div class="cl">${label}</div>${ids.map(i=>`<span class="conn" data-id="${esc(i)}">${esc(BYID[i].title)}</span>`).join('')}</div>`;
}
function dossierHTML(s){
  const g=s.dna||{}, fc=s.forecast||{}, v=s.velocity||{}, ce=s.confidence_evolution||{};
  const ex=s.explain||{}, am=s.atlas_memory, rec=s.recurrence, sim=s.similar_processes||[];
  const secSummary=`<div class="sec"><div class="sh">Summary</div>
    <p style="font-family:var(--serif);font-size:16px;line-height:1.5;color:var(--ink);margin-bottom:12px">${esc(ex.why_exists||'')}</p>
    <div class="kv">
      <div class="k">Тип процесса</div><div class="v">${esc(s.process_type||'—')}</div>
      <div class="k">Текущее состояние</div><div class="v">${PHASE_RU[s.phase]||s.phase} · ${HEALTH_RU[s.health]||s.health}</div>
      <div class="k">Статус</div><div class="v">${esc(s.status||'active')}</div>
      <div class="k">Возраст</div><div class="v">${esc(s.age||'—')}</div>
      <div class="k">Последнее обновление</div><div class="v">${ago(s.last_seen||s.last_update)}</div>
    </div></div>`;
  const secDyn=`<div class="sec"><div class="sh">Dynamics</div>
    <div class="dmetrics" style="margin-bottom:14px">
      <div class="dm"><div class="k">Pressure</div><div class="v" style="color:${scale(s.pressure)}">${s.pressure||0}</div>${s.pressure_from_cascade?`<div class="s">+${s.pressure_from_cascade} каскад</div>`:''}</div>
      <div class="dm"><div class="k">Priority</div><div class="v" style="color:${scale(s.priority)}">${s.priority||0}</div></div>
      <div class="dm"><div class="k">Severity</div><div class="v" style="color:${scale(s.severity)}">${s.severity||0}</div></div>
      <div class="dm"><div class="k">Velocity /ч</div><div class="v">${v.severity_per_h>0?'+':''}${v.severity_per_h||0}</div><div class="s">${esc(v.category||'')}</div></div>
      <div class="dm"><div class="k">Acceleration</div><div class="v">${s.acceleration>0?'+':''}${s.acceleration||0}</div></div>
      <div class="dm"><div class="k">Health</div><div class="v" style="font-size:15px;color:${healthColor(s.health)}">${HEALTH_RU[s.health]||s.health}</div></div>
    </div>
    <div class="cl" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">Прогноз следующего шага</div>
    <div class="forecast-bars">
      ${[['Эскалация',fc.escalation,'#D4AF5A'],['Стабилизация',fc.stabilization,'#1faacc'],['Распад',fc.decay,'#5a5568']].map(f=>
        `<div class="fb"><span class="fl">${f[0]}</span><span class="ft"><i style="width:${Math.round((f[1]||0)*100)}%;background:${f[2]}"></i></span><span class="fv">${Math.round((f[1]||0)*100)}%</span></div>`).join('')}
    </div>
    ${s.critical_transition?'<p style="color:var(--gold2);font-size:12px;margin-top:12px;letter-spacing:.05em">⚠ Признаки критического перехода системы</p>':''}
  </div>`;
  const secTL=(s.timeline&&s.timeline.length)?`<div class="sec"><div class="sh">Timeline</div><div class="tl">
    ${s.timeline.slice().reverse().map(t=>`<div class="ti"><div class="te">${esc(t.event)}</div>${t.detail?`<div class="td">${esc(t.detail)}</div>`:''}<div class="tt">${esc((t.t||'').replace('T',' ').slice(0,16))}</div></div>`).join('')}
  </div></div>`:'';
  const secEv=`<div class="sec"><div class="sh">Evidence · ${s.evidence_count||0}</div>
    ${(s.evidence||[]).map(e=>`<div class="ev-item"><div><div class="et">${esc(e.title)}</div><div class="em">${esc(e.source)} · ${esc(ROLE_RU[e.role]||e.quality||e.role)} · ${esc(e.date)}${e.match?' · '+esc(e.match):''}</div></div><div class="es" style="color:${scale(e.severity)}">${e.severity||''}</div></div>`).join('')}</div>`;
  const conns=connGroup('Причина для',s.causes)+connGroup('Следствие',s.caused_by)+connGroup('Усиливает',s.amplifies)+connGroup('Подавляет',s.suppresses)+connGroup('Связанные',s.related);
  const secConn=conns?`<div class="sec"><div class="sh">Connections</div>${conns}</div>`:'';
  const secGeo=`<div class="sec"><div class="sh">Geography</div><div class="kv">
    <div class="k">Место процесса</div><div class="v">${esc(s.process_place||'—')}</div>
    ${s.actor?`<div class="k">Актор</div><div class="v">${esc(s.actor)}</div>`:''}
    ${s.target?`<div class="k">Объект</div><div class="v">${esc(s.target)}</div>`:''}
    <div class="k">Страны</div><div class="v">${(s.countries||[]).join(', ')||'—'}</div>
    <div class="k">Затронутые регионы</div><div class="v">${(s.affected_regions||[]).join(', ')||'—'}</div>
  </div>${s.geo_consistent===false?'<p style="color:var(--gold);font-size:11px;margin-top:8px">⚠ Требует географической проверки</p>':''}</div>`;
  const memBits=[];
  if(g.escalation_pattern)memBits.push(['Паттерн развития (DNA)',g.escalation_pattern]);
  if(g.average_growth_rate!=null)memBits.push(['Средний рост','severity '+(g.average_growth_rate>0?'+':'')+g.average_growth_rate+'/день']);
  if(g.historical_max_pressure)memBits.push(['Историч. макс. давление',g.historical_max_pressure]);
  const secMem=`<div class="sec"><div class="sh">Memory · опыт Atlas</div>
    ${(s.expected_next&&s.expected_next.length)?`<div style="margin-bottom:12px"><div class="cl" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Что обычно происходит дальше</div>${s.expected_next.map(x=>`<span class="pill" style="color:var(--gold2);border-color:var(--line)">${esc(x)}</span>`).join('')}</div>`:''}
    ${am?`<p class="mem-note">${esc(am.note)}</p>`:''}
    ${rec?`<p class="mem-note" style="margin-top:8px">Циклический процесс: ${esc(rec.label)} (${rec.occurrences} повторений)</p>`:''}
    ${sim.length?`<div style="margin-top:12px"><div class="cl" style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Похожие процессы</div>${sim.map(x=>`<span class="pill">${esc(x.signature.split('|')[1]||x.signature)}${x.typical_outcome?' → '+esc(x.typical_outcome):''}</span>`).join('')}</div>`:''}
    ${memBits.length?`<div class="kv" style="margin-top:12px">${memBits.map(b=>`<div class="k">${b[0]}</div><div class="v">${esc(b[1])}</div>`).join('')}</div>`:''}
    ${(!am&&!rec&&!sim.length)?'<p class="mem-empty">Недостаточно накопленной истории.</p>':''}
  </div>`;
  const secExp=`<div class="sec"><div class="sh">Explainability</div>
    ${[['Почему создан процесс',ex.why_exists],['Почему такой Priority',ex.why_priority],['Почему такая Phase',ex.why_phase],['Почему такой Confidence',ex.why_confidence]]
      .filter(x=>x[1]).map(x=>`<div class="exp-item"><div class="eq">${x[0]}</div><div class="ea">${esc(x[1])}</div></div>`).join('')}
    ${ce.progression?`<div class="exp-item"><div class="eq">Эволюция доверия</div><div class="ea">${esc(ce.progression)}${ce.tier==='verified'?' · <b style="color:var(--gold2)">verified</b>':''}</div></div>`:''}
  </div>`;
  return `<div class="dhead"><div class="dclose" onclick="closeD()">✕</div>
    <div class="dtype">${esc(s.process_type||'')} ${s.watchlist?' · ◆ watchlist':''}</div>
    <h2>${esc(s.title)}</h2><div class="dplace">${esc(s.process_place||'')}</div></div>
    ${secSummary}${secDyn}${secTL}${secEv}${secConn}${secGeo}${secMem}${secExp}`;
}
</script>
</body>
</html>
