<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>АРХИВ · Global Risk Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700;800&family=Syne+Mono&display=swap" rel="stylesheet">

<!-- Leaflet core -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- Heatmap -->
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

<style>
/* ═══════════════════════════════════════════════════
   DESIGN SYSTEM — Military intelligence terminal
   Dark graphite + amber + signal red
   ═══════════════════════════════════════════════════ */
:root {
  --void:    #050608;
  --surface: #0A0C10;
  --panel:   #0E1117;
  --border:  rgba(255,255,255,.07);
  --amber:   #C8900A;
  --amber-d: #8A6208;
  --amber-g: rgba(200,144,10,.12);
  --red:     #C0312A;
  --teal:    #0F8C7A;
  --ink:     #A8A090;
  --cream:   #E8DEC8;
  --font:    'Syne', sans-serif;
  --mono:    'Syne Mono', monospace;

  --cat-wildfire:   #E84030;
  --cat-volcano:    #9B30C8;
  --cat-flood:      #2070E8;
  --cat-storm:      #E87018;
  --cat-earthquake: #D8C020;
  --cat-drought:    #C87830;
  --cat-cyclone:    #E04090;
  --cat-default:    #80A0B0;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--void);
  font-family: var(--font);
  color: var(--cream);
  -webkit-font-smoothing: antialiased;
}

/* ═══ MAP ═══ */
#map {
  position: fixed;
  inset: 0;
  z-index: 1;
  background: #060810;
}

/* Override Leaflet cluster styles for dark theme */
.marker-cluster-small,
.marker-cluster-medium,
.marker-cluster-large {
  background-clip: padding-box;
  border-radius: 20px;
}
.marker-cluster-small  { background: rgba(200,144,10,.25); }
.marker-cluster-medium { background: rgba(192,49,42,.28); }
.marker-cluster-large  { background: rgba(155,48,200,.28); }
.marker-cluster-small div,
.marker-cluster-medium div,
.marker-cluster-large div {
  width: 30px; height: 30px;
  margin: 5px;
  text-align: center;
  border-radius: 15px;
  font: 700 11px var(--mono);
  color: var(--cream);
  line-height: 30px;
}
.marker-cluster-small div  { background: rgba(200,144,10,.55); }
.marker-cluster-medium div { background: rgba(192,49,42,.55); }
.marker-cluster-large div  { background: rgba(155,48,200,.55); }

/* ═══ HEADER BAR ═══ */
#header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 48px;
  background: rgba(5,6,8,.94);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 0;
}

.h-brand {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--amber);
}
.h-brand span { color: var(--ink); font-weight: 400; }

.h-sep { width: 1px; height: 20px; background: var(--border); margin: 0 16px; flex-shrink: 0; }

.h-label {
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--ink);
  font-family: var(--mono);
}

.h-val {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--cream);
  margin-left: 6px;
}

#status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--teal);
  flex-shrink: 0;
  position: relative;
}
#status-dot::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 1px solid var(--teal);
  opacity: 0;
  animation: live-pulse 2.4s ease-out infinite;
}
@keyframes live-pulse {
  0%   { transform: scale(1); opacity: .8; }
  100% { transform: scale(2.4); opacity: 0; }
}
#status-dot.error { background: var(--red); }
#status-dot.error::after { border-color: var(--red); }

#status-text {
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  font-family: var(--mono);
  color: var(--teal);
  margin-left: 7px;
}

.h-spacer { flex: 1; }

#last-updated {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink);
  letter-spacing: .06em;
}

/* ═══ SIDE PANEL ═══ */
#panel {
  position: fixed;
  top: 48px; right: 0; bottom: 0;
  z-index: 100;
  width: 260px;
  background: rgba(5,6,8,.88);
  border-left: 1px solid var(--border);
  backdrop-filter: blur(24px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
#panel.collapsed { transform: translateX(260px); }

#panel-toggle {
  position: fixed;
  top: 60px;
  right: 0;
  z-index: 101;
  width: 28px;
  height: 56px;
  background: rgba(5,6,8,.88);
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 4px 0 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 10px;
  color: var(--ink);
  writing-mode: vertical-rl;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-family: var(--mono);
  transition: color .2s;
  backdrop-filter: blur(12px);
}
#panel-toggle:hover { color: var(--amber); }
#panel.collapsed + #panel-toggle { right: 0; }

.panel-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}

.section-label {
  font-size: 8px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: var(--amber-d);
  font-family: var(--mono);
  margin-bottom: 12px;
}

/* Stats grid */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.stat-box {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 8px 10px;
}
.stat-num {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 400;
  line-height: 1;
  color: var(--cream);
}
.stat-sub {
  font-size: 8px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
  margin-top: 3px;
  font-family: var(--mono);
}

/* Category legend */
.cat-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  cursor: pointer;
  border-radius: 2px;
  transition: background .15s;
}
.cat-row:hover { background: rgba(255,255,255,.03); }
.cat-row.muted { opacity: .3; }
.cat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.cat-name {
  font-size: 11px;
  color: var(--ink);
  flex: 1;
  letter-spacing: .04em;
}
.cat-count {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--cream);
}

/* View controls */
.view-btns {
  display: flex;
  gap: 6px;
}
.view-btn {
  flex: 1;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 7px 0;
  font-size: 9px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
  cursor: pointer;
  font-family: var(--mono);
  text-align: center;
  transition: all .2s;
}
.view-btn:hover { border-color: var(--amber-d); color: var(--amber); }
.view-btn.on {
  background: var(--amber-g);
  border-color: var(--amber-d);
  color: var(--amber);
}

/* Recent events feed */
#event-feed {
  flex: 1;
  overflow-y: auto;
  padding: 0;
}
#event-feed::-webkit-scrollbar { width: 2px; }
#event-feed::-webkit-scrollbar-thumb { background: var(--amber-d); }

.feed-item {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.feed-item::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 2px;
}
.feed-item:hover { background: rgba(255,255,255,.025); }
.feed-title {
  font-size: 11px;
  color: var(--cream);
  line-height: 1.4;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.feed-meta {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink);
  display: flex;
  gap: 8px;
}
.feed-cat {
  padding: 1px 5px;
  border-radius: 2px;
  font-size: 8px;
  letter-spacing: .1em;
  text-transform: uppercase;
  background: rgba(255,255,255,.06);
}

/* ═══ BOTTOM BAR ═══ */
#bottom-bar {
  position: fixed;
  bottom: 0; left: 0;
  right: 260px;
  z-index: 100;
  height: 32px;
  background: rgba(5,6,8,.88);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  padding: 0 14px;
  gap: 20px;
  transition: right .3s cubic-bezier(.4,0,.2,1);
}
#bottom-bar.expanded { right: 0; }

.bb-item {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink);
  letter-spacing: .1em;
  display: flex;
  align-items: center;
  gap: 5px;
}
.bb-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}
#refresh-timer {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
#timer-bar {
  width: 60px;
  height: 2px;
  background: rgba(255,255,255,.08);
  border-radius: 1px;
  overflow: hidden;
}
#timer-fill {
  height: 100%;
  background: var(--amber);
  border-radius: 1px;
  transition: width linear 1s;
}

/* ═══ POPUP ═══ */
.leaflet-popup-content-wrapper {
  background: rgba(8,10,14,.95) !important;
  border: 1px solid var(--border) !important;
  border-radius: 4px !important;
  box-shadow: 0 8px 32px rgba(0,0,0,.6) !important;
  padding: 0 !important;
  font-family: var(--font) !important;
  backdrop-filter: blur(20px);
}
.leaflet-popup-tip { background: rgba(8,10,14,.95) !important; }
.leaflet-popup-content { margin: 0 !important; width: auto !important; }

.popup-inner {
  padding: 14px 16px;
  min-width: 200px;
  max-width: 280px;
}
.popup-cat-bar {
  height: 2px;
  border-radius: 1px;
  margin-bottom: 10px;
}
.popup-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.4;
  margin-bottom: 8px;
}
.popup-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  color: var(--ink);
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.popup-row:last-child { border-bottom: none; }
.popup-row-val {
  font-family: var(--mono);
  color: var(--cream);
  font-size: 10px;
  text-align: right;
  max-width: 160px;
}
.popup-source-badge {
  display: inline-block;
  font-size: 8px;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 2px;
  background: rgba(255,255,255,.06);
  margin-top: 8px;
}

/* ═══ PULSE MARKERS ═══ */
.pulse-marker {
  position: relative;
}
.pulse-ring {
  position: absolute;
  border-radius: 50%;
  animation: pulse-expand 2.5s ease-out infinite;
}
@keyframes pulse-expand {
  0%   { transform: scale(1); opacity: .7; }
  100% { transform: scale(3.5); opacity: 0; }
}

/* ═══ LOADING ═══ */
#loading {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--void);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  transition: opacity .5s;
}
#loading.done { opacity: 0; pointer-events: none; }

.load-brand {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--amber);
}
.load-sub {
  font-size: 9px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--ink);
  font-family: var(--mono);
}
.load-bar-wrap {
  width: 200px;
  height: 2px;
  background: rgba(255,255,255,.06);
  border-radius: 1px;
  overflow: hidden;
}
.load-bar {
  height: 100%;
  background: var(--amber);
  border-radius: 1px;
  width: 0;
  animation: load-anim 1.8s ease-in-out forwards;
}
@keyframes load-anim {
  0%   { width: 0; }
  60%  { width: 70%; }
  100% { width: 100%; }
}
.load-status {
  font-size: 9px;
  font-family: var(--mono);
  color: var(--ink);
  letter-spacing: .1em;
}

/* ═══ ERROR TOAST ═══ */
#toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  z-index: 300;
  background: rgba(192,49,42,.15);
  border: 1px solid rgba(192,49,42,.4);
  border-radius: 4px;
  padding: 10px 20px;
  font-size: 11px;
  font-family: var(--mono);
  color: #F08080;
  letter-spacing: .08em;
  backdrop-filter: blur(16px);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* Mobile */
@media (max-width: 680px) {
  #panel { display: none; }
  #panel-toggle { display: none; }
  #bottom-bar { right: 0; }
  #header .h-sep ~ * { display: none; }
}
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="load-brand">АРХИВ</div>
  <div class="load-sub">Global Risk Intelligence</div>
  <div class="load-bar-wrap"><div class="load-bar"></div></div>
  <div class="load-status" id="load-status">Initialising feed...</div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- MAP -->
<div id="map"></div>

<!-- HEADER -->
<header id="header">
  <div class="h-brand">АРХИВ <span>· RISK MAP</span></div>
  <div class="h-sep"></div>
  <div id="status-dot"></div>
  <div id="status-text">LIVE</div>
  <div class="h-sep"></div>
  <div class="h-label">EVENTS</div>
  <div class="h-val" id="h-event-count">—</div>
  <div class="h-sep"></div>
  <div class="h-label">SOURCES</div>
  <div class="h-val" id="h-source-count">1</div>
  <div class="h-spacer"></div>
  <div id="last-updated">—</div>
</header>

<!-- SIDE PANEL -->
<div id="panel">

  <div class="panel-section">
    <div class="section-label">System Status</div>
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-num" id="stat-total">0</div>
        <div class="stat-sub">Total Events</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-recent">0</div>
        <div class="stat-sub">Last 24h</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-cats">0</div>
        <div class="stat-sub">Categories</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-regions">0</div>
        <div class="stat-sub">Regions</div>
      </div>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">View Mode</div>
    <div class="view-btns">
      <div class="view-btn on" id="btn-cluster" onclick="setView('cluster')">CLUSTER</div>
      <div class="view-btn" id="btn-heat" onclick="setView('heat')">HEAT</div>
      <div class="view-btn" id="btn-all" onclick="setView('all')">ALL</div>
    </div>
  </div>

  <div class="panel-section">
    <div class="section-label">Categories</div>
    <div id="cat-legend"></div>
  </div>

  <div class="panel-section" style="padding-bottom:8px">
    <div class="section-label">Live Feed</div>
  </div>
  <div id="event-feed"></div>

</div>
<div id="panel-toggle" onclick="togglePanel()">PANEL</div>

<!-- BOTTOM BAR -->
<div id="bottom-bar" id="bottom-bar">
  <div class="bb-item"><div class="bb-dot" style="background:var(--cat-wildfire)"></div>FIRMS</div>
  <div class="bb-item"><div class="bb-dot" style="background:var(--cat-earthquake)"></div>USGS</div>
  <div class="bb-item"><div class="bb-dot" style="background:var(--cat-flood)"></div>GDACS</div>
  <div class="bb-item"><div class="bb-dot" style="background:var(--cat-volcano)"></div>EONET</div>
  <div class="bb-item"><div class="bb-dot" style="background:var(--cat-storm)"></div>NOAA</div>
  <div id="refresh-timer">
    <span id="timer-label">60s</span>
    <div id="timer-bar"><div id="timer-fill" style="width:100%"></div></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════
// GLOBAL RISK INTELLIGENCE MAP  v4
// Architecture: Data-driven, source-agnostic, live-refresh
//
// Data contract (current backend):
//   GET http://62.238.37.129:8001/events.json
//   [ { title, category[0..n], date, coordinates:[lon, lat] } ]
//
// Future sources: NASA FIRMS, EONET, GDACS, Copernicus, FloodHub,
//   USGS, Volcano Discovery, NOAA — add to SOURCE_REGISTRY below
// ════════════════════════════════════════════════════════════════

'use strict';

// ── CONFIG ────────────────────────────────────────────────────────
const CFG = {
  API_URL:       'http://62.238.37.129:8001/events.json',
  REFRESH_MS:    60_000,         // auto-refresh interval
  CLUSTER_MAX:   80,             // uncluster below this zoom
  PULSE_MAX_AGE: 24 * 3600000,  // animate markers < 24h old
  FEED_MAX:      40,             // items in the live feed
  REQUEST_TIMEOUT: 12_000,
};

// ── CATEGORY REGISTRY ─────────────────────────────────────────────
// Add new categories here — map uses this for color + icon
const CAT = {
  'wildfires':    { color: '#E84030', label: 'Wildfires' },
  'wildfire':     { color: '#E84030', label: 'Wildfires' },
  'fire':         { color: '#E84030', label: 'Wildfires' },
  'volcanoes':    { color: '#9B30C8', label: 'Volcanoes' },
  'volcano':      { color: '#9B30C8', label: 'Volcanoes' },
  'floods':       { color: '#2070E8', label: 'Floods' },
  'flood':        { color: '#2070E8', label: 'Floods' },
  'floodhub':     { color: '#2070E8', label: 'Floods' },
  'storms':       { color: '#E87018', label: 'Storms' },
  'storm':        { color: '#E87018', label: 'Storms' },
  'cyclone':      { color: '#E04090', label: 'Cyclones' },
  'hurricane':    { color: '#E04090', label: 'Cyclones' },
  'typhoon':      { color: '#E04090', label: 'Cyclones' },
  'earthquakes':  { color: '#D8C020', label: 'Earthquakes' },
  'earthquake':   { color: '#D8C020', label: 'Earthquakes' },
  'seismic':      { color: '#D8C020', label: 'Earthquakes' },
  'drought':      { color: '#C87830', label: 'Droughts' },
  'drought':      { color: '#C87830', label: 'Droughts' },
  'landslide':    { color: '#A05828', label: 'Landslides' },
  'tsunami':      { color: '#40B0D0', label: 'Tsunamis' },
  'epidemic':     { color: '#50C880', label: 'Epidemics' },
  'disease':      { color: '#50C880', label: 'Epidemics' },
};

function catInfo(categories) {
  if (!categories) return { color: '#80A0B0', label: 'Unknown' };
  const cats = Array.isArray(categories) ? categories : [categories];
  for (const c of cats) {
    const info = CAT[c.toLowerCase().trim()];
    if (info) return info;
    // Partial match
    for (const [k, v] of Object.entries(CAT)) {
      if (c.toLowerCase().includes(k) || k.includes(c.toLowerCase())) return v;
    }
  }
  return { color: '#80A0B0', label: cats[0] || 'Unknown' };
}

// ── SOURCE REGISTRY ───────────────────────────────────────────────
// Future: add per-source adapters that normalise to common schema.
// Each adapter returns: { title, category[], date, coordinates:[lon,lat], source, severity? }
const SOURCES = [
  {
    id:      'primary',
    name:    'АРХИВ Feed',
    url:     CFG.API_URL,
    enabled: true,
    // Normalise function — converts raw item to canonical event
    normalise(raw) {
      if (!raw.coordinates || raw.coordinates.length < 2) return null;
      return {
        id:          _fingerprint(raw),
        title:       raw.title || 'Unknown event',
        category:    Array.isArray(raw.category) ? raw.category : [raw.category || 'Unknown'],
        date:        raw.date || null,
        coordinates: raw.coordinates,   // [lon, lat]
        source:      raw.source || 'АРХИВ',
        severity:    raw.severity || null,
        raw,
      };
    }
  }
  // Future sources — uncomment and configure:
  // { id: 'firms', name: 'NASA FIRMS', url: '...', enabled: false, normalise(r){...} },
  // { id: 'usgs',  name: 'USGS',       url: '...', enabled: false, normalise(r){...} },
];

// ── STATE ─────────────────────────────────────────────────────────
let map, clusterGroup, heatLayer;
let allEvents      = [];           // canonical events array
let seenIds        = new Set();    // deduplication across refreshes
let catFilter      = new Set();    // empty = show all
let currentView    = 'cluster';    // cluster | heat | all
let panelOpen      = true;
let timerCountdown = CFG.REFRESH_MS / 1000;
let timerInterval, refreshTimeout;

// ── MAP INIT ──────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', {
    center:          [20, 15],
    zoom:            3,
    zoomControl:     false,
    attributionControl: false,
    preferCanvas:    true,    // performance for 1000+ markers
  });

  // Dark intelligence basemap
  L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { subdomains: 'abcd', maxZoom: 19 }
  ).addTo(map);

  // Subtle attribution
  L.control.attribution({ prefix: false, position: 'bottomleft' }).addTo(map);

  // Zoom control repositioned
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Cluster group
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius:    60,
    disableClusteringAtZoom: CFG.CLUSTER_MAX,
    spiderfyOnMaxZoom:   true,
    showCoverageOnHover: false,
    iconCreateFunction:  createClusterIcon,
    chunkedLoading:      true,   // non-blocking for 1000+ markers
  });

  map.addLayer(clusterGroup);
}

function createClusterIcon(cluster) {
  const count  = cluster.getChildCount();
  const events = cluster.getAllChildMarkers().map(m => m.options._event);
  // Dominant category colour
  const catCounts = {};
  events.forEach(e => {
    const lbl = catInfo(e.category).label;
    catCounts[lbl] = (catCounts[lbl] || 0) + 1;
  });
  const dominant = Object.entries(catCounts).sort((a,b) => b[1]-a[1])[0];
  const col  = dominant ? catInfo([dominant[0].toLowerCase()]).color : '#80A0B0';
  const size = count < 10 ? 36 : count < 50 ? 44 : 52;

  return L.divIcon({
    html: `<div style="
      width:${size}px;height:${size}px;
      border-radius:50%;
      background:${col}22;
      border:1.5px solid ${col}88;
      display:flex;align-items:center;justify-content:center;
      font:700 ${size < 40 ? 11 : 13}px 'Syne Mono',monospace;
      color:${col};">
      ${count < 1000 ? count : '1k+'}
    </div>`,
    className: '',
    iconSize:  [size, size],
    iconAnchor:[size/2, size/2],
  });
}

// ── EVENT FINGERPRINT (deduplication key) ─────────────────────────
function _fingerprint(raw) {
  const key = `${raw.title || ''}|${(raw.coordinates||[]).join(',')}|${raw.date || ''}`;
  let h = 0;
  for (let i = 0; i < key.length; i++) {
    h = ((h << 5) - h) + key.charCodeAt(i);
    h |= 0;
  }
  return (h >>> 0).toString(16);
}

// ── DATA FETCH ────────────────────────────────────────────────────
async function fetchSource(source) {
  const controller = new AbortController();
  const timeout    = setTimeout(() => controller.abort(), CFG.REQUEST_TIMEOUT);
  try {
    const resp = await fetch(source.url, {
      signal:  controller.signal,
      headers: { 'Accept': 'application/json' },
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    return Array.isArray(data) ? data : (data.events || data.data || []);
  } finally {
    clearTimeout(timeout);
  }
}

async function loadAllSources() {
  const results = await Promise.allSettled(
    SOURCES.filter(s => s.enabled).map(s =>
      fetchSource(s).then(raw => ({ source: s, raw }))
    )
  );

  let newCount = 0;
  const incoming = [];

  results.forEach(r => {
    if (r.status !== 'fulfilled') {
      console.warn('[Feed] source failed:', r.reason);
      return;
    }
    const { source, raw } = r.value;
    raw.forEach(item => {
      const ev = source.normalise(item);
      if (!ev) return;
      if (seenIds.has(ev.id)) return;   // dedup across refreshes
      seenIds.add(ev.id);
      incoming.push(ev);
      newCount++;
    });
  });

  return { incoming, newCount };
}

// ── MARKER CREATION ───────────────────────────────────────────────
function makeMarker(ev) {
  const [lon, lat]  = ev.coordinates;
  const info        = catInfo(ev.category);
  const isRecent    = ev.date && (Date.now() - new Date(ev.date)) < CFG.PULSE_MAX_AGE;

  // Icon with optional pulse ring for recent events
  const r   = 6;
  const box = isRecent ? 32 : 14;

  const icon = L.divIcon({
    html: isRecent
      ? `<div style="position:relative;width:${box}px;height:${box}px;display:flex;align-items:center;justify-content:center;">
           <div style="
             position:absolute;inset:0;
             border-radius:50%;
             background:${info.color}22;
             border:1px solid ${info.color}66;
             animation:pulse-expand 2.5s ease-out infinite;">
           </div>
           <div style="
             width:${r*2}px;height:${r*2}px;
             border-radius:50%;
             background:${info.color};
             box-shadow:0 0 8px ${info.color}88;
             position:relative;z-index:1;">
           </div>
         </div>`
      : `<div style="
           width:${r*2}px;height:${r*2}px;
           border-radius:50%;
           background:${info.color}DD;
           border:1px solid ${info.color};
           box-shadow:0 0 4px ${info.color}44;">
         </div>`,
    className:  '',
    iconSize:   [box, box],
    iconAnchor: [box/2, box/2],
  });

  const marker = L.marker([lat, lon], {
    icon,
    _event: ev,    // attach canonical event for cluster colouring
  });

  marker.bindPopup(buildPopup(ev), {
    maxWidth:    300,
    className:   'intel-popup',
    closeButton: false,
  });

  return marker;
}

function buildPopup(ev) {
  const info    = catInfo(ev.category);
  const catList = (ev.category || []).join(', ');
  const dateStr = ev.date ? new Date(ev.date).toLocaleString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', timeZoneName: 'short'
  }) : 'Date unknown';

  return `<div class="popup-inner">
    <div class="popup-cat-bar" style="background:${info.color}"></div>
    <div class="popup-title">${_esc(ev.title)}</div>
    <div class="popup-row">
      <span>Category</span>
      <span class="popup-row-val">${_esc(catList)}</span>
    </div>
    <div class="popup-row">
      <span>Date</span>
      <span class="popup-row-val">${_esc(dateStr)}</span>
    </div>
    <div class="popup-row">
      <span>Coordinates</span>
      <span class="popup-row-val" style="font-family:var(--mono);font-size:9px">
        ${ev.coordinates[1].toFixed(3)}, ${ev.coordinates[0].toFixed(3)}
      </span>
    </div>
    ${ev.source ? `<div class="popup-source-badge">${_esc(ev.source)}</div>` : ''}
  </div>`;
}

function _esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// ── VIEW MANAGEMENT ───────────────────────────────────────────────
function setView(mode) {
  currentView = mode;
  ['cluster','heat','all'].forEach(m => {
    document.getElementById(`btn-${m}`)?.classList.toggle('on', m === mode);
  });
  renderMap();
}

function renderMap() {
  // Clear existing layers
  clusterGroup.clearLayers();
  if (heatLayer) { map.removeLayer(heatLayer); heatLayer = null; }

  const visible = catFilter.size === 0
    ? allEvents
    : allEvents.filter(e => {
        const lbl = catInfo(e.category).label;
        return !catFilter.has(lbl);
      });

  if (currentView === 'heat') {
    const pts = visible
      .filter(e => e.coordinates?.length >= 2)
      .map(e => [e.coordinates[1], e.coordinates[0], 0.6]);
    heatLayer = L.heatLayer(pts, {
      radius:  22,
      blur:    18,
      maxZoom: 10,
      gradient: { 0.3: '#2070E8', 0.55: '#E87018', 0.8: '#E84030', 1.0: '#FF4040' },
    });
    map.addLayer(heatLayer);
    return;
  }

  // cluster or all (same layer, clustering toggled by zoom)
  if (currentView === 'all') {
    clusterGroup.disableClustering?.();
  }

  const markers = visible
    .filter(e => e.coordinates?.length >= 2)
    .map(makeMarker);

  clusterGroup.addLayers(markers);   // bulk add — much faster than one-by-one
}

// ── STATS + LEGEND ────────────────────────────────────────────────
function updateStats() {
  const now    = Date.now();
  const recent = allEvents.filter(e => e.date && (now - new Date(e.date)) < 86400000).length;

  // Count categories
  const catMap = {};
  allEvents.forEach(e => {
    const lbl = catInfo(e.category).label;
    catMap[lbl] = (catMap[lbl] || 0) + 1;
  });

  // Rough region count (every 10° lat/lon cell)
  const cells = new Set(allEvents.map(e => {
    if (!e.coordinates) return null;
    return `${Math.floor(e.coordinates[1]/10)},${Math.floor(e.coordinates[0]/10)}`;
  }).filter(Boolean));

  document.getElementById('stat-total').textContent   = allEvents.length;
  document.getElementById('stat-recent').textContent  = recent;
  document.getElementById('stat-cats').textContent    = Object.keys(catMap).length;
  document.getElementById('stat-regions').textContent = cells.size;
  document.getElementById('h-event-count').textContent = allEvents.length;

  // Legend
  const legendEl = document.getElementById('cat-legend');
  legendEl.innerHTML = '';
  Object.entries(catMap)
    .sort((a,b) => b[1]-a[1])
    .forEach(([lbl, count]) => {
      const col  = catInfo([lbl.toLowerCase()]).color;
      const muted = catFilter.has(lbl);
      const row  = document.createElement('div');
      row.className = `cat-row${muted ? ' muted' : ''}`;
      row.innerHTML = `
        <div class="cat-dot" style="background:${col}"></div>
        <div class="cat-name">${_esc(lbl)}</div>
        <div class="cat-count">${count}</div>`;
      row.onclick = () => toggleCatFilter(lbl, row);
      legendEl.appendChild(row);
    });
}

function toggleCatFilter(lbl, el) {
  if (catFilter.has(lbl)) catFilter.delete(lbl);
  else catFilter.add(lbl);
  el.classList.toggle('muted', catFilter.has(lbl));
  renderMap();
}

// ── LIVE FEED ─────────────────────────────────────────────────────
function updateFeed(incoming) {
  const feed = document.getElementById('event-feed');
  const sorted = [...incoming].sort((a,b) => {
    const da = a.date ? new Date(a.date) : 0;
    const db = b.date ? new Date(b.date) : 0;
    return db - da;
  }).slice(0, CFG.FEED_MAX);

  sorted.forEach(ev => {
    const info = catInfo(ev.category);
    const item = document.createElement('div');
    item.className = 'feed-item';
    item.style.setProperty('--cat-col', info.color);
    item.querySelector?.('.feed-item::before')?.style.setProperty('background', info.color);
    item.style.borderLeft = `2px solid ${info.color}60`;

    const dateStr = ev.date ? new Date(ev.date).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'short'
    }) : '';

    item.innerHTML = `
      <div class="feed-title">${_esc(ev.title)}</div>
      <div class="feed-meta">
        <span class="feed-cat" style="background:${info.color}22;color:${info.color}">${_esc(info.label)}</span>
        ${dateStr ? `<span>${_esc(dateStr)}</span>` : ''}
      </div>`;

    item.onclick = () => {
      if (ev.coordinates?.length >= 2) {
        map.setView([ev.coordinates[1], ev.coordinates[0]], 8, { animate: true });
      }
    };

    feed.insertBefore(item, feed.firstChild);
  });

  // Trim feed to max
  while (feed.children.length > CFG.FEED_MAX) {
    feed.removeChild(feed.lastChild);
  }
}

// ── HEADER STATUS ─────────────────────────────────────────────────
function setStatus(ok, msg) {
  const dot  = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  dot.className  = ok ? '' : 'error';
  text.textContent = ok ? 'LIVE' : 'OFFLINE';
  text.style.color = ok ? 'var(--teal)' : 'var(--red)';
  dot.style.background = ok ? 'var(--teal)' : 'var(--red)';
  if (!ok) showToast(msg || 'Feed unavailable');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 4000);
}

// ── TIMER BAR ─────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  timerCountdown = CFG.REFRESH_MS / 1000;
  document.getElementById('timer-fill').style.width = '100%';

  timerInterval = setInterval(() => {
    timerCountdown--;
    const pct = (timerCountdown / (CFG.REFRESH_MS / 1000)) * 100;
    document.getElementById('timer-fill').style.width = `${pct}%`;
    document.getElementById('timer-label').textContent = `${timerCountdown}s`;
    if (timerCountdown <= 0) clearInterval(timerInterval);
  }, 1000);
}

// ── MAIN REFRESH LOOP ─────────────────────────────────────────────
async function refresh(isFirst) {
  try {
    if (isFirst) setLoadStatus('Fetching live events...');

    const { incoming, newCount } = await loadAllSources();

    if (incoming.length === 0 && !isFirst) {
      // No new events — skip re-render but still update timer
      setStatus(true);
    } else {
      allEvents = [...allEvents, ...incoming];
      updateStats();
      updateFeed(incoming);
      renderMap();
      setStatus(true);
    }

    const now = new Date();
    document.getElementById('last-updated').textContent =
      `Updated ${now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;

    if (isFirst) {
      setTimeout(() => document.getElementById('loading').classList.add('done'), 300);
    }

  } catch (err) {
    console.error('[Feed] refresh error:', err);
    setStatus(false, `Feed error: ${err.message}`);
    if (isFirst) {
      setLoadStatus(`Error: ${err.message}`);
      setTimeout(() => document.getElementById('loading').classList.add('done'), 1500);
    }
  }

  // Schedule next refresh
  clearTimeout(refreshTimeout);
  refreshTimeout = setTimeout(() => {
    refresh(false);
    startTimer();
  }, CFG.REFRESH_MS);

  startTimer();
}

function setLoadStatus(msg) {
  const el = document.getElementById('load-status');
  if (el) el.textContent = msg;
}

// ── PANEL TOGGLE ──────────────────────────────────────────────────
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('collapsed', !panelOpen);
  document.getElementById('bottom-bar').classList.toggle('expanded', !panelOpen);
  document.getElementById('panel-toggle').textContent = panelOpen ? 'PANEL' : 'PANEL';
}

// ── INIT ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  refresh(true);
});
</script>
