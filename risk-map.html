<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Архив · Карта рисков</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#B8973A;--gold-l:#D4AF5A;--gold-d:#7A6228;
  --cyan:#1FAACC;--cyan-d:#0E6B82;
  --bg:#060504;--bg2:#0D0B08;--bg3:#141210;
  --cream:#E8E0D0;--muted:#6A6458;--soft:#A8A090;
  --border:rgba(184,151,58,0.15);
  --domain-climate:#1FAACC;
  --domain-economy:#B8973A;
  --domain-geopolitics:#C84B4B;
  --domain-technology:#7B5EA7;
  --domain-social:#4B8C5E;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:'Montserrat',sans-serif;font-weight:300}

#canvas{position:fixed;inset:0;z-index:1}

#ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}

#header{padding:16px 20px 0;pointer-events:all;display:flex;align-items:center;justify-content:space-between}
#logo{display:flex;align-items:baseline;gap:10px}
#logo-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--gold-l);letter-spacing:0.08em}
#logo-sub{font-size:9px;font-weight:400;color:var(--muted);letter-spacing:0.2em;text-transform:uppercase}
#updated{font-size:10px;color:var(--muted);letter-spacing:0.1em}

#filters{padding:12px 20px;pointer-events:all;display:flex;gap:8px;flex-wrap:wrap}
.filter-btn{
  padding:5px 12px;border:1px solid var(--border);background:rgba(13,11,8,0.7);
  color:var(--soft);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:400;
  letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;
  transition:all 0.2s;backdrop-filter:blur(4px);
}
.filter-btn:hover{border-color:var(--gold);color:var(--gold-l)}
.filter-btn.active{color:var(--bg);font-weight:500}
.filter-btn[data-domain="all"].active{background:var(--gold);border-color:var(--gold)}
.filter-btn[data-domain="climate"].active{background:var(--domain-climate);border-color:var(--domain-climate)}
.filter-btn[data-domain="economy"].active{background:var(--domain-economy);border-color:var(--domain-economy)}
.filter-btn[data-domain="geopolitics"].active{background:var(--domain-geopolitics);border-color:var(--domain-geopolitics)}
.filter-btn[data-domain="technology"].active{background:var(--domain-technology);border-color:var(--domain-technology)}
.filter-btn[data-domain="social"].active{background:var(--domain-social);border-color:var(--domain-social)}

#spacer{flex:1}

#stats-bar{padding:0 20px 12px;pointer-events:all;display:flex;gap:16px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat-val{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--gold-l);line-height:1}
.stat-label{font-size:9px;color:var(--muted);letter-spacing:0.15em;text-transform:uppercase}

#sidebar{
  position:fixed;right:0;top:0;bottom:0;width:320px;z-index:3;
  background:rgba(6,5,4,0.92);border-left:1px solid var(--border);
  backdrop-filter:blur(16px);transform:translateX(100%);transition:transform 0.3s ease;
  display:flex;flex-direction:column;overflow:hidden;
}
#sidebar.open{transform:translateX(0)}
#sidebar-close{
  position:absolute;top:16px;left:16px;width:28px;height:28px;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
  border-radius:2px;transition:all 0.2s;
}
#sidebar-close:hover{border-color:var(--gold);color:var(--gold)}

#event-list{flex:1;overflow-y:auto;padding:56px 0 20px}
#event-list::-webkit-scrollbar{width:2px}
#event-list::-webkit-scrollbar-track{background:transparent}
#event-list::-webkit-scrollbar-thumb{background:var(--border)}

.event-item{
  padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;
  transition:background 0.15s;
}
.event-item:hover{background:rgba(184,151,58,0.05)}
.event-item.selected{background:rgba(184,151,58,0.08);border-left:2px solid var(--gold)}
.event-domain-tag{
  font-size:8px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;
  margin-bottom:6px;display:flex;align-items:center;gap:6px;
}
.event-domain-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.event-title{font-size:12px;font-weight:400;color:var(--cream);line-height:1.4;margin-bottom:6px}
.event-meta{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.severity-bar{height:2px;background:rgba(184,151,58,0.1);margin-top:8px;border-radius:1px;overflow:hidden}
.severity-fill{height:100%;border-radius:1px;transition:width 0.3s}

#event-detail{
  position:fixed;right:0;top:0;bottom:0;width:320px;z-index:4;
  background:rgba(6,5,4,0.96);border-left:1px solid var(--border);
  backdrop-filter:blur(16px);transform:translateX(100%);transition:transform 0.3s ease;
  padding:20px;overflow-y:auto;
}
#event-detail.open{transform:translateX(0)}
#detail-close{
  width:28px;height:28px;border:1px solid var(--border);background:transparent;
  color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;
  justify-content:center;border-radius:2px;transition:all 0.2s;margin-bottom:20px;
}
#detail-close:hover{border-color:var(--gold);color:var(--gold)}
#detail-domain{font-size:9px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:6px}
#detail-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:var(--cream);line-height:1.3;margin-bottom:16px}
#detail-region{font-size:11px;color:var(--muted);margin-bottom:20px;letter-spacing:0.05em}
#detail-severity-wrap{margin-bottom:20px}
#detail-severity-label{font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
#detail-severity-bar{height:3px;background:rgba(184,151,58,0.1);border-radius:2px;overflow:hidden}
#detail-severity-fill{height:100%;border-radius:2px}
#detail-summary{font-size:13px;color:var(--soft);line-height:1.7;margin-bottom:20px}
#detail-source{font-size:10px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;display:flex;justify-content:space-between}

#list-toggle{
  position:fixed;bottom:20px;right:20px;z-index:10;
  padding:10px 18px;background:rgba(13,11,8,0.9);border:1px solid var(--border);
  color:var(--soft);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:400;
  letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;
  backdrop-filter:blur(8px);transition:all 0.2s;
}
#list-toggle:hover{border-color:var(--gold);color:var(--gold)}

#loading{
  position:fixed;inset:0;z-index:20;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
}
#loading-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--gold-l);letter-spacing:0.15em}
#loading-sub{font-size:10px;color:var(--muted);letter-spacing:0.3em;text-transform:uppercase}
#loading-bar{width:160px;height:1px;background:var(--border);margin-top:8px;overflow:hidden}
#loading-progress{height:100%;background:var(--gold);width:0;transition:width 0.4s ease}

.pulse-ring{position:absolute;border-radius:50%;animation:pulse 2.5s ease-out infinite;opacity:0}
@keyframes pulse{0%{transform:scale(0.5);opacity:0.7}100%{transform:scale(2.5);opacity:0}}
</style>
</head>
<body>

<div id="loading">
  <div id="loading-title">АРХИВ</div>
  <div id="loading-sub">Карта рисков · Загрузка</div>
  <div id="loading-bar"><div id="loading-progress"></div></div>
</div>

<svg id="canvas"></svg>

<div id="ui">
  <div id="header">
    <div id="logo">
      <span id="logo-title">АРХИВ · КАРТА РИСКОВ</span>
      <span id="logo-sub">Великое пробуждение</span>
    </div>
    <span id="updated">—</span>
  </div>

  <div id="filters">
    <button class="filter-btn active" data-domain="all">Все</button>
    <button class="filter-btn" data-domain="climate">Климат</button>
    <button class="filter-btn" data-domain="economy">Экономика</button>
    <button class="filter-btn" data-domain="geopolitics">Геополитика</button>
    <button class="filter-btn" data-domain="technology">Технологии</button>
    <button class="filter-btn" data-domain="social">Социум</button>
  </div>

  <div id="spacer"></div>

  <div id="stats-bar">
    <div class="stat"><span class="stat-val" id="stat-events">0</span><span class="stat-label">Событий</span></div>
    <div class="stat"><span class="stat-val" id="stat-critical">0</span><span class="stat-label">Критичных</span></div>
    <div class="stat"><span class="stat-val" id="stat-avg">0</span><span class="stat-label">Ср. индекс</span></div>
  </div>
</div>

<div id="sidebar">
  <button id="sidebar-close">✕</button>
  <div id="event-list"></div>
</div>

<div id="event-detail">
  <button id="detail-close">✕</button>
  <div id="detail-domain"></div>
  <div id="detail-title"></div>
  <div id="detail-region"></div>
  <div id="detail-severity-wrap">
    <div id="detail-severity-label"><span>Индекс угрозы</span><span id="detail-severity-val"></span></div>
    <div id="detail-severity-bar"><div id="detail-severity-fill"></div></div>
  </div>
  <div id="detail-summary"></div>
  <div id="detail-source"><span id="detail-source-name"></span><span id="detail-date"></span></div>
</div>

<button id="list-toggle">Список событий ↗</button>

<script>
const DOMAIN_COLORS = {
  climate:'#1FAACC', economy:'#B8973A',
  geopolitics:'#C84B4B', technology:'#7B5EA7', social:'#4B8C5E'
};
const DOMAIN_LABELS = {
  climate:'Климат', economy:'Экономика',
  geopolitics:'Геополитика', technology:'Технологии', social:'Социум'
};

let allEvents = [], filteredEvents = [], activeFilter = 'all', selectedEvent = null;
let projection, path, svg, g, zoom;

const progress = document.getElementById('loading-progress');
function setProgress(v){ progress.style.width = v + '%' }

async function loadWorld(){
  setProgress(20);
  const r = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  const world = await r.json();
  setProgress(50);
  return world;
}

async function loadEvents(){
  try {
    const r = await fetch('events.json?t=' + Date.now());
    const data = await r.json();
    setProgress(80);
    return data;
  } catch(e) {
    return { events: [], updated: new Date().toISOString() };
  }
}

function domainColor(d){ return DOMAIN_COLORS[d] || '#B8973A' }

function severityColor(s){
  if(s >= 85) return '#C84B4B';
  if(s >= 70) return '#B8973A';
  return '#1FAACC';
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}

function initGlobe(world){
  const W = window.innerWidth, H = window.innerHeight;
  const scale = Math.min(W, H) * 0.42;

  svg = d3.select('#canvas').attr('width', W).attr('height', H);

  projection = d3.geoOrthographic()
    .scale(scale)
    .center([0, 0])
    .rotate([-20, -25])
    .translate([W/2, H/2]);

  path = d3.geoPath().projection(projection);

  zoom = d3.zoom()
    .scaleExtent([0.5, 4])
    .on('zoom', ({transform}) => {
      g.attr('transform', transform);
    });

  g = svg.append('g');

  const sphere = g.append('circle')
    .attr('cx', W/2).attr('cy', H/2).attr('r', projection.scale())
    .attr('fill','#0A0C10').attr('stroke','#1a1814').attr('stroke-width',1);

  const land = topojson.feature(world, world.objects.countries);
  const borders = topojson.mesh(world, world.objects.countries, (a,b) => a !== b);

  g.append('path').datum(land)
    .attr('d', path).attr('fill','#141210').attr('stroke','none');

  g.append('path').datum(borders)
    .attr('d', path).attr('fill','none')
    .attr('stroke','rgba(184,151,58,0.12)').attr('stroke-width',0.4);

  let rotating = true, rotateTimer;
  function startRotation(){
    rotateTimer = d3.timer(elapsed => {
      if(!rotating) return;
      const rot = projection.rotate();
      projection.rotate([rot[0] + 0.08, rot[1]]);
      g.selectAll('path').attr('d', path);
      updateMarkers();
    });
  }

  let dragStart = null;
  svg.call(d3.drag()
    .on('start', (event) => {
      rotating = false;
      if(rotateTimer) rotateTimer.stop();
      dragStart = { x: event.x, y: event.y, rot: [...projection.rotate()] };
    })
    .on('drag', (event) => {
      if(!dragStart) return;
      const dx = event.x - dragStart.x;
      const dy = event.y - dragStart.y;
      const sensitivity = 0.3;
      projection.rotate([
        dragStart.rot[0] + dx * sensitivity,
        dragStart.rot[1] - dy * sensitivity
      ]);
      g.selectAll('path').attr('d', path);
      updateMarkers();
    })
    .on('end', () => {
      dragStart = null;
      setTimeout(() => {
        rotating = true;
        startRotation();
      }, 3000);
    })
  );

  startRotation();

  window.addEventListener('resize', () => {
    const nW = window.innerWidth, nH = window.innerHeight;
    svg.attr('width', nW).attr('height', nH);
    projection.translate([nW/2, nH/2]);
    g.selectAll('path').attr('d', path);
    updateMarkers();
    sphere.attr('cx', nW/2).attr('cy', nH/2);
  });
}

function isVisible(lng, lat){
  const rot = projection.rotate();
  const dlon = lng + rot[0];
  const dlat = lat + rot[1];
  return (dlon > -90 && dlon < 90) || Math.abs(dlat) > 70;
}

function renderMarkers(){
  g.selectAll('.event-marker').remove();
  g.selectAll('.pulse-group').remove();

  filteredEvents.forEach(ev => {
    const [x, y] = projection([ev.lng, ev.lat]) || [null, null];
    if(x === null) return;

    const r = 4 + (ev.severity - 50) * 0.08;
    const col = domainColor(ev.domain);

    const mg = g.append('g').attr('class','event-marker')
      .attr('transform', `translate(${x},${y})`)
      .attr('data-id', ev.id)
      .style('cursor','pointer');

    if(ev.severity >= 80){
      mg.append('circle')
        .attr('r', r + 4).attr('fill', col)
        .attr('opacity', 0.15);
    }

    mg.append('circle')
      .attr('r', r).attr('fill', col)
      .attr('opacity', ev.severity >= 80 ? 0.9 : 0.7)
      .attr('stroke', '#060504').attr('stroke-width', 0.5);

    mg.on('click', () => showEventDetail(ev));
  });
}

function updateMarkers(){
  g.selectAll('.event-marker').each(function(){
    const el = d3.select(this);
    const id = el.attr('data-id');
    const ev = allEvents.find(e => e.id === id);
    if(!ev) return;
    const [x, y] = projection([ev.lng, ev.lat]) || [null, null];
    if(x !== null){
      el.attr('transform', `translate(${x},${y})`).style('display', null);
    }
  });
}

function applyFilter(domain){
  activeFilter = domain;
  filteredEvents = domain === 'all' ? allEvents : allEvents.filter(e => e.domain === domain);
  renderMarkers();
  renderList();
  updateStats();
}

function updateStats(){
  document.getElementById('stat-events').textContent = filteredEvents.length;
  document.getElementById('stat-critical').textContent = filteredEvents.filter(e => e.severity >= 80).length;
  const avg = filteredEvents.length
    ? Math.round(filteredEvents.reduce((s, e) => s + e.severity, 0) / filteredEvents.length)
    : 0;
  document.getElementById('stat-avg').textContent = avg;
}

function renderList(){
  const list = document.getElementById('event-list');
  list.innerHTML = '';
  const sorted = [...filteredEvents].sort((a,b) => b.severity - a.severity);
  sorted.forEach(ev => {
    const col = domainColor(ev.domain);
    const item = document.createElement('div');
    item.className = 'event-item' + (selectedEvent?.id === ev.id ? ' selected' : '');
    item.innerHTML = `
      <div class="event-domain-tag" style="color:${col}">
        <div class="event-domain-dot" style="background:${col}"></div>
        ${DOMAIN_LABELS[ev.domain]}
      </div>
      <div class="event-title">${ev.title}</div>
      <div class="event-meta">
        <span>${ev.region}</span>
        <span>${formatDate(ev.date)}</span>
      </div>
      <div class="severity-bar">
        <div class="severity-fill" style="width:${ev.severity}%;background:${severityColor(ev.severity)}"></div>
      </div>
    `;
    item.onclick = () => showEventDetail(ev);
    list.appendChild(item);
  });
}

function showEventDetail(ev){
  selectedEvent = ev;
  const col = domainColor(ev.domain);

  document.getElementById('detail-domain').innerHTML =
    `<div style="width:5px;height:5px;border-radius:50%;background:${col}"></div>
     <span style="color:${col}">${DOMAIN_LABELS[ev.domain]}</span>`;
  document.getElementById('detail-title').textContent = ev.title;
  document.getElementById('detail-region').textContent = ev.region;
  document.getElementById('detail-severity-val').textContent = ev.severity + ' / 100';
  document.getElementById('detail-severity-fill').style.cssText =
    `width:${ev.severity}%;background:${severityColor(ev.severity)}`;
  document.getElementById('detail-summary').textContent = ev.summary;
  document.getElementById('detail-source-name').textContent = 'Источник: ' + ev.source;
  document.getElementById('detail-date').textContent = formatDate(ev.date);

  document.getElementById('event-detail').classList.add('open');
  document.getElementById('sidebar').classList.remove('open');

  renderList();

  const [x, y] = projection([ev.lng, ev.lat]) || [null, null];
  if(x !== null){
    const rot = projection.rotate();
    const targetLon = -ev.lng;
    const targetLat = -ev.lat * 0.5;
    let curLon = rot[0], curLat = rot[1];
    const steps = 40;
    let i = 0;
    const t = d3.timer(() => {
      i++;
      const ease = 1 - Math.pow(1 - i/steps, 3);
      projection.rotate([
        curLon + (targetLon - curLon) * ease,
        curLat + (targetLat - curLat) * ease
      ]);
      g.selectAll('path').attr('d', path);
      updateMarkers();
      if(i >= steps) t.stop();
    });
  }
}

document.getElementById('detail-close').onclick = () => {
  document.getElementById('event-detail').classList.remove('open');
  selectedEvent = null;
  renderList();
};

document.getElementById('sidebar-close').onclick = () => {
  document.getElementById('sidebar').classList.remove('open');
};

document.getElementById('list-toggle').onclick = () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('event-detail').classList.remove('open');
};

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.domain);
  };
});

async function init(){
  const [world, data] = await Promise.all([loadWorld(), loadEvents()]);
  setProgress(95);

  allEvents = data.events || [];
  filteredEvents = allEvents;

  const upd = document.getElementById('updated');
  if(data.updated){
    const d = new Date(data.updated);
    upd.textContent = 'Обновлено: ' + d.toLocaleDateString('ru-RU', {day:'numeric',month:'long', hour:'2-digit',minute:'2-digit'});
  }

  initGlobe(world);
  renderMarkers();
  renderList();
  updateStats();

  setProgress(100);
  setTimeout(() => {
    document.getElementById('loading').style.opacity = '0';
    document.getElementById('loading').style.transition = 'opacity 0.5s';
    setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
  }, 400);
}

init();
</script>
</body>
</html>
