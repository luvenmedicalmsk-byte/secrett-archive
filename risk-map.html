<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Архив · Карта рисков</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06050A;font-family:'Montserrat',sans-serif;font-weight:300;color:#E8E0D0}
#map-container{position:fixed;inset:0;z-index:1;overflow:hidden;cursor:grab;user-select:none;background:#06050A;touch-action:none}
#map-container.dragging{cursor:grabbing}
#map-svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block;object-fit:cover}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#header{position:absolute;top:14px;left:16px;pointer-events:all}
#logo-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:#D4AF5A;letter-spacing:0.1em}

#updated{position:absolute;top:16px;right:16px;font-size:9px;color:rgba(232,224,208,0.4);letter-spacing:0.08em;pointer-events:all}
#filters{position:absolute;bottom:60px;left:16px;right:60px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:all}
.fb{padding:9px 16px;border:1px solid rgba(184,151,58,0.25);background:rgba(6,5,10,0.88);color:rgba(168,160,144,0.9);font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all 0.2s;backdrop-filter:blur(8px)}
.fb:hover{border-color:#B8973A;color:#D4AF5A}
.fb.active{color:#06050A;font-weight:500}
.fb[data-d="all"].active{background:#B8973A;border-color:#B8973A}
.fb[data-d="climate"].active{background:#27AE60;border-color:#27AE60}
.fb[data-d="economy"].active{background:#2980B9;border-color:#2980B9}
.fb[data-d="geopolitics"].active{background:#D35400;border-color:#D35400}
.fb[data-d="technology"].active{background:#8E44AD;border-color:#8E44AD}
.fb[data-d="social"].active{background:#C0392B;border-color:#C0392B}
#zoom-btns{position:absolute;right:14px;top:45%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;pointer-events:all;z-index:15}
.zb{width:30px;height:30px;background:rgba(6,5,10,0.85);border:1px solid rgba(184,151,58,0.22);color:#D4AF5A;font-size:16px;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:all 0.15s;line-height:1}
.zb:hover{border-color:#B8973A;background:rgba(184,151,58,0.12)}
#stats{position:absolute;bottom:210px;left:16px;display:flex;gap:20px;pointer-events:all;background:rgba(6,5,10,0.0)}
.sv{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;color:#D4AF5A;line-height:1;display:block}
.sl{font-size:7px;color:rgba(106,100,88,0.85);letter-spacing:0.12em;text-transform:uppercase;margin-top:1px;display:block}
#legend{display:none}
.leg{display:flex;align-items:center;gap:3px;font-size:7px;color:rgba(168,160,144,0.6);letter-spacing:0.08em;text-transform:uppercase}
.ld{width:5px;height:5px;border-radius:50%}
#list-btn{position:absolute;bottom:16px;right:16px;padding:6px 12px;background:rgba(6,5,10,0.85);border:1px solid rgba(184,151,58,0.22);color:rgba(168,160,144,0.85);font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.2s;pointer-events:all;backdrop-filter:blur(6px)}
#list-btn:hover{border-color:#B8973A;color:#D4AF5A}
#sidebar{position:fixed;right:0;top:0;bottom:0;width:275px;z-index:20;background:rgba(6,5,10,0.97);border-left:1px solid rgba(184,151,58,0.12);backdrop-filter:blur(20px);transform:translateX(100%);transition:transform 0.28s ease;display:flex;flex-direction:column}
#sidebar.open{transform:translateX(0)}
#sb-x{position:absolute;top:11px;left:11px;width:24px;height:24px;border:1px solid rgba(184,151,58,0.2);background:transparent;color:#6A6458;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:2px;transition:all 0.2s}
#sb-x:hover{border-color:#B8973A;color:#D4AF5A}
#ev-list{flex:1;overflow-y:auto;padding:42px 0 14px}
#ev-list::-webkit-scrollbar{width:2px}
#ev-list::-webkit-scrollbar-thumb{background:rgba(184,151,58,0.15)}
.ei{padding:10px 13px;border-bottom:1px solid rgba(184,151,58,0.06);cursor:pointer;transition:background 0.12s}
.ei:hover{background:rgba(184,151,58,0.04)}
.ei.sel{background:rgba(184,151,58,0.07);border-left:2px solid #B8973A}
.ei-tag{font-size:7px;letter-spacing:0.16em;text-transform:uppercase;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:3px}
.ei-dot{width:3px;height:3px;border-radius:50%}
.ei-title{font-size:11px;color:#E8E0D0;line-height:1.4;margin-bottom:3px}
.ei-meta{font-size:8px;color:#6A6458;display:flex;justify-content:space-between}
.ei-bar{height:1px;background:rgba(184,151,58,0.08);margin-top:5px}
.ei-fill{height:100%}
#detail{position:fixed;right:0;top:0;bottom:0;width:275px;z-index:21;background:rgba(6,5,10,0.98);border-left:1px solid rgba(184,151,58,0.12);backdrop-filter:blur(20px);transform:translateX(100%);transition:transform 0.28s ease;padding:13px;overflow-y:auto}
#detail.open{transform:translateX(0)}
#dt-x{width:24px;height:24px;border:1px solid rgba(184,151,58,0.2);background:transparent;color:#6A6458;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:2px;margin-bottom:13px;transition:all 0.2s}
#dt-x:hover{border-color:#B8973A;color:#D4AF5A}
#dt-domain{font-size:7px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:4px}
#dt-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;color:#E8E0D0;line-height:1.3;margin-bottom:8px}
#dt-region{font-size:9px;color:#6A6458;margin-bottom:11px}
#dt-slabel{font-size:7px;letter-spacing:0.14em;text-transform:uppercase;color:#6A6458;margin-bottom:4px;display:flex;justify-content:space-between}
#dt-sbar{height:2px;background:rgba(184,151,58,0.08);margin-bottom:11px}
#dt-sfill{height:100%}
#dt-summary{font-size:11px;color:#A8A090;line-height:1.7;margin-bottom:11px}
#dt-foot{font-size:8px;color:#6A6458;border-top:1px solid rgba(184,151,58,0.08);padding-top:8px;display:flex;justify-content:space-between}
</style>
</head>

const DC={climate:'#27AE60',economy:'#2980B9',geopolitics:'#D35400',technology:'#8E44AD',social:'#C0392B'};
const DL={climate:'Климат',economy:'Экономика',geopolitics:'Геополитика',technology:'Технологии',social:'Социум'};

let filtered=[...ALL_EVENTS], selected=null, filter='all';

// ── SVG PAN/ZOOM через viewBox ────────────────────────────────────────────────
const mc = document.getElementById('map-container');
const svg = document.getElementById('map-svg');
const VW=1000, VH=500;
let vx=0, vy=0, vw=VW, vh=VH;
const MINW=250, MAXW=2000;

function setVB(){
  svg.setAttribute('viewBox',`${vx} ${vy} ${vw} ${vh}`);
  renderDots();
}

function svgPt(clientX, clientY){
  const r=svg.getBoundingClientRect();
  return {
    x: vx + (clientX-r.left)/r.width * vw,
    y: vy + (clientY-r.top)/r.height * vh
  };
}

// Drag
let dragging=false, drag0={x:0,y:0}, vb0={vx:0,vy:0};
mc.addEventListener('mousedown',e=>{
  dragging=true; mc.classList.add('dragging');
  drag0={x:e.clientX,y:e.clientY}; vb0={vx,vy};
  e.preventDefault();
});
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const r=svg.getBoundingClientRect();
  vx=vb0.vx-(e.clientX-drag0.x)/r.width*vw;
  vy=vb0.vy-(e.clientY-drag0.y)/r.height*vh;
  setVB();
});
window.addEventListener('mouseup',()=>{dragging=false;mc.classList.remove('dragging')});

// Wheel zoom
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY>0?1.18:0.85;
  const pt=svgPt(e.clientX,e.clientY);
  const nw=Math.max(MINW,Math.min(MAXW,vw*f));
  const nh=nw/VW*VH;
  vx=pt.x-(pt.x-vx)/vw*nw;
  vy=pt.y-(pt.y-vy)/vh*nh;
  vw=nw;vh=nh;setVB();
},{passive:false});

// Touch
let touches0=[], vb0t={vx:0,vy:0,vw:0,vh:0};
mc.addEventListener('touchstart',e=>{
  e.preventDefault();
  touches0=Array.from(e.touches).map(t=>{return{x:t.clientX,y:t.clientY}});
  vb0t={vx,vy,vw,vh};
},{passive:false});
mc.addEventListener('touchmove',e=>{
  e.preventDefault();
  const ts=Array.from(e.touches);
  if(ts.length===1&&touches0.length===1){
    const r=svg.getBoundingClientRect();
    vx=vb0t.vx-(ts[0].clientX-touches0[0].x)/r.width*vw;
    vy=vb0t.vy-(ts[0].clientY-touches0[0].y)/r.height*vh;
    setVB();
  } else if(ts.length===2&&touches0.length>=2){
    const d0=Math.hypot(touches0[1].x-touches0[0].x,touches0[1].y-touches0[0].y);
    const d1=Math.hypot(ts[1].clientX-ts[0].clientX,ts[1].clientY-ts[0].clientY);
    if(d0<1)return;
    const f=d0/d1;
    const nw=Math.max(MINW,Math.min(MAXW,vb0t.vw*f));
    const nh=nw/VW*VH;
    const cx0=(touches0[0].x+touches0[1].x)/2;
    const cy0=(touches0[0].y+touches0[1].y)/2;
    const r=svg.getBoundingClientRect();
    const ptx=vb0t.vx+(cx0-r.left)/r.width*vb0t.vw;
    const pty=vb0t.vy+(cy0-r.top)/r.height*vb0t.vh;
    const cx1=(ts[0].clientX+ts[1].clientX)/2;
    const cy1=(ts[0].clientY+ts[1].clientY)/2;
    vx=ptx-(cx1-r.left)/r.width*nw;
    vy=pty-(cy1-r.top)/r.height*nh;
    vw=nw;vh=nh;setVB();
  }
},{passive:false});
mc.addEventListener('touchend',e=>{
  touches0=Array.from(e.touches).map(t=>{return{x:t.clientX,y:t.clientY}});
  vb0t={vx,vy,vw,vh};
});

// Кнопки
document.getElementById('z-in').onclick=()=>{
  const nw=Math.max(MINW,vw*0.7); const nh=nw/VW*VH;
  vx+=(vw-nw)*0.5; vy+=(vh-nh)*0.5; vw=nw;vh=nh;setVB();
};
document.getElementById('z-out').onclick=()=>{
  const nw=Math.min(MAXW,vw*1.4); const nh=nw/VW*VH;
  vx+=(vw-nw)*0.5; vy+=(vh-nh)*0.5; vw=nw;vh=nh;setVB();
};
document.getElementById('z-reset').onclick=()=>{vx=0;vy=0;vw=VW;vh=VH;setVB()};

// ── ТОЧКИ НА SVG (не HTML) ───────────────────────────────────────────────────
function renderDots(){
  const existing=svg.querySelectorAll('.ev-dot-g');
  existing.forEach(e=>e.remove());
  
  const NS='http://www.w3.org/2000/svg';
  
  filtered.forEach(ev=>{
    const col=DC[ev.domain];
    const r=3+(ev.severity-50)*0.08;
    const isSel=selected?.id===ev.id;
    
    const g=document.createElementNS(NS,'g');
    g.setAttribute('class','ev-dot-g');
    g.setAttribute('style','cursor:pointer'); 
    g.setAttribute('transform',`translate(${ev.svgX},${ev.svgY})`);
    
    if(ev.severity>=80){
      const pulse=document.createElementNS(NS,'circle');
      pulse.setAttribute('r',r+4);
      pulse.setAttribute('fill',col);
      pulse.setAttribute('opacity','0.2');
      pulse.innerHTML=`<animate attributeName="r" values="${r+2};${r+8};${r+2}" dur="2.5s" repeatCount="indefinite"/>
<animate attributeName="opacity" values="0.3;0;0.3" dur="2.5s" repeatCount="indefinite"/>`;
      g.appendChild(pulse);
    }
    
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('r',r);
    c.setAttribute('fill',col);
    c.setAttribute('opacity',ev.severity>=80?'0.95':'0.8');
    if(isSel){
      c.setAttribute('stroke','#D4AF5A');
      c.setAttribute('stroke-width','1.5');
    }
    g.appendChild(c);
    
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      showDetail(ev);
    });
    g.addEventListener('touchend', (e) => {
      e.stopPropagation();
      e.preventDefault();
      showDetail(ev);
    }, {passive: false});
    svg.appendChild(g);
  });
}

function sc(s){return s>=85?'#C0392B':s>=70?'#D35400':'#2980B9'}
function fd(iso){return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}

function updateStats(){
  document.getElementById('s-t').textContent=filtered.length;
  document.getElementById('s-c').textContent=filtered.filter(e=>e.severity>=80).length;
  const avg=filtered.length?Math.round(filtered.reduce((s,e)=>s+e.severity,0)/filtered.length):0;
  document.getElementById('s-a').textContent=avg;
}

function renderList(){
  const list=document.getElementById('ev-list');
  list.innerHTML='';
  [...filtered].sort((a,b)=>b.severity-a.severity).forEach(ev=>{
    const col=DC[ev.domain];
    const d=document.createElement('div');
    d.className='ei'+(selected?.id===ev.id?' sel':'');
    d.innerHTML=`<div class="ei-tag" style="color:${col}"><div class="ei-dot" style="background:${col}"></div>${DL[ev.domain]}</div><div class="ei-title">${ev.title}</div><div class="ei-meta"><span>${ev.region}</span><span>${fd(ev.date)}</span></div><div class="ei-bar"><div class="ei-fill" style="width:${ev.severity}%;background:${sc(ev.severity)}"></div></div>`;
    d.onclick=()=>showDetail(ev);
    list.appendChild(d);
  });
}

function showDetail(ev){
  selected=ev;
  const col=DC[ev.domain];
  document.getElementById('dt-domain').innerHTML=`<div style="width:4px;height:4px;border-radius:50%;background:${col}"></div><span style="color:${col}">${DL[ev.domain]}</span>`;
  document.getElementById('dt-title').textContent=ev.title;
  document.getElementById('dt-region').textContent=ev.region;
  document.getElementById('dt-sv').textContent=ev.severity+' / 100';
  document.getElementById('dt-sfill').style.cssText=`width:${ev.severity}%;background:${sc(ev.severity)}`;
  document.getElementById('dt-summary').textContent=ev.summary;
  document.getElementById('dt-src').textContent='Источник: '+ev.source;
  document.getElementById('dt-dt').textContent=fd(ev.date);
  document.getElementById('detail').classList.add('open');
  document.getElementById('sidebar').classList.remove('open');
  renderDots();renderList();
}

document.getElementById('dt-x').onclick=()=>{document.getElementById('detail').classList.remove('open');selected=null;renderDots();renderList()};
document.getElementById('sb-x').onclick=()=>document.getElementById('sidebar').classList.remove('open');
document.getElementById('list-btn').onclick=()=>{document.getElementById('sidebar').classList.toggle('open');document.getElementById('detail').classList.remove('open')};

document.querySelectorAll('.fb').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter=btn.dataset.d;
    filtered=filter==='all'?[...ALL_EVENTS]:ALL_EVENTS.filter(e=>e.domain===filter);
    updateStats();renderList();renderDots();
  };
});

async function tryLoadFresh(){
  try{
    const url='events.json?nocache='+Date.now();
    const r=await fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!r.ok){console.warn('events.json:',r.status);return;}
    const data=await r.json();
    if(data.events&&data.events.length>0){
      const evs=data.events.map(ev=>{
        if(ev.svgX&&ev.svgY) return ev;
        const r2=Math.PI/180;
        const lat=Math.max(-82,Math.min(82,ev.lat));
        const y=Math.log(Math.tan(Math.PI/4+(lat*r2)/2));
        const ymax=Math.log(Math.tan(Math.PI/4+(82*r2)/2));
        return {...ev,
          svgX:Math.round(((ev.lng+180)/360)*1000*10)/10,
          svgY:Math.round((1-(y/ymax))/2*500*10)/10
        };
      });
      ALL=evs;
      filtered=filter==='all'?[...ALL]:ALL.filter(e=>e.domain===filter);
      updateStats();renderList();renderDots();
      if(data.updated){
        const d=new Date(data.updated);
        document.getElementById('updated').textContent='Обновлено: '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      }
    }
  }catch(e){console.warn('events.json error:',e);}
}

updateStats();renderList();

// Подстраиваем viewBox под экран телефона
function fitMapToScreen() {
  const mapH = window.innerHeight - 240; // высота карты (экран минус панель снизу)
  const mapW = window.innerWidth;
  const aspect = 1000 / 500; // соотношение сторон карты
  
  let newVW, newVH, newVX, newVY;
  
  if (mapW / mapH < aspect) {
    // Экран уже чем карта — подгоняем по ширине
    newVW = 1000;
    newVH = Math.round(mapH / mapW * 1000);
    newVX = 0;
    newVY = Math.round((500 - newVH) / 2);
  } else {
    // Экран шире — подгоняем по высоте  
    newVH = 500;
    newVW = Math.round(mapW / mapH * 500);
    newVX = Math.round((1000 - newVW) / 2);
    newVY = 0;
  }
  
  vx = newVX; vy = newVY; vw = newVW; vh = newVH;
  svg.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  renderDots();
}

// Карта занимает только верхнюю часть экрана
document.getElementById('map-container').style.bottom = '250px';
fitMapToScreen();
window.addEventListener('resize', fitMapToScreen);

tryLoadFresh();
</script>
