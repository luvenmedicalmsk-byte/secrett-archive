<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Архив · Карта рисков</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06050A;font-family:'Montserrat',sans-serif;font-weight:300;color:#E8E0D0}

/* Убираем стандартное Leaflet-кредо и аттрибуцию */
.leaflet-control-attribution{display:none!important}
.leaflet-control-zoom{display:none!important}

#map{position:fixed;inset:0;z-index:1;background:#06050A}

/* Стиль тайлов — переопределяем через фильтр */
.leaflet-tile-pane{}

#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
#header{position:absolute;top:14px;left:16px;pointer-events:all}
#logo-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:#D4AF5A;letter-spacing:0.1em}
#live-status{margin-top:6px;display:flex;align-items:center;gap:8px}
#live-status-icon{font-size:13px;line-height:1}
#live-status-text{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:400;color:#E8E0D0;letter-spacing:0.06em}
#updated{position:fixed;top:16px;right:16px;font-size:9px;color:rgba(232,224,208,0.85);letter-spacing:0.08em;pointer-events:all}

#filters{position:absolute;bottom:110px;left:16px;right:60px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:all}
#layers{position:absolute;bottom:60px;left:16px;right:60px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:all}
.lb{padding:7px 12px;border:1px solid rgba(184,151,58,0.2);background:rgba(6,5,10,0.88);color:rgba(168,160,144,0.75);font-family:'Montserrat',sans-serif;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all .2s}
.lb:hover{border-color:rgba(184,151,58,0.5);color:rgba(232,224,208,0.9)}
.lb.active{border-color:#B8973A;color:#D4AF5A;background:rgba(184,151,58,0.1)}
.lb.loading{opacity:0.6}
.fb{padding:9px 16px;border:1px solid rgba(184,151,58,0.25);background:rgba(6,5,10,0.88);color:rgba(168,160,144,0.9);font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all 0.2s;backdrop-filter:blur(8px)}
.fb:hover{border-color:#B8973A;color:#D4AF5A}
.fb.active{color:#06050A;font-weight:500}
.fb[data-d="all"].active{background:#B8973A;border-color:#B8973A}
.fb[data-d="climate"].active{background:#27AE60;border-color:#27AE60}
.fb[data-d="economy"].active{background:#2980B9;border-color:#2980B9}
.fb[data-d="geopolitics"].active{background:#D35400;border-color:#D35400}
.fb[data-d="technology"].active{background:#8E44AD;border-color:#8E44AD}
.fb[data-d="social"].active{background:#C0392B;border-color:#C0392B}

#zoom-btns{position:absolute;right:14px;top:45%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;pointer-events:all;z-index:15}
.zb{width:30px;height:30px;background:rgba(6,5,10,0.85);border:1px solid rgba(184,151,58,0.22);color:#D4AF5A;font-size:16px;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:all 0.15s;line-height:1}
.zb:hover{border-color:#B8973A;background:rgba(184,151,58,0.12)}

#stats{position:absolute;top:64px;left:16px;display:flex;gap:16px;pointer-events:all}
.sv{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;color:#D4AF5A;line-height:1;display:block}
.sl{font-size:7px;color:rgba(232,224,208,0.85);letter-spacing:0.12em;text-transform:uppercase;margin-top:1px;display:block}

#list-btn{position:absolute;bottom:16px;right:16px;padding:6px 12px;background:rgba(6,5,10,0.85);border:1px solid rgba(184,151,58,0.22);color:rgba(168,160,144,0.85);font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.2s;pointer-events:all;backdrop-filter:blur(6px)}
#list-btn:hover{border-color:#B8973A;color:#D4AF5A}

#sidebar{position:fixed;right:0;top:0;bottom:0;width:275px;z-index:20;background:rgba(6,5,10,0.97);border-left:1px solid rgba(184,151,58,0.12);backdrop-filter:blur(20px);transform:translateX(100%);transition:transform 0.28s ease;display:flex;flex-direction:column}
#sidebar.open{transform:translateX(0)}
#sb-x{position:absolute;top:11px;left:11px;width:24px;height:24px;border:1px solid rgba(184,151,58,0.2);background:transparent;color:#6A6458;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:2px;transition:all 0.2s}
#sb-x:hover{border-color:#B8973A;color:#D4AF5A}
#ev-list{flex:1;overflow-y:auto;padding:42px 0 14px}
#ev-list::-webkit-scrollbar{width:2px}
#ev-list::-webkit-scrollbar-thumb{background:rgba(184,151,58,0.15)}
.ei{padding:10px 13px;border-bottom:1px solid rgba(184,151,58,0.06);cursor:pointer;transition:background 0.12s}
.ei:hover{background:rgba(184,151,58,0.04)}
.ei.sel{background:rgba(184,151,58,0.07);border-left:2px solid #B8973A}
.ei-tag{font-size:7px;letter-spacing:0.16em;text-transform:uppercase;font-weight:500;margin-bottom:3px;display:flex;align-items:center;gap:3px}
.ei-dot{width:3px;height:3px;border-radius:50%}
.ei-title{font-size:11px;color:#E8E0D0;line-height:1.4;margin-bottom:3px}
.ei-meta{font-size:8px;color:#6A6458;display:flex;justify-content:space-between}
.ei-bar{height:1px;background:rgba(184,151,58,0.08);margin-top:5px}
.ei-fill{height:100%}

#detail{position:fixed;right:0;top:0;bottom:0;width:275px;z-index:21;background:rgba(6,5,10,0.98);border-left:1px solid rgba(184,151,58,0.12);backdrop-filter:blur(20px);transform:translateX(100%);transition:transform 0.28s ease;padding:13px;overflow-y:auto}
#detail.open{transform:translateX(0)}
#dt-x{width:24px;height:24px;border:1px solid rgba(184,151,58,0.2);background:transparent;color:#6A6458;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;border-radius:2px;margin-bottom:13px;transition:all 0.2s}
#dt-x:hover{border-color:#B8973A;color:#D4AF5A}
#dt-domain{font-size:7px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:4px}
#dt-title{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:300;color:#E8E0D0;line-height:1.3;margin-bottom:8px}
#dt-region{font-size:9px;color:#6A6458;margin-bottom:11px}
#dt-slabel{font-size:7px;letter-spacing:0.14em;text-transform:uppercase;color:#6A6458;margin-bottom:4px;display:flex;justify-content:space-between}
#dt-sbar{height:2px;background:rgba(184,151,58,0.08);margin-bottom:11px}
#dt-sfill{height:100%}
#dt-summary{font-size:11px;color:#A8A090;line-height:1.7;margin-bottom:11px}
#dt-foot{font-size:8px;color:#6A6458;border-top:1px solid rgba(184,151,58,0.08);padding-top:8px;display:flex;justify-content:space-between}
#dt-ai{margin-top:10px;padding:10px 12px;border:1px solid rgba(184,151,58,0.15);border-radius:2px;background:rgba(184,151,58,0.04);display:none}
#dt-ai.visible{display:block}
#dt-ai-label{font-size:7px;letter-spacing:0.18em;text-transform:uppercase;color:#B8973A;margin-bottom:6px;display:flex;align-items:center;gap:5px}
#dt-ai-score{font-family:'Cormorant Garamond',serif;font-size:22px;color:#D4AF5A;line-height:1}
#dt-ai-delta{font-size:9px;margin-left:6px;vertical-align:middle}
#dt-ai-reasoning{font-size:10px;color:#A8A090;line-height:1.6;margin-top:6px}
#dt-ai-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ai-tag{font-size:7px;letter-spacing:0.1em;text-transform:uppercase;padding:2px 6px;border:1px solid rgba(184,151,58,0.2);border-radius:2px;color:#6A6458}
.ai-tag.cascade{border-color:rgba(211,84,0,0.3);color:#D35400}

/* Кастомные маркеры Leaflet */
.risk-marker{border-radius:50%;border:none;box-shadow:none}
.risk-pulse{border-radius:50%;animation:pulse-ring 2.5s infinite}
@keyframes pulse-ring{
  0%{transform:scale(1);opacity:0.4}
  60%{transform:scale(2.2);opacity:0}
  100%{transform:scale(2.2);opacity:0}
}

/* Leaflet popup стиль */
.leaflet-popup-content-wrapper{background:rgba(6,5,10,0.95);border:1px solid rgba(184,151,58,0.2);border-radius:2px;color:#E8E0D0;font-family:'Montserrat',sans-serif;font-size:11px;padding:0;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.leaflet-popup-content{margin:10px 14px;line-height:1.5}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-close-button{color:#6A6458!important;font-size:14px!important;right:8px!important;top:6px!important}
.leaflet-popup-close-button:hover{color:#D4AF5A!important}

#ai-panel{position:fixed;left:16px;bottom:120px;width:220px;z-index:15;pointer-events:all;display:none}
#ai-panel.visible{display:block}
#ai-panel-header{font-size:7px;letter-spacing:0.18em;text-transform:uppercase;color:#B8973A;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
#ai-panel-close{cursor:pointer;color:#6A6458;font-size:10px;padding:2px 4px}
#ai-panel-close:hover{color:#D4AF5A}
.ai-domain-row{padding:6px 10px;background:rgba(6,5,10,0.88);border:1px solid rgba(184,151,58,0.12);margin-bottom:3px;backdrop-filter:blur(8px);border-radius:2px;cursor:pointer;transition:border-color 0.15s}
.ai-domain-row:hover{border-color:rgba(184,151,58,0.35)}
.ai-domain-name{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#E8E0D0;display:flex;justify-content:space-between;align-items:center}
.ai-domain-note{font-size:8px;color:#6A6458;margin-top:2px;line-height:1.4}
.ai-trend-up{color:#C0392B}
.ai-trend-down{color:#27AE60}
.ai-trend-flat{color:#6A6458}
.ai-risk-critical{color:#C0392B}
.ai-risk-high{color:#D35400}
.ai-risk-med{color:#2980B9}
#risks-btn{position:fixed;bottom:16px;left:50%;text-decoration:none;display:inline-block;transform:translateX(-50%);padding:6px 12px;background:rgba(6,5,10,0.85);border:1px solid rgba(184,151,58,0.22);color:rgba(168,160,144,0.85);font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.2s;pointer-events:all;backdrop-filter:blur(6px);z-index:20}
#risks-btn:hover{border-color:#B8973A;color:#D4AF5A}
#risks-btn.active{border-color:#B8973A;color:#D4AF5A;background:rgba(184,151,58,0.12)}
#risks-submenu{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);display:none;gap:2px;pointer-events:all;z-index:25;flex-direction:row;white-space:nowrap}
#risks-submenu.open{display:flex}
#risks-submenu button{padding:6px 10px;background:rgba(6,5,10,0.92);border:1px solid rgba(184,151,58,0.22);color:rgba(168,160,144,0.85);font-family:'Montserrat',sans-serif;font-size:7px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(8px);white-space:nowrap}
#risks-submenu button:first-child{border-radius:2px 0 0 2px}
#risks-submenu button:last-child{border-radius:0 2px 2px 0}
#risks-submenu button:hover{border-color:#B8973A;color:#D4AF5A}
#risks-submenu button.active{border-color:#B8973A;color:#D4AF5A;background:rgba(184,151,58,0.15)}
#ai-score-btn{position:fixed;bottom:16px;left:16px;padding:6px 12px;background:rgba(6,5,10,0.85);border:1px solid rgba(184,151,58,0.22);color:rgba(168,160,144,0.85);font-family:'Montserrat',sans-serif;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.2s;pointer-events:all;backdrop-filter:blur(6px)}
#ai-score-btn:hover{border-color:#B8973A;color:#D4AF5A}
#ai-score-btn.loading{opacity:0.5;pointer-events:none}

#location-panel{position:fixed;left:0;right:0;bottom:0;max-height:55vh;z-index:22;background:rgba(6,5,10,0.97);border-top:1px solid rgba(184,151,58,0.2);backdrop-filter:blur(20px);transform:translateY(100%);transition:transform 0.3s ease;overflow-y:auto;padding:16px}
#location-panel.open{transform:translateY(0)}
#loc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
#loc-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:300;color:#E8E0D0}
#loc-close{width:24px;height:24px;border:1px solid rgba(184,151,58,0.2);background:transparent;color:#6A6458;cursor:pointer;font-size:11px;border-radius:2px;flex-shrink:0}
#loc-close:hover{border-color:#B8973A;color:#D4AF5A}
#loc-risk-row{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
#loc-score{font-family:'Cormorant Garamond',serif;font-size:36px;color:#D4AF5A;line-height:1}
#loc-level{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
#loc-summary{font-size:11px;color:#A8A090;line-height:1.7;margin-bottom:12px}
#loc-risks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.loc-risk-tag{font-size:9px;padding:4px 9px;border-radius:2px;border:1px solid rgba(184,151,58,0.15);color:#A8A090}
#loc-outlook{font-size:10px;color:#6A6458;border-top:1px solid rgba(184,151,58,0.08);padding-top:10px;line-height:1.6}
#loc-signals{margin-top:8px}
#loc-signals-label{font-size:7px;letter-spacing:0.16em;text-transform:uppercase;color:#B8973A;margin-bottom:5px}
.loc-signal{font-size:9px;color:#6A6458;padding:2px 0;display:flex;gap:5px}
#loc-loading{text-align:center;padding:20px;font-size:11px;color:#6A6458;letter-spacing:0.1em}
</style>
</head>
<body>

<div id="map"></div>

<div id="ui">
  <div id="header">
    <div id="logo-title">АРХИВ · КАРТА СИГНАЛОВ</div>
    <div id="live-status">
      <span id="live-status-icon">⬛️</span>
      <span id="live-status-text">Соединение прервано</span>
    </div>
  </div>
  <div id="updated">26 мая 2026</div>
  <div id="stats">
    <div><span class="sv" id="s-t">0</span><span class="sl">Событий</span></div>
    <div><span class="sv" id="s-c">0</span><span class="sl">Критичных</span></div>
    <div><span class="sv" id="s-a">0</span><span class="sl">Ср. индекс</span></div>
  </div>
  <div id="layers">
  <button class="lb" id="lb-planes">✈ Самолёты</button>
  <button class="lb" id="lb-ships">🚢 Суда</button>
  <button class="lb" id="lb-outages">📡 Отключения</button>
</div>
<div id="filters">
    <button class="fb active" data-d="all">Все</button>
    <button class="fb" data-d="climate">Климат</button>
    <button class="fb" data-d="economy">Экономика</button>
    <button class="fb" data-d="geopolitics">Геополитика</button>
    <button class="fb" data-d="technology">Технологии</button>
    <button class="fb" data-d="social">Социум</button>
  </div>
  <div id="zoom-btns">
    <button class="zb" id="z-in">+</button>
    <button class="zb" id="z-out">−</button>
    <button class="zb" id="z-reset" style="font-size:11px;letter-spacing:0">⌂</button>
  </div>

  <button id="list-btn">◆ Список событий</button>
  <div id="ai-panel">
    <div id="ai-panel-header">
      <span>◆ AI · Анализ доменов</span>
      <span id="ai-panel-close">✕</span>
    </div>
    <div id="ai-domain-rows"></div>
  </div>
  <a id="risks-btn" href="risk-matrix.html">◆ Риски</a>

<button id="ai-score-btn">◆ Анализ доменов</button>
</div>

<div id="sidebar"><button id="sb-x">✕</button><div id="ev-list"></div></div>
<div id="detail">
  <button id="dt-x">✕</button>
  <div id="dt-domain"></div>
  <div id="dt-title"></div>
  <div id="dt-region"></div>
  <div id="dt-slabel"><span>Индекс риска</span><span id="dt-sv"></span></div>
  <div id="dt-sbar"><div id="dt-sfill"></div></div>
  <div id="dt-summary"></div>
  <div id="dt-ai">
    <div id="dt-ai-label">◆ Анализ доменов</div>
    <div><span id="dt-ai-score"></span><span id="dt-ai-delta"></span></div>
    <div id="dt-ai-reasoning"></div>
    <div id="dt-ai-tags"></div>
  </div>
  <div id="dt-foot"><span id="dt-src"></span><span id="dt-dt"></span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DC={climate:'#27AE60',economy:'#2980B9',geopolitics:'#D35400',technology:'#8E44AD',social:'#C0392B'};
const DL={climate:'Климат',economy:'Экономика',geopolitics:'Геополитика',technology:'Технологии',social:'Социум'};

// ── PIPELINE CONSTANTS ───────────────────────────────────────────────────────
const MAX_EVENTS       = 600;          // FIX1: hard cap on ALL_EVENTS array
const MAX_EVENT_AGE_DAYS = 30;         // FIX5: discard events older than 30 days
const MAX_EVENT_AGE_MS = MAX_EVENT_AGE_DAYS * 86400000;

// ── LIGHTWEIGHT DIAGNOSTICS (FIX8+9) ────────────────────────────────────────
// Stores last N log entries; visible via window.__INTEL_LOG in browser console
const _diagLog = [];
const _diagStart = Date.now();
function _log(module, msg) {
  const entry = {
    t: ((Date.now() - _diagStart) / 1000).toFixed(1) + 's',
    m: module,
    msg
  };
  _diagLog.push(entry);
  if (_diagLog.length > 200) _diagLog.shift();
  // Use warn for anything that looks like an error
  const fn = /error|fail|miss|invalid|reject/i.test(msg) ? console.error : console.debug;
  fn(`[${module.toUpperCase()}] ${msg}`);
}
window.__INTEL_LOG = _diagLog;  // expose for debugging: window.__INTEL_LOG in DevTools
window.__INTEL_DIAG = () => {
  const now = Date.now();
  console.table({
    'Events total':    ALL_EVENTS.length,
    'Events filtered': typeof filtered !== 'undefined' ? filtered.length : '?',
    'SSE state':       sseSource ? ['CONNECTING','OPEN','CLOSED'][sseSource.readyState] : 'null',
    'SSE retries':     sseRetries,
    'ExtFeed seen':    _extSeenIds.size,
    'Uptime (s)':      ((now - _diagStart) / 1000).toFixed(0),
  });
  console.log('Last 20 log entries:', _diagLog.slice(-20));
};
console.info('[INTEL] Pipeline diagnostics ready. Run window.__INTEL_DIAG() for status.');

// ── ИНИЦИАЛИЗАЦИЯ КАРТЫ ──────────────────────────────────────────────────────
const map = L.map('map', {
  center: [20, 10],
  zoom: 2,
  zoomControl: false,
  attributionControl: false,
  minZoom: 2,
  maxZoom: 10,
  worldCopyJump: false,
  maxBounds: [[-85, -180], [85, 180]],
  maxBoundsViscosity: 0.8,
  preferCanvas: true,   // FIX3: Canvas renderer — 3-5× faster at 500+ markers
  renderer: L.canvas({ padding: 0.5 })
});

// Тайлы CartoDB Dark — нейтральный тёмный фон
// Базовый тёмный фон без надписей
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Надписи поверх — светлые, читаемые, рисуются ПОСЛЕ маркеров не нужно pane
// Используем pane чтобы лейблы были поверх маркеров-событий
map.createPane('labels');
map.getPane('labels').style.zIndex = 650;
map.getPane('labels').style.pointerEvents = 'none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd',
  maxZoom: 19,
  pane: 'labels'
}).addTo(map);

// ── ЦВЕТОВЫЕ СЛОИ ПО ДОМЕНАМ ─────────────────────────────────────────────────
// Тонкие полигоны стран — загружаем lightweight GeoJSON
let geoLayer = null;

async function loadCountriesGeo() {
  try {
    const r = await fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson');

    const geo = await r.json();
    geoLayer = L.geoJSON(geo, {
      style: {
        fillColor: 'transparent',
        fillOpacity: 0,
        color: 'rgba(184,151,58,0.18)',
        weight: 0.5

      onEachFeature: (feature, layer) => {
        layer.on('mouseover', function() {

    }).addTo(map);
  } catch(e) {
    console.warn('GeoJSON countries не загружен:', e);

}

// ── РЕНДЕР МАРКЕРОВ ──────────────────────────────────────────────────────────
function createMarkerIcon(color, severity) {
  const r = Math.round(4 + (severity - 50) * 0.09);
  const pulse = severity >= 80;
  const html = pulse
    ? `<div style="position:relative;width:${r*2+12}px;height:${r*2+12}px">
        <div class="risk-pulse" style="position:absolute;top:0;left:0;width:${r*2+12}px;height:${r*2+12}px;background:${color};opacity:0.25;border-radius:50%"></div>
        <div style="position:absolute;top:6px;left:6px;width:${r*2}px;height:${r*2}px;background:${color};border-radius:50%;opacity:0.92;box-shadow:0 0 8px ${color}66"></div>
       </div>`
    : `<div style="width:${r*2}px;height:${r*2}px;background:${color};border-radius:50%;opacity:0.85;box-shadow:0 0 6px ${color}44"></div>`;

  return L.divIcon({
    html,
    className: '',
    iconSize: pulse ? [r*2+12, r*2+12] : [r*2, r*2],
    iconAnchor: pulse ? [r+6, r+6] : [r, r]
  });
}

// FIX2: batch addLayers (single DOM operation vs N individual addLayer calls)
// FIX5: skip events older than MAX_EVENT_AGE_DAYS to prevent stale accumulation
let _lastRenderedCount = -1;  // skip redundant redraws
function renderMarkers() {
  const now = Date.now();
  const cutoff = now - MAX_EVENT_AGE_MS;
  const fresh = filtered.filter(ev => {
    if (!ev.lat || !ev.lng || isNaN(ev.lat) || isNaN(ev.lng)) return false;
    if (!ev.date) return true;  // no date = keep
    const age = new Date(ev.date).getTime();
    return isNaN(age) || age >= cutoff;
  });

  // Skip full rebuild if nothing changed
  if (fresh.length === _lastRenderedCount &&
      fresh.length === markersLayer.getLayers().length) return;
  _lastRenderedCount = fresh.length;

  markersLayer.clearLayers();
  const markers = fresh.map(ev => {
    const col = DC[ev.domain] || '#B8973A';
    const icon = createMarkerIcon(col, ev.severity);
    const m = L.marker([ev.lat, ev.lng], { icon });
    m.on('click', () => showDetail(ev));
    return m;
  });
  if (markers.length) markersLayer.addLayers(markers);  // single batch op
  _log('render', `${markers.length} markers (${filtered.length - markers.length} filtered stale/invalid)`);
}

function sc(s){ return s>=85?'#C0392B':s>=70?'#D35400':'#2980B9' }
function fd(iso){ return new Date(iso).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) }

function updateStats() {
  document.getElementById('s-t').textContent = filtered.length;
  document.getElementById('s-c').textContent = filtered.filter(e=>e.severity>=80).length;
  const avg = filtered.length ? Math.round(filtered.reduce((s,e)=>s+e.severity,0)/filtered.length) : 0;

}

function renderList() {

  list.innerHTML = '';

// Приоритет: Worker API → events.json → fallback
const API_BASE = 'https://archive-api.luven-medical-msk.workers.dev';


function formatMSK(isoStr) {
  const dt = new Date(isoStr);
  const mskDate = new Date(dt.getTime() + (3 * 60 + dt.getTimezoneOffset()) * 60000);
  const dateStr = mskDate.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  const timeStr = mskDate.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  return dateStr + ' · ' + timeStr + ' (GMT+3)';
}
async function tryLoadFresh() {
  // 1. Пробуем Worker API
  try {
    const r = await fetch(API_BASE + '/api/events?limit=200&sort=date&order=desc', {
      signal: AbortSignal.timeout(6000)
    });
    if (r.ok) {
      const data = await r.json();
      if (data.events && data.events.length > 0) {
        applyEvents(data.events, data.meta?.updated);
        console.info('[API] Worker API: ' + data.events.length + ' событий');
        return;
      }
    }
  } catch(e) {
    console.warn('[API] Worker недоступен, fallback на events.json:', e.message);
  }

  // 2. Прямой events.json (несколько попыток)
  for (const url of [
    'events.json?v=' + Date.now(),
    'https://raw.githubusercontent.com/luvenmedicalmsk-byte/secrett-archive/main/events.json'
  ]) {
    try {
      const r = await fetch(url, {
        cache: 'no-store',
        headers: {'Cache-Control': 'no-cache'},
        signal: AbortSignal.timeout(8000)
      });
      if (!r.ok) continue;
      const data = await r.json();
      if (data.events && data.events.length > 0) {
        applyEvents(data.events, data.updated);
        console.info('[API] Загружено из:', url, '— событий:', data.events.length);
        return;
      }
    } catch(e) {
      console.warn('[API] Ошибка:', url, e.message);
    }
  }

  loadFallback();
}

async function fetchStats() {
  try {
    const r = await fetch(API_BASE + '/api/stats', { signal: AbortSignal.timeout(3000) });
    if (!r.ok) return;
    const s = await r.json();
    // Обновляем статистику из API (точнее чем из событий)
    document.getElementById('s-t').textContent = s.total;
    document.getElementById('s-c').textContent = s.critical;
    document.getElementById('s-a').textContent = s.avg_severity;
  } catch(_) {}
}

function applyEvents(events, updatedIso) {
  ALL_EVENTS = events;
  filtered = filter === 'all' ? [...ALL_EVENTS] : ALL_EVENTS.filter(e => e.domain === filter);
  updateStats(); renderList(); renderMarkers();
  if (updatedIso) {
    const d = new Date(updatedIso);
    document.getElementById('updated').textContent = formatMSK(updatedIso);
  }
}

function loadFallback() {
  ALL_EVENTS = FALLBACK;
  filtered = [...ALL_EVENTS];
  updateStats(); renderList(); renderMarkers();
}

tryLoadFresh().then(() => { fetchStats(); startSSE(); });

map.on('click', async (e) => {
  const { lat, lng } = e.latlng;
  let locationName = '';
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=ru&zoom=3`,
      { headers: { 'User-Agent': 'ArchiveRiskMap/1.0' }, signal: AbortSignal.timeout(5000) }
    );
    if (r.ok) {
      const geo = await r.json();
      const a = geo.address || {};
      // Берём страну в первую очередь
      locationName = a.country || a.state || a.city || a.county || '';
      if (!locationName && geo.display_name) {
        // Берём последний значимый элемент display_name (обычно страна)
        const parts = geo.display_name.split(',').map(s => s.trim());
        locationName = parts[parts.length - 1] || parts[0] || '';
      }
    }
  } catch(_) {}

  if (!locationName) {
    locationName = `${lat.toFixed(1)}°, ${lng.toFixed(1)}°`;
  }

  openLocationPanel(locationName, lat, lng);
});

async function openLocationPanel(name, lat, lng) {
  const panel = document.getElementById('location-panel');
  const loading = document.getElementById('loc-loading');

  // Показываем панель с лоадером
  document.getElementById('loc-name').textContent = name;
  document.getElementById('loc-score').textContent = '';
  document.getElementById('loc-level').textContent = '';
  document.getElementById('loc-summary').textContent = '';
  document.getElementById('loc-risks').innerHTML = '';
  document.getElementById('loc-outlook').textContent = '';
  document.getElementById('loc-signals-list').innerHTML = '';
  loading.style.display = 'block';
  panel.classList.add('open');

  try {
    const params = new URLSearchParams({ name, lat, lng });
    const r = await fetch(API_BASE + '/api/location?' + params, {
      signal: AbortSignal.timeout(20000)
    });

    if (r.status === 429) {
      loading.style.display = 'none';
      document.getElementById('loc-summary').textContent = '⏳ Лимит запросов исчерпан. Подождите минуту и попробуйте снова.';
      document.getElementById('loc-summary').style.color = '#D4AF5A';
      // Автоматически убираем сообщение через 60 секунд
      setTimeout(() => {
        document.getElementById('loc-summary').textContent = '';
        document.getElementById('loc-summary').style.color = '';
      }, 60000);
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    loading.style.display = 'none';
    renderLocationPanel(d);

  } catch(e) {
    loading.style.display = 'none';
    document.getElementById('loc-summary').textContent = 'Нет данных по этой локации.';
    console.warn('[Location]', e.message);
  }
}

function renderLocationPanel(d) {
  const riskColor = RISK_COLORS[d.risk_level] || '#6A6458';

  document.getElementById('loc-name').textContent = d.location || '';
  document.getElementById('loc-score').textContent = (d.overall_risk || '—') + ' / 100';
  const lvl = document.getElementById('loc-level');
  lvl.textContent = d.risk_level || '';
  lvl.style.cssText = `background:${riskColor}22;color:${riskColor};border:1px solid ${riskColor}44;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px`;

  document.getElementById('loc-summary').textContent = d.summary || '';

  // Ключевые риски
  const risksEl = document.getElementById('loc-risks');
  risksEl.innerHTML = '';
  (d.key_risks || []).forEach(risk => {
    const col = DC_COLORS[risk.domain] || '#6A6458';
    const tag = document.createElement('div');
    tag.className = 'loc-risk-tag';
    tag.style.borderColor = col + '44';
    tag.style.color = col;
    tag.textContent = risk.description;
    risksEl.appendChild(tag);
  });

  // Прогноз
  const out = document.getElementById('loc-outlook');
  out.textContent = (d.horizon ? d.horizon + ' · ' : '') + (d.outlook || '');

  // Сигналы
  const sigList = document.getElementById('loc-signals-list');
  sigList.innerHTML = '';
  (d.watch_signals || []).forEach(s => {
    const el = document.createElement('div');
    el.className = 'loc-signal';
    el.innerHTML = '<span style="color:#B8973A">·</span> ' + s;
    sigList.appendChild(el);
  });

  const closeBtn = document.getElementById('loc-close');
  if (closeBtn) closeBtn.onclick = () => {
    document.getElementById('location-panel').classList.remove('open');
  };
}

const RISK_LEVELS = {
  'критический': 'ai-risk-critical',
  'высокий':     'ai-risk-high',
  'умеренный':   'ai-risk-med',
  'низкий':      'ai-risk-med'
};

async function runAIScore() {
  const btn = document.getElementById('ai-score-btn');
  btn.classList.add('loading');
  btn.textContent = '◆ Анализирую...';

  try {
    const r = await fetch(API_BASE + '/api/score', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-Key': 'archive2026'
      },
      body: JSON.stringify({ top: 5 }),
      signal: AbortSignal.timeout(30000)
    });

    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    showAIPanel(data);

    // Обновляем маркеры событий с AI-оценками
    if (data.by_domain) {
      const aiMap = {};
      Object.values(data.by_domain).flat().forEach(ev => {
        if (ev.ai_score) aiMap[ev.id] = ev;
      });
      ALL_EVENTS = ALL_EVENTS.map(ev => aiMap[ev.id] ? { ...ev, ...aiMap[ev.id] } : ev);
      filtered = filter === 'all' ? [...ALL_EVENTS] : ALL_EVENTS.filter(e => e.domain === filter);
      renderMarkers(); renderList();
    }
  } catch(e) {
    console.warn('[AI]', e.message);
    // Пробуем кэш
    try {
      const r2 = await fetch(API_BASE + '/api/scores');
      if (r2.ok) {
        const data = await r2.json();
        if (data.domain_summary && Object.keys(data.domain_summary).length > 0) {
          showAIPanel(data);
        } else {
          btn.textContent = '◆ Анализ доменов';
          alert('Нет данных для анализа. Попробуйте позже.');
        }
      }
    } catch(_) {}
  } finally {
    btn.classList.remove('loading');
    btn.textContent = '◆ Анализ доменов';
  }
}

function showAIPanel(data) {
  const summary = data.domain_summary || {};
  const rows = document.getElementById('ai-domain-rows');
  rows.innerHTML = '';

  const domainOrder = ['geopolitics','climate','economy','technology','social'];
  const domainNames = {
    climate:'Климат', economy:'Экономика',
    geopolitics:'Геополитика', technology:'Технологии', social:'Социум'
  };

  domainOrder.forEach(dom => {
    const s = summary[dom];
    if (!s) return;

    const trendClass = s.trend === '↑' ? 'ai-trend-up' : s.trend === '↓' ? 'ai-trend-down' : 'ai-trend-flat';
    const riskClass  = RISK_LEVELS[s.risk_level] || 'ai-risk-med';

    const row = document.createElement('div');
    row.className = 'ai-domain-row';
    row.innerHTML = `
      <div class="ai-domain-name">
        <span>${domainNames[dom] || dom}</span>
        <span><span class="${riskClass}">${s.risk_level}</span> <span class="${trendClass}">${s.trend}</span></span>
      </div>
      <div class="ai-domain-note">${s.note || ''}</div>`;

    // Клик — фильтр по домену
    row.onclick = () => {
      document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
      document.querySelector(`.fb[data-d="${dom}"]`)?.classList.add('active');
      filter = dom;
      filtered = ALL_EVENTS.filter(e => e.domain === dom);

// ── SSE LIVE-ПОТОК ────────────────────────────────────────────────────────────
let sseSource = null;
let sseRetries = 0;
const SSE_MAX_RETRIES = 5;

function startSSE() {
  if (!window.EventSource) return; // старый браузер
  if (sseSource) { sseSource.close(); sseSource = null; }

  const params = new URLSearchParams();
  if (filter !== 'all') params.set('domain', filter);
  const url = API_BASE + '/api/stream?' + params.toString();

  sseSource = new EventSource(url);

  sseSource.addEventListener('snapshot', e => {
    try {
      const d = JSON.parse(e.data);
      if (d.events && d.events.length > 0) {
        applyEvents(d.events, d.updated);
        console.info('[SSE] Снимок получен:', d.events.length, 'событий');
        sseRetries = 0;
        showLiveIndicator('connected');
      }
    } catch(err) { console.warn('[SSE] snapshot parse error', err); }
  });

  sseSource.addEventListener('update', e => {
    try {
      const d = JSON.parse(e.data);
      if (d.events && d.events.length > 0) {
        // Добавляем новые события к существующим
        const existingIds = new Set(ALL_EVENTS.map(ev => ev.id));
        const newEvs = d.events.filter(ev => !existingIds.has(ev.id));
        if (newEvs.length > 0) {
          // FIX1: cap array size to prevent unbounded memory growth
          ALL_EVENTS = [...newEvs, ...ALL_EVENTS].slice(0, MAX_EVENTS);
          filtered = filter === 'all' ? [...ALL_EVENTS] : ALL_EVENTS.filter(ev => ev.domain === filter);
          _lastRenderedCount = -1;  // force redraw after new events
          updateStats(); renderList(); renderMarkers();
          showLiveIndicator('update', newEvs.length);
          _log('sse', `+${newEvs.length} events, total=${ALL_EVENTS.length}`);
        }
      }
    } catch(err) { console.warn('[SSE] update parse error', err); }
  });

  sseSource.addEventListener('stats', e => {
    try {
      const d = JSON.parse(e.data);
      if (d.updated) {
        const dt = new Date(d.updated);
        document.getElementById('updated').textContent = formatMSK(d.updated);
      }
    } catch(_) {}
  });

  sseSource.addEventListener('reconnect', e => {
    // Worker сказал переподключиться — делаем это через 30с
    sseSource.close();
    sseSource = null;
    const retry = (() => { try { return JSON.parse(e.data).retry || 30000; } catch(_) { return 30000; } })();
    console.info('[SSE] Переподключение через', retry/1000, 'с');
    setTimeout(startSSE, retry);
  });

  sseSource.onerror = () => {
    // Не меняем индикатор на ⬛ — просто тихо переподключаемся
    sseRetries++;
    _log('sse', `error, retry ${sseRetries}/${SSE_MAX_RETRIES}`);
    if (sseRetries <= SSE_MAX_RETRIES) {
      const delay = Math.min(30000, 3000 * Math.pow(2, sseRetries - 1));
      setTimeout(startSSE, delay);
    }
  };
}

// FIX6: Close SSE when tab goes to background (mobile Safari kills open connections)
// Reopen when tab becomes visible again
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (sseSource) { sseSource.close(); sseSource = null; }
    _log('sse', 'tab hidden — SSE closed');
  } else {
    _log('sse', 'tab visible — reconnecting SSE');
    setTimeout(startSSE, 500);
  }
});
window.addEventListener('beforeunload', () => {

});

// Индикатор живого соединения — статусная строка под заголовком
function showLiveIndicator(state, count) {
  const icon = document.getElementById('live-status-icon');
  const text = document.getElementById('live-status-text');
  if (!icon || !text) return;

  if (state === 'connected') {
    icon.textContent = '🟩';
    text.textContent = 'Активно';
    text.style.color = '#E8E0D0';
  } else if (state === 'update') {
    icon.textContent = '🟨';
    text.textContent = count ? `Пришли новые события · +${count}` : 'Пришли новые события';
    text.style.color = '#D4AF5A';
    setTimeout(() => {
      icon.textContent = '🟩';
      text.textContent = 'Активно';
      text.style.color = '#E8E0D0';
    }, 4000);
  } else {
    icon.textContent = '⬛️';
    text.textContent = 'Соединение прервано';
    text.style.color = 'rgba(232,224,208,0.4)';
  }
}

// ═══════════════════════════════════════════════════════════════════
// LIVE EXTERNAL FEED — http://62.238.37.129:8001/events.json
// Schema: [{title, category:[], date, coordinates:[lon,lat]}]
// Normalised to internal schema: {id,title,domain,lat,lng,severity,
//   region,summary,source,date}
// ═══════════════════════════════════════════════════════════════════

const EXT_FEED_URL = 'https://archive-api.luven-medical-msk.workers.dev/api/proxy/events-feed'; // HTTP proxied via Worker (mixed-content fix)
const EXT_FEED_INTERVAL_MS = 60000;

// Category → internal domain (for colour/filter compatibility)
const CAT_TO_DOMAIN = {
  wildfires:'climate', wildfire:'climate', fire:'climate',
  volcanoes:'climate', volcano:'climate',
  floods:'climate',    flood:'climate',    floodhub:'climate',
  storms:'climate',    storm:'climate',
  cyclone:'climate',   hurricane:'climate', typhoon:'climate',
  earthquakes:'climate', earthquake:'climate', seismic:'climate',
  drought:'climate',   landslide:'climate', tsunami:'climate',
  epidemic:'social',   disease:'social',
  // default fallback → geopolitics
};

// Category → distinct hex colour (drawn OVER domain colour for clarity)
const CAT_COLOR = {
  wildfires:'#E84030', wildfire:'#E84030',
  volcanoes:'#9B30C8', volcano:'#9B30C8',
  floods:'#2070E8',    flood:'#2070E8',
  storms:'#E87018',    storm:'#E87018',
  cyclone:'#E04090',   hurricane:'#E04090', typhoon:'#E04090',
  earthquakes:'#D8C020', earthquake:'#D8C020',
  drought:'#C87830',
  landslide:'#A05828',
  tsunami:'#40B0D0',
  epidemic:'#50C880',
};

// Stable fingerprint: hash of title+lon+lat+date
function _extFP(item) {
  const raw = (item.title||'') + '|' +
    (item.coordinates||[]).join(',') + '|' +
    (item.date||'');
  let h = 0;
  for (let i = 0; i < raw.length; i++) {
    h = ((h << 5) - h) + raw.charCodeAt(i);
    h |= 0;
  }
  return 'ext_' + (h >>> 0).toString(16);
}

function _catInfo(categories) {
  const cats = Array.isArray(categories) ? categories : [categories||''];
  for (const c of cats) {
    const key = c.toLowerCase().trim();
    const domain = CAT_TO_DOMAIN[key];
    const color  = CAT_COLOR[key];
    if (domain || color) return { domain: domain||'climate', color, label: c };
    // partial match
    for (const [k, d] of Object.entries(CAT_TO_DOMAIN)) {
      if (key.includes(k) || k.includes(key)) {
        return { domain: d, color: CAT_COLOR[k], label: c };
      }
    }
  }
  return { domain: 'geopolitics', color: null, label: cats[0]||'Unknown' };
}

// FIX7+10: O(1) dedup Set with periodic cleanup (prevents infinite growth)
const _extSeenIds = new Set();
let _extSeenCleanupTs = Date.now();

async function loadExternalFeed() {
  try {
    const r = await fetch(EXT_FEED_URL, {
      signal: AbortSignal.timeout(12000),
      headers: { Accept: 'application/json' },
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const raw = await r.json();
    const items = Array.isArray(raw) ? raw : (raw.events || raw.data || []);

    let added = 0;
    const newEvs = [];

    items.forEach(item => {
      // Require coordinates
      if (!item.coordinates || item.coordinates.length < 2) return;
      const id = _extFP(item);
      // Skip if already in our event list
      if (_extSeenIds.has(id)) return;
      // FIX7: use Set for O(1) instead of Array.some() O(n)
      _extSeenIds.add(id);

      const lon = item.coordinates[0];
      const lat = item.coordinates[1];
      if (isNaN(lat) || isNaN(lon)) return;

      const catInfo = _catInfo(item.category);

      // Normalise to existing internal schema
      const ev = {
        id,
        title:    item.title || 'Unknown event',
        domain:   catInfo.domain,
        lat,
        lng:      lon,
        severity: item.severity || 65,   // default moderate if not provided
        region:   item.region || item.country || catInfo.label,
        summary:  item.summary || item.description || '',
        source:   item.source || 'Live Feed',
        date:     item.date || new Date().toISOString().slice(0,10),
        _catColor: catInfo.color,        // extra: category-specific colour
        _catLabel: catInfo.label,
      };
      newEvs.push(ev);
      added++;
    });

    if (added > 0) {
      // Prepend new events; keep list bounded at 500 to avoid memory bloat
      ALL_EVENTS = [...newEvs, ...ALL_EVENTS].slice(0, 500);
      filtered = filter === 'all'
        ? [...ALL_EVENTS]
        : ALL_EVENTS.filter(e => e.domain === filter);
      updateStats();
      renderList();
      renderMarkers();

      const now = new Date();
      document.getElementById('updated').textContent =
        now.toLocaleString('ru-RU', {
          day:'numeric', month:'long',
          hour:'2-digit', minute:'2-digit'
        }) + ' (обновлено)';

      console.info('[ExtFeed] Добавлено новых событий:', added);
    }

  } catch(e) {
    console.warn('[ExtFeed] Ошибка загрузки:', e.message);
  }
}

// Initial load (non-blocking — runs in parallel with tryLoadFresh)
loadExternalFeed();

// 60-second auto-refresh
setInterval(loadExternalFeed, EXT_FEED_INTERVAL_MS);
// FIX10: prune _extSeenIds every 30 min — only keep IDs still in ALL_EVENTS
setInterval(() => {
  const live = new Set(ALL_EVENTS.map(e => e.id));
  for (const id of _extSeenIds) {
    if (!live.has(id)) _extSeenIds.delete(id);
  }
  _log('extfeed', `dedup set pruned, size=${_extSeenIds.size}`);
}, 30 * 60 * 1000);
